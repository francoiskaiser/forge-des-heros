  return `<h3>${esc(b.name)}</h3><p class="mute">${SPECIES[b.species].n} · ${CLASSES[b.cls].n} ${b.level}${BACKGROUNDS[b.bg] ? " · " + esc(BACKGROUNDS[b.bg].n) : ""}${s.sub ? " · " + esc(s.sub) : ""} · ${esc(ALIGN_L[b.align] || b.align)}</p>
    <div class="ro-abil">${ABK.map((k) => { const sv = s.saves.find((x) => x.k === k); return `<div><span class="lbl">${ABIL[k].s}</span><b>${sg(s.m[k])}</b><small>${s.ab[k]} · JS ${sg(sv.v)}${sv.pr ? "●" : ""}</small></div>`; }).join("")}</div>
    <dl class="facts"><div><dt>PV</dt><dd>${p.hp}/${s.hpMax}${p.temp ? " (+" + p.temp + " temp.)" : ""} · dés de vie ${b.level - (p.hdUsed || 0)}/${b.level}</dd></div>
      <div><dt>Défense</dt><dd>CA ${s.ac} (${esc(s.acNote)}) · initiative ${sg(s.init)} · vitesse ${fmtM(s.speed)}</dd></div>
      <div><dt>Sens</dt><dd>Perception passive ${10 + s.perc}${s.darkvision ? " · vision dans le noir " + fmtM(s.darkvision) : ""}</dd></div>
      <div><dt>Compétences maîtrisées</dt><dd>${s.skills.filter((k) => k.pr).map((k) => k.n + " " + sg(k.v) + (k.pr === 2 ? " (exp.)" : "")).join(", ") || "—"}</dd></div>
      <div><dt>Attaques</dt><dd>${s.attacks.map((a) => `${esc(a.n)} ${sg(a.hit)} (${esc(a.dmg)})`).join(" · ")}</dd></div>
      ${s.casting ? `<div><dt>Sorts</dt><dd>DD ${s.casting.dc} · attaque ${sg(s.casting.atk)}</dd></div>` : ""}
      ${Object.keys(byLv).sort((x, y) => x - y).map((l) => `<div><dt>${l == 0 ? "Tours de magie" : "Niveau " + l}</dt><dd>${byLv[l].join(", ")}</dd></div>`).join("")}
      <div><dt>Ressources</dt><dd>${s.resources.map((r) => `${r.n} ${r.max - ((p.res || {})[r.k] || 0)}/${r.max}`).join(" · ") || "—"}</dd></div>
      <div><dt>Inventaire</dt><dd>${(p.inv || []).map((i) => (i.q > 1 ? i.q + "× " : "") + esc(itemName(i)) + (i.eq ? " ✓" : "")).join(", ")} · ${p.gold} po</dd></div>
      <div><dt>Langues</dt><dd>${s.langs.map(esc).join(", ")}</dd></div>
      ${b.details.divinite ? `<div><dt>Divinité ou foi</dt><dd>${esc(b.details.divinite)}</dd></div>` : ""}
      ${b.details.histoire ? `<div><dt>Histoire</dt><dd>${esc(b.details.histoire)}</dd></div>` : ""}
      ${p.notes ? `<div><dt>Notes du joueur</dt><dd>${esc(p.notes)}</dd></div>` : ""}
    </dl>
    <details class="feat"><summary>Aptitudes (${s.features.length})</summary><div class="ro-feats">${s.features.map((f) => `<p><b>${esc(f.n)}</b> — ${esc(f.d)}</p>`).join("")}</div></details>
    <div class="row-btns"><button class="btn small ghost danger" data-a="gmKick" data-id="${esc(m.id)}">Retirer du groupe</button></div>`;
}

function gmInit(doc) {
  const ord = initOrder(doc);
  const memById = {};
  Live.members.forEach((m) => (memById[m.id] = m));
  const rows = ord.list.map((e, i) => {
    let hp = "";
    if (e.kind === "pc" && memById[e.ref]) { const m = memById[e.ref], s = memberStats(m); if (s) hp = `<span class="ihp">${m.p.hp}/${s.hpMax}</span>${hpBar(m.p.hp, s.hpMax)}`; }
    if (e.kind === "monstre") hp = `<span class="ihp">${e.hp}/${e.max}</span>${hpBar(e.hp, e.max)}<div class="ihp-btns"><button class="mini dmg" data-a="monHp" data-id="${e.id}" data-d="-1" aria-label="Dégâts">−</button><input class="mon-amt" id="mon-${e.id}" type="number" inputmode="numeric" placeholder="PV"><button class="mini heal" data-a="monHp" data-id="${e.id}" data-d="1" aria-label="Soins">+</button></div>`;
    return `<li class="irow ${i === ord.turn ? "now" : ""} ${e.kind} ${e.kind === "monstre" && e.hp <= 0 ? "dead" : ""}">
      <div class="iv-ctl"><button class="mini" data-a="initAdj" data-id="${e.id}" data-d="1" aria-label="Augmenter">▲</button><span class="iv">${e.v}</span><button class="mini" data-a="initAdj" data-id="${e.id}" data-d="-1" aria-label="Diminuer">▼</button></div>
      <div class="i-main"><b>${esc(e.name)}</b>${e.kind === "monstre" ? `<span class="mute small">CA ${e.ac}${e.mk ? ` · <button class="linkish" data-a="monView" data-k="${esc(e.mk)}">voir la fiche</button>` : ""}</span>` : ""}<div class="i-hp">${hp}</div></div>
      <button class="icon-btn" data-a="initDel" data-id="${e.id}" aria-label="Retirer">${ICON.close}</button>
    </li>`;
  }).join("");
  return `<div class="cols">
    <section class="panel"><div class="adv-head"><h3 class="ph">Ordre de combat</h3>${ord.list.length ? `<span class="mute">Round <b>${ord.round}</b></span>` : ""}</div>
      ${ord.list.length ? `<button class="btn fight-btn wide" data-a="fightOpen">${ICON.sword} Mode combat plein écran</button><ol class="init-list">${rows}</ol><div class="row-btns"><button class="btn primary" data-a="initNext">Tour suivant →</button><button class="btn ghost" data-a="initPrev">← Précédent</button><button class="btn ghost danger" data-a="initClear">Terminer le combat</button></div>` : '<p class="mute">Aucun combat en cours. Lancez l’initiative du groupe et ajoutez des monstres.</p>'}
    </section>
    <section class="panel"><h3 class="ph">Préparer le combat</h3>
      <button class="btn" data-a="initParty">${ICON.d20} Lancer l’initiative du groupe</button>
      <p class="mute small">Lance d20 + initiative pour chaque personnage du groupe et remplace leurs entrées.</p>
      <h4>Ajouter des monstres</h4>
      <p class="mute small">Depuis le <button class="linkish" data-a="gmTab" data-v="bestiaire">bestiaire du SRD</button> (statistiques complètes), ou à la main :</p>
      <label class="field"><span>Nom</span><input id="monName" placeholder="Ex. Gobelin"></label>
      <div class="mon-grid">
        <label class="field"><span>Nombre</span><input id="monN" type="number" inputmode="numeric" value="1" min="1" max="20"></label>
        <label class="field"><span>Bonus d’init.</span><input id="monInit" type="number" inputmode="numeric" value="0"></label>
        <label class="field"><span>PV</span><input id="monHp" type="number" inputmode="numeric" value="7"></label>
        <label class="field"><span>CA</span><input id="monAc" type="number" inputmode="numeric" value="13"></label>
      </div>
      <button class="btn" data-a="monAdd">${ICON.plus} Ajouter et lancer l’initiative</button>
    </section></div>`;
}

function gmNotes(doc) {
  return `<section class="panel"><h3 class="ph">Notes de campagne</h3><p class="mute small">Visibles uniquement par vous. Enregistrées automatiquement.</p>
    <textarea id="gmNotes" class="notes" data-gmnotes="1" rows="16" placeholder="Intrigues, PNJ, lieux, trésors à distribuer…">${esc(doc ? doc.notes || "" : "")}</textarea>
    <div class="row-btns"><button class="btn small ghost danger" data-a="advDeleteAsk">Supprimer l’aventure</button></div></section>`;
}

/* ---------- Actions ---------- */
async function saveInit(mutator) {
  const doc = Live.doc;
  if (!doc) return;
  const it = clone(doc.init || { list: [], turn: 0, round: 1 });
  it.list = it.list || [];
  mutator(it);
  try { await FB.adv(S.gmCode).update({ init: it }); } catch (e) { toast("Enregistrement impossible. Vérifiez votre connexion."); }
}
function sortedIds(it) { return it.list.slice().sort((a, b) => b.v - a.v || (b.dex || 0) - (a.dex || 0)).map((e) => e.id); }

async function advAct(a, d, el) {
  if (typeof hbAct === "function" && (await hbAct(a, d, el))) return true;
  if (typeof srdAct === "function" && (await srdAct(a, d, el))) return true;
  if (typeof combatAct === "function" && (await combatAct(a, d, el))) return true;
  if (typeof hbioAct === "function" && (await hbioAct(a, d, el))) return true;
  if (typeof accAct === "function" && (await accAct(a, d, el))) return true;
  const ch = curChar();
  switch (a) {
    case "advJoin": {
      const code = normCode($("#joinCode").value);
      if (!code) { toast("Le code fait 6 caractères, par exemple DRG-7K2."); return true; }
      try {
        const snap = await FB.adv(code).get();
        if (!snap.exists) { toast("Aucune aventure avec ce code. Vérifiez auprès du MJ."); return true; }
        ch.adv = code; ch.advName = snap.data().name;
        await Store.put(ch);
        pushMember(ch);
        toast("Vous avez rejoint « " + snap.data().name + " »");
      } catch (e) { toast("Connexion impossible. Vérifiez votre réseau."); }
      return true;
    }
    case "advLeave": {
      const code = ch.adv;
      try { await FB.members(code).doc(FB.uid + "_" + ch.id).delete(); } catch (e) { }
      ch.adv = null; ch.advName = null; await Store.put(ch); Live.stop();
      toast("Vous avez quitté l’aventure");
      return true;
    }
    case "advCreateOpen": S.modal = { k: "advCreate" }; return true;
    case "advCreate": {
      const name = ($("#advName").value || "").trim();
      if (!name) { toast("Donnez un nom à l’aventure."); return true; }
      try {
        let code, tries = 0;
        do { code = newCode(); tries++; } while ((await FB.adv(code).get()).exists && tries < 5);
        await FB.adv(code).set({ name, gm: FB.uid, created: Date.now(), notes: "", init: { list: [], turn: 0, round: 1 } });
        try { const k = newGmKey(); await gmKeyRef(code).set({ k }); GmKey.code = code; GmKey.k = k; } catch (e) { }
        GmList.add(code, name);
        S.modal = null; S.gmCode = code; S.gmTab = "groupe"; S.view = "gm";
        toast("Aventure créée. Code : " + code);
      } catch (e) { toast("Création impossible : vérifiez la configuration Firebase."); }
      return true;
    }
    case "gmOpen": S.gmCode = d.code; S.gmTab = "groupe"; S.view = "gm"; window.scrollTo(0, 0); return true;
    case "gmTab": S.gmTab = d.v; return true;
    case "advRetry": Live.retry(); return true;
    case "gmFind": S.modal = { k: "gmFind" }; return true;
    case "gmFindGo": {
      const code = normCode($("#gmFindCode").value);
      if (!code) { toast("Le code fait 6 caractères, par exemple DRG-7K2."); return true; }
      S.modal = null; S.gmCode = code; S.gmTab = "groupe"; S.view = "gm"; window.scrollTo(0, 0); return true;
    }
    case "gmForget": GmList.remove(d.code); Live.stop(); S.view = "home"; toast("Aventure retirée de votre liste"); return true;
    case "copyUid": { try { await navigator.clipboard.writeText(FB.uid); toast("Identifiant copié"); } catch (e) { toast(FB.uid); } return false; }
    case "gmKeyShow": GmKey.show = !GmKey.show; return true;
    case "gmKeyCopy": { try { await navigator.clipboard.writeText(GmKey.k); toast("Clé copiée"); } catch (e) { GmKey.show = true; } return true; }
    case "gmKeyNew": {
      const k = newGmKey();
      try { await gmKeyRef(S.gmCode).set({ k }); GmKey.code = S.gmCode; GmKey.k = k; GmKey.show = true; toast("Nouvelle clé de MJ créée"); }
      catch (e) { toast("Impossible d’enregistrer la clé : mettez à jour les règles Firestore."); }
      return true;
    }
    case "gmRecover": {
      const code = S.gmCode, k = ($("#gmKeyIn").value || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (k.length !== 12) { toast("La clé fait 12 caractères, par exemple 7KQ2-MX4P-ZT9C."); return true; }
      const key = k.slice(0, 4) + "-" + k.slice(4, 8) + "-" + k.slice(8);
      try {
        await FB.adv(code).update({ gm: FB.uid, gmKey: key });
        // la clé utilisée a été vue dans le document : on la remplace aussitôt
        const nk = newGmKey();
        await gmKeyRef(code).set({ k: nk });
        await FB.adv(code).update({ gmKey: firebase.firestore.FieldValue.delete() });
        GmKey.code = code; GmKey.k = nk; GmKey.show = false;
        GmList.add(code, (Live.doc && Live.doc.name) || code);
        toast("Vous êtes maintenant le MJ de cette aventure. Une nouvelle clé a été créée.");
      } catch (e) { toast("Clé refusée. Vérifiez-la (ou les règles Firestore)."); }
      return true;
    }
    case "shareCode": { try { await navigator.share({ title: "Forge des Héros", text: "Rejoins mon aventure « " + ((Live.doc && Live.doc.name) || "") + " » dans Forge des Héros avec le code " + S.gmCode + " (fiche › onglet Aventure).", url: location.origin + location.pathname }); } catch (e) { } return true; }
    case "copyCode": { try { await navigator.clipboard.writeText(S.gmCode); toast("Code copié : " + S.gmCode); } catch (e) { toast("Code : " + S.gmCode); } return false; }
    case "gmDetail": S.modal = { k: "gmDetail", id: d.id }; return true;
    case "gmKick": { try { await FB.members(S.gmCode).doc(d.id).delete(); toast("Personnage retiré du groupe"); } catch (e) { toast("Suppression impossible."); } S.modal = null; return true; }
    case "advDeleteAsk": S.modal = { k: "advDelete" }; return true;
    case "advDelete": {
      try {
        const q = await FB.members(S.gmCode).get();
        await Promise.all(q.docs.map((x) => x.ref.delete()));
        try { await gmKeyRef(S.gmCode).delete(); } catch (e) { }
        const h = await FB.adv(S.gmCode).collection("homebrew").get();
        await Promise.all(h.docs.map((x) => x.ref.delete()));
        await FB.adv(S.gmCode).delete();
      } catch (e) { }
      GmList.remove(S.gmCode); Live.stop(); S.modal = null; S.view = "home"; toast("Aventure supprimée");
      return true;
    }
    case "initParty": {
      const mem = Live.members.map((m) => ({ m, s: memberStats(m) })).filter((x) => x.s);
      if (!mem.length) { toast("Aucun joueur dans le groupe pour l’instant."); return true; }
      await saveInit((it) => {
        it.list = it.list.filter((e) => e.kind !== "pc");
        mem.forEach(({ m, s }) => { const r = rollD20(s.init, "normal"); it.list.push({ id: "pc_" + m.id, kind: "pc", ref: m.id, name: m.name, v: r.total, dex: s.m.dex }); });
        it.turn = 0; it.round = 1;
      });
      toast("Initiative lancée pour le groupe");
      return true;
    }
    case "monAdd": {
      const name = ($("#monName").value || "").trim() || "Monstre";
      const n = Math.max(1, Math.min(20, parseInt($("#monN").value, 10) || 1));
      const bonus = parseInt($("#monInit").value, 10) || 0, hp = Math.max(1, parseInt($("#monHp").value, 10) || 1), ac = parseInt($("#monAc").value, 10) || 10;
      await saveInit((it) => {
        for (let i = 0; i < n; i++) { const r = rollD20(bonus, "normal"); it.list.push({ id: "m_" + uid(), kind: "monstre", name: n > 1 ? `${name} ${i + 1}` : name, v: r.total, dex: bonus, hp, max: hp, ac }); }
      });
      return true;
    }
    case "monHp": {
      const amt = Math.abs(parseInt(($("#mon-" + d.id) || {}).value, 10) || 1);
      await saveInit((it) => { const e = it.list.find((x) => x.id === d.id); if (e) e.hp = Math.max(0, Math.min(e.max, e.hp + amt * +d.d)); });
      return true;
    }
    case "initAdj": await saveInit((it) => { const e = it.list.find((x) => x.id === d.id); if (e) e.v += +d.d; }); return true;
    case "initDel": await saveInit((it) => { const ids = sortedIds(it), cur = ids[it.turn]; it.list = it.list.filter((x) => x.id !== d.id); const ni = sortedIds(it).indexOf(cur); it.turn = ni >= 0 ? ni : Math.min(it.turn, Math.max(0, it.list.length - 1)); }); return true;
    case "initNext": await saveInit((it) => { if (!it.list.length) return; it.turn = (it.turn || 0) + 1; if (it.turn >= it.list.length) { it.turn = 0; it.round = (it.round || 1) + 1; } }); return true;
    case "initPrev": await saveInit((it) => { if (!it.list.length) return; it.turn = (it.turn || 0) - 1; if (it.turn < 0) { it.turn = it.list.length - 1; it.round = Math.max(1, (it.round || 1) - 1); } }); return true;
    case "initClear": await saveInit((it) => { it.list = []; it.turn = 0; it.round = 1; }); return true;
  }
  return false;
}

  if (m.k === "gmFind") return `<h3>Ouvrir une aventure existante</h3><p class="mute">Vous êtes MJ d’une aventure créée ailleurs ? Entrez son code. Si elle n’appartient pas encore à cet appareil ou à votre compte, vous pourrez la reprendre avec sa clé de MJ.</p><label class="field big"><span>Code d’aventure</span><input id="gmFindCode" placeholder="Ex. DRG-7K2" autocomplete="off" autocapitalize="characters" maxlength="8"></label><div class="row-btns"><button class="btn primary" data-a="gmFindGo">Ouvrir</button></div>`;

/* Forge des Héros — comptes et synchronisation des personnages entre appareils */

const Account = { status: "", unsub: null, busy: false, errCode: null, retry: null };
function syncFailed(e) {
  Account.status = "err"; Account.errCode = (e && e.code) || "unknown";
  clearTimeout(Account.retry);
  Account.retry = setTimeout(() => { if (Account.user()) syncAccount(); }, 20000);
}
window.addEventListener("online", () => { if (Account.user() && Account.status === "err") syncAccount(); });
Account.user = () => (FB.ok && FB.auth && FB.auth.currentUser && !FB.auth.currentUser.isAnonymous ? FB.auth.currentUser : null);

function userChars() { return FB.db.collection("users").doc(FB.uid).collection("chars"); }
function cloudDoc(ch) { return { id: ch.id, b: clone(ch.b), p: clone(ch.p), adv: ch.adv || null, advName: ch.advName || null, updated: ch.updated || Date.now() }; }
function localSaveAll() {
  try { localStorage.setItem("forge-heros", JSON.stringify(S.chars)); } catch (e) { }
  Store.mem = {}; S.chars.forEach((c) => (Store.mem[c.id] = c));
}

/* Appelés par Store.put et Store.del */
const cloudTimers = {};
function cloudPut(ch) {
  const u = Account.user();
  if (!u) return;
  ch.synced = true; ch.owner = u.uid;
  clearTimeout(cloudTimers[ch.id]);
  cloudTimers[ch.id] = setTimeout(() => {
    userChars().doc(ch.id).set(cloudDoc(ch)).then(() => { if (Account.status !== "ok") { Account.status = "ok"; liveRender(); } })
      .catch((e) => { syncFailed(e); liveRender(); });
  }, 600);
}
function cloudDel(id) { if (Account.user()) userChars().doc(id).delete().catch(() => { }); }

/* Fusion initiale : le plus récent l’emporte ; un personnage déjà synchronisé mais absent du compte a été supprimé ailleurs */
async function syncAccount() {
  const u = Account.user();
  if (!u) return;
  Account.status = "sync"; render();
  try {
    const snap = await userChars().get();
    const remote = {};
    snap.docs.forEach((d) => (remote[d.id] = d.data()));
    const uploads = [];
    // le personnage d’exemple de cet appareil n’est pas recopié dans un compte qui a déjà des personnages
    if (snap.docs.length) S.chars = S.chars.filter((ch) => !(ch.example && !remote[ch.id]));
    S.chars = S.chars.filter((ch) => {
      const r = remote[ch.id];
      if (!r) { if (ch.synced && ch.owner === u.uid) return false; uploads.push(ch); return true; }
      if ((r.updated || 0) > (ch.updated || 0)) Object.assign(ch, { b: migrate(r.b), p: r.p, adv: r.adv || null, advName: r.advName || null, updated: r.updated });
      else if ((ch.updated || 0) > (r.updated || 0)) uploads.push(ch);
      ch.synced = true; ch.owner = u.uid;
      return true;
    });
    Object.values(remote).forEach((r) => { if (!S.chars.some((c) => c.id === r.id)) S.chars.push({ id: r.id, b: migrate(r.b), p: r.p, adv: r.adv || null, advName: r.advName || null, updated: r.updated, synced: true, owner: u.uid }); });
    await Promise.all(uploads.map((ch) => { ch.synced = true; ch.owner = u.uid; return userChars().doc(ch.id).set(cloudDoc(ch)); }));
    localSaveAll();
    // aventures dont ce compte est le MJ
    try {
      const q = await FB.db.collection("adventures").where("gm", "==", u.uid).get();
      q.docs.forEach((d) => { if (!GmList.get().some((x) => x.code === d.id)) GmList.add(d.id, d.data().name); });
    } catch (e) { }
    S.chars.filter((c) => c.adv).forEach((c) => pushMember(c));
    watchAccount();
    Account.status = "ok"; Account.errCode = null;
  } catch (e) { syncFailed(e); }
  render();
}

/* Écoute en direct : les modifications faites sur un autre appareil arrivent ici */
function watchAccount() {
  if (Account.unsub) Account.unsub();
  Account.unsub = userChars().onSnapshot((q) => {
    let changed = false;
    q.docChanges().forEach((chg) => {
      const r = chg.doc.data(), i = S.chars.findIndex((c) => c.id === chg.doc.id);
      if (chg.type === "removed") {
        if (i >= 0) { S.chars.splice(i, 1); changed = true; if (S.cur === chg.doc.id && S.view === "sheet") S.view = "home"; }
        return;
      }
      if (i < 0) { S.chars.push({ id: r.id, b: migrate(r.b), p: r.p, adv: r.adv || null, advName: r.advName || null, updated: r.updated, synced: true, owner: FB.uid }); changed = true; }
      else if ((r.updated || 0) > (S.chars[i].updated || 0)) { Object.assign(S.chars[i], { b: migrate(r.b), p: r.p, adv: r.adv || null, advName: r.advName || null, updated: r.updated }); changed = true; }
    });
    if (changed) { localSaveAll(); liveRender(); }
  }, () => { });
}

/* Passage vers un compte existant : le compte anonyme de cet appareil change d’identifiant.
   On retire ses fiches des aventures et on prépare le transfert des aventures dont il est MJ. */
async function switchAccount(signIn) {
  const oldUid = FB.uid;
  await Promise.all(S.chars.filter((c) => c.adv).map((c) => FB.members(c.adv).doc(oldUid + "_" + c.id).delete().catch(() => { })));
  const claims = {};
  for (const g of GmList.get()) {
    const t = uid() + uid() + uid();
    try { const d = await FB.adv(g.code).get(); if (d.exists && d.data().gm === oldUid) { await FB.adv(g.code).update({ claim: t }); claims[g.code] = t; } } catch (e) { }
  }
  await signIn();
  for (const [code, t] of Object.entries(claims)) {
    try { await FB.adv(code).update({ gm: FB.uid, claimProof: t, claim: firebase.firestore.FieldValue.delete() }); } catch (e) { }
  }
}

const authMsg = (e) => AUTH_ERR[e && e.code] || "Connexion impossible" + (e && e.code ? " (" + e.code + ")" : "") + ".";

async function afterLogin(kind) {
  S.modal = null; S.acc = { mode: "in" };
  toast(kind === "new" ? "Compte créé. Vos personnages sont synchronisés." : "Connecté. Synchronisation de vos personnages…");
  await syncAccount();
}

async function accAct(a, d) {
  if (typeof settingsAct === "function" && (await settingsAct(a, d))) return true;
  switch (a) {
    case "accOpen": S.view = "account"; S.acc = { mode: "in" }; window.scrollTo(0, 0); return true;
    case "accMode": S.acc = { mode: d.v }; return true;
    case "accGoogle": {
      if (Account.busy) return true;
      Account.busy = true;
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const cur = FB.auth.currentUser;
        try {
          if (cur && cur.isAnonymous) await cur.linkWithPopup(provider);
          else await FB.auth.signInWithPopup(provider);
        } catch (e) {
          if (e.code === "auth/credential-already-in-use" && e.credential) await switchAccount(() => FB.auth.signInWithCredential(e.credential));
          else throw e;
        }
        await afterLogin();
      } catch (e) { S.acc = { mode: "in", err: authMsg(e) }; }
      Account.busy = false;
      return true;
    }
    case "accEmail": {
      if (Account.busy) return true;
      const email = ($("#accEmail").value || "").trim(), pw = $("#accPw").value || "", mode = (S.acc && S.acc.mode) || "in";
      if (!email || !pw) { S.acc = { mode, err: "Saisissez votre e-mail et votre mot de passe.", email }; return true; }
      Account.busy = true;
      try {
        const cur = FB.auth.currentUser;
        if (mode === "new") {
          const cred = firebase.auth.EmailAuthProvider.credential(email, pw);
          if (cur && cur.isAnonymous) await cur.linkWithCredential(cred);
          else await FB.auth.createUserWithEmailAndPassword(email, pw);
          await afterLogin("new");
        } else {
          if (cur && cur.isAnonymous) await switchAccount(() => FB.auth.signInWithEmailAndPassword(email, pw));
          else await FB.auth.signInWithEmailAndPassword(email, pw);
          await afterLogin();
        }
      } catch (e) { S.acc = { mode, err: authMsg(e), email }; }
      Account.busy = false;
      return true;
    }
    case "accReset": {
      const email = ($("#accEmail").value || "").trim();
      if (!email) { S.acc = { mode: "in", err: "Saisissez d’abord votre adresse e-mail." }; return true; }
      try { await FB.auth.sendPasswordResetEmail(email); S.acc = { mode: "in", info: "E-mail envoyé à " + email + ". Suivez le lien pour choisir un nouveau mot de passe.", email }; }
      catch (e) { S.acc = { mode: "in", err: authMsg(e), email }; }
      return true;
    }
    case "accRetry": S.modal = null; await syncAccount(); toast(Account.status === "ok" ? "Synchronisé" : "Échec : " + (Account.errCode || "inconnu")); return true;
    case "accOutDo": {
      if (Account.unsub) { Account.unsub(); Account.unsub = null; }
      Live.stop();
      // Les personnages du compte quittent cet appareil ; ceux créés hors connexion restent.
      S.chars = S.chars.filter((c) => !c.synced);
      localSaveAll();
      try { localStorage.removeItem("forge-gm"); } catch (e) { }
      await FB.auth.signOut();
      try { await FB.auth.signInAnonymously(); } catch (e) { }
      Account.status = ""; S.modal = null; S.acc = { mode: "in" };
      toast("Déconnecté. Vos personnages restent dans votre compte.");
      return true;
    }
  }
  return false;
}

/* ---------- Thème ---------- */
const Theme = {
  get() { try { return localStorage.getItem("forge-theme") || "dark"; } catch (e) { return "dark"; } },
  set(v) { try { localStorage.setItem("forge-theme", v); } catch (e) { } this.apply(); },
  resolved() {
    const v = this.get();
    if (v !== "system") return v;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  },
  apply() {
    const r = this.resolved();
    document.documentElement.setAttribute("data-forge-theme", r);
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", r === "light" ? "#f2ebdf" : "#15110e");
  },
};
Theme.apply();
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: light)");
  const onChange = () => { if (Theme.get() === "system") Theme.apply(); };
  if (mq.addEventListener) mq.addEventListener("change", onChange); else if (mq.addListener) mq.addListener(onChange);
}

async function settingsAct(a, d) {
  switch (a) {
    case "openSettings": S.view = "account"; S.acc = { mode: "in" }; S.modal = null; window.scrollTo(0, 0); return true;
    case "setTheme": Theme.set(d.v); return true;
    case "langSoon": toast(d.v === "en" ? "L’anglais est disponible dans l’app installée." : "Cette langue arrive bientôt."); return false;
    case "setLang": {
      if (d.v === LANG) return false;
      try { localStorage.setItem("forge-lang", d.v); } catch (e) { }
      location.href = LANG === "fr" ? "en/" : "../";
      return false;
    }
    case "noop": return false;
    case "accOutAsk": S.acc = Object.assign({}, S.acc, { confirmOut: true }); return true;
    case "accOutCancel": S.acc = { mode: "in" }; return true;
    case "fbOpen": S.modal = { k: "feedback", type: d.v }; return true;
    case "fbType": { const msg = ($("#fbMsg") || {}).value, email = ($("#fbEmail") || {}).value; S.modal = { k: "feedback", type: d.v, msg, email }; return true; }
    case "fbSend": {
      const msg = ($("#fbMsg").value || "").trim(), email = ($("#fbEmail").value || "").trim(), type = S.modal.type;
      if (msg.length < 5) { S.modal = Object.assign({}, S.modal, { msg, email, err: "Décrivez en quelques mots, s’il vous plaît." }); return true; }
      if (!FB.ok) { S.modal = Object.assign({}, S.modal, { msg, email, err: "L’envoi n’est possible que dans l’app installée, connectée à internet." }); return true; }
      const tech = $("#fbTech") ? $("#fbTech").checked : false;
      const ch = curChar();
      const doc = { type, message: msg, email: email || null, uid: FB.uid, version: APP_VERSION, created: Date.now(),
        device: tech ? { ua: navigator.userAgent.slice(0, 300), screen: window.innerWidth + "x" + window.innerHeight, theme: Theme.resolved(), standalone: !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) } : null,
        context: tech ? { view: S.view, tab: S.tab, cls: ch ? ch.b.cls : null, level: ch ? ch.b.level : null } : null };
      try { await FB.db.collection("feedback").add(doc); S.modal = { k: "feedback", type, sent: true }; }
      catch (e) { S.modal = Object.assign({}, S.modal, { msg, email, err: "Envoi impossible (" + ((e && e.code) || "erreur") + "). Vérifiez votre connexion." }); }
      return true;
    }
  }
  return false;
}

const HB_RARITY = [K("commun"), K("peu commun"), K("rare"), K("très rare"), K("légendaire"), K("artefact")];
const HB_RARITY_L = { [K("commun")]: "Commun", [K("peu commun")]: "Peu commun", [K("rare")]: "Rare", [K("très rare")]: "Très rare", [K("légendaire")]: "Légendaire", [K("artefact")]: "Artefact" };

/* Aptitudes de sous-classe du SRD sans étiquette entre parenthèses (remplacées par une sous-classe maison) */
const SUB_UNTAGGED = {
  clerc: ["Disciple de la vie", "Préservation de la vie"],
  druide: ["Sorts du cercle", "Aide de la terre"],
  moine: ["Technique de la main ouverte"],
  rodeur: ["Savoir du chasseur", "Proie du chasseur"],
  ensorceleur: ["Résilience draconique", "Sorts draconiques"],
  magicien: ["Savant en évocation", "Tour de magie puissant"],
};
function isSubFeat(cls, n) {
  const m = String(n).match(/\(([^)]*)\)$/);
  if (m && !/\d/.test(m[1])) return true;
  return (SUB_UNTAGGED[cls] || []).includes(n);
}

const hbKey = (d) => "hb_" + d.id;
/* Incantation donnée par une sous-classe : celle de l’entrée, sinon celle du catalogue */
function hbCastOf(d) {
  if (d.cast !== undefined) return d.cast && ABIL[d.cast.ab] ? d.cast : null;
  const sk = typeof PHB_RAW !== "undefined" && PHB_RAW["hb_" + d.id];
  return (sk && sk.cast) || null;
}
/* Aventure (ou appareil) où une entrée complétée est enregistrée */
function hbCodeOf(id) {
  const hit = Object.entries(HB.cache).find(([, a]) => (a.defs || []).some((x) => x.id === id));
  return hit ? hit[0] : null;
}
const clampLv = (v, lo, hi) => Math.max(lo, Math.min(hi, parseInt(v, 10) || lo));
function parseGear(txt) {
  return String(txt || "").split(/[,\n;]+/).map((x) => x.trim()).filter(Boolean).slice(0, 30).map((x) => {
    const m = x.match(/^(\d+)\s*[x×]?\s+(.+)$/i) || x.match(/^(.+?)\s*[x×]\s*(\d+)$/i);
    if (!m) return [x, 1];
    return /^\d+$/.test(m[1]) ? [m[2], +m[1]] : [m[1], +m[2]];
  });
}

/* Transforme une entrée brute en objet compatible avec les données du SRD */
function hbShape(d) {
  const base = { n: d.n || "Sans nom", hb: true, hbId: d.id, adv: d.adv || null, todo: !!d.sk };
  switch (d.type) {
    case "sub": return { ...base, cls: d.cls, d: d.d || "", feats: d.sk ? (d.feats || []).map((f) => ({ l: f.l, n: "Aptitude de sous-classe", d: HB_TODO_D })) : (d.feats || []).filter((f) => f && f.n).map((f) => ({ l: clampLv(f.l, 3, 20), n: f.n, d: f.d || "" })), spells: d.spells || {}, cast: hbCastOf(d) };
    case "bg": return { ...base, ab: (d.ab || []).slice(0, 3), skills: (d.skills || []).slice(0, 2), tool: d.tool || "—", feat: d.feat || "vigilant", featList: d.feat === "initie" ? d.featList || "clr" : undefined, desc: d.d || "", gear: parseGear(d.gear), gold: Math.max(0, parseInt(d.gold, 10) || 0) };
    case "feat": return { ...base, d: d.d || (d.sk ? HB_TODO_D : ""), cat: HB_CATS.includes(d.cat) ? d.cat : "origine", ab: d.ab || [], pre: d.pre || "" };
    case "spell": {
      const o = { ...base, l: clampLv(d.l, 0, 9), e: SC[d.e] ? d.e : "evo", t: d.t || "1 action", p: d.p || "—", c: d.c || "V, S", du: d.du || "Instantanée", co: !!d.co, ri: !!d.ri, cl: (d.cl || []).filter((k) => CLASSES[k]), d: d.d || "" };
      if (d.dmg) { o.dmg = d.dmg; o.ty = DMG[d.ty] ? d.ty : "force"; }
      if (d.heal) o.heal = d.heal;
      if (d.atk === "cac" || d.atk === "dist") o.atk = d.atk;
      else if (ABIL[d.atk]) o.sv = d.atk;
      if (d.up) o.up = d.up;
      return o;
    }
    case "item": return { ...base, d: d.d || "", rarity: d.rarity || K("peu commun"), attune: !!d.attune, kind: d.kind || "" };
  }
  return null;
}

/* Enregistre une entrée dans les tables de l’app. force = remplace une version plus ancienne */
function hbRegister(d, force) {
  if (!d || !d.id || !d.type) return;
  const k = hbKey(d);
  if (HB_RAW[k] && !force && !HB_RAW[k].sk) return;
  if (d.sk && HB_RAW[k] && !HB_RAW[k].sk) return; // ne remplace pas un texte complété par le squelette
  const shaped = hbShape(d);
  if (!shaped) return;
  HB_RAW[k] = d;
  const tgt = { sub: HBSUB, bg: BACKGROUNDS, feat: hbFeatTable(d), spell: SPELLS, item: HBITEMS }[d.type];
  [FEATS, FIGHTING_STYLES, EPIC_BOONS].forEach((t) => { if (t !== tgt && t[k] && t[k].hb) delete t[k]; });
  if (tgt) tgt[k] = shaped;
}
function hbUnregister(k) {
  delete HB_RAW[k];
  [HBSUB, BACKGROUNDS, FEATS, FIGHTING_STYLES, EPIC_BOONS, SPELLS, HBITEMS].forEach((t) => { if (t[k] && t[k].hb) delete t[k]; });
  if (typeof PHB_RAW !== "undefined" && PHB_RAW[k]) hbRegister(PHB_RAW[k], true); // l’entrée du catalogue redevient « à compléter »
}

/* Entrées utilisées par un personnage, copiées dans b.hb */
function hbUsed(b) {
  const ids = new Set();
  const add = (k) => { if (typeof k === "string" && k.startsWith("hb_")) ids.add(k); };
  add(b.bg); add(b.humanFeat); add(b.subHb); add(b.opts.style); add(b.opts.style2); add(b.opts.boon && b.opts.boon.id);
  if (b.bg && BACKGROUNDS[b.bg]) add(BACKGROUNDS[b.bg].feat);
  Object.values(b.opts.asis || {}).forEach((a) => a && add(a.feat));
  [...(b.cant || []), ...(b.prep || []), ...(b.opts.lore2 || []), ...Object.values(b.opts.arcanum || {})].forEach(add);
  Object.values(b.magic || {}).forEach((m) => { (m.cant || []).forEach(add); add(m.spell); });
  const hs = b.subHb && HBSUB[b.subHb];
  if (hs) Object.values(hs.spells || {}).flat().forEach(add);
  return ids;
}
function hbEmbed(b) {
  if (!b || !b.opts) return;
  const out = {};
  hbUsed(b).forEach((k) => { const d = HB_RAW[k] && !HB_RAW[k].sk ? HB_RAW[k] : b.hb && b.hb[k]; if (d && !d.sk) out[k] = d; });
  if (Object.keys(out).length) b.hb = out; else delete b.hb;
}

/* Cache local : { code: { name, defs: [...] } } */
const HB = {
  cache: {},
  boot() {
    try { this.cache = JSON.parse(localStorage.getItem("forge-hb") || "{}") || {}; } catch (e) { this.cache = {}; }
    Object.values(this.cache).forEach((a) => (a.defs || []).forEach((d) => hbRegister(d, true)));
  },
  persist() { try { localStorage.setItem("forge-hb", JSON.stringify(this.cache)); } catch (e) { } },
  set(code, defs, name) {
    const prev = this.cache[code];
    (prev ? prev.defs || [] : []).forEach((d) => { if (!defs.some((x) => x.id === d.id)) hbUnregister(hbKey(d)); });
    this.cache[code] = { name: name || (prev && prev.name) || code, defs };
    defs.forEach((d) => hbRegister(d, true));
    this.persist();
  },
  codes() {
    const s = new Set();
    if (typeof GmList !== "undefined") GmList.get().forEach((x) => s.add(x.code));
    S.chars.forEach((c) => c.adv && s.add(c.adv));
    return [...s];
  },
  advName(code) {
    const g = typeof GmList !== "undefined" && GmList.get().find((x) => x.code === code);
    if (g) return g.name;
    const ch = S.chars.find((c) => c.adv === code && c.advName);
    return ch ? ch.advName : (this.cache[code] && this.cache[code].name) || code;
  },
  defs(code) { return (this.cache[code] && this.cache[code].defs) || []; },
  async refresh() {
    if (typeof FB === "undefined" || !FB.ok) return;
    await Promise.all(this.codes().map(async (code) => {
      try { const q = await FB.adv(code).collection("homebrew").get(); this.set(code, q.docs.map((d) => d.data()), this.advName(code)); } catch (e) { }
    }));
  },
};

const hbTag = (o) => (o && o.todo ? `<span class="hb-tag todo" title="Texte à compléter depuis votre livre">À compléter</span>` : "");
/* Où enregistrer le texte : l’aventure du personnage, sinon l’unique aventure connue, sinon cet appareil (« _moi ») */
function hbHome() {
  const ch = S.view === "create" ? S.editId && S.chars.find((c) => c.id === S.editId) : curChar();
  if (ch && ch.adv) return ch.adv;
  const codes = HB.codes();
  return codes.length === 1 ? codes[0] : "_moi";
}
const hbLocal = (code) => code === "_moi" || typeof FB === "undefined" || !FB.ok;
/* Encadré « à compléter » pour une liste de clés */
function hbTodoNote(keys) {
  const uniq = [...new Set(keys)].filter((k) => k && HB_RAW[k]);
  const todo = uniq.filter((k) => HB_RAW[k].sk);
  const done = uniq.filter((k) => !HB_RAW[k].sk);
  const edit = done.length ? `<div class="hb-edit">${done.map((k) => `<button class="btn small ghost" data-a="hbFill" data-k="${k}">${ICON.edit || ""}Modifier : ${esc(HB_RAW[k].n)}</button>`).join("")}</div>` : "";
  if (!todo.length) return edit;
  return edit + `<div class="hb-todo"><p><b>À compléter depuis votre livre.</b> Le texte n’est pas fourni par l’app : recopiez-le une fois, il apparaîtra pour ${hbHome() === "_moi" ? "vos personnages" : "toute l’aventure"}.</p><div class="row-btns">${todo.map((k) => `<button class="btn small" data-a="hbFill" data-k="${k}">${ICON.edit || ""}Compléter : ${esc(HB_RAW[k].n)}</button>`).join("")}</div></div>`;
}
function hbCanEdit(d, code) {
  if (d.sk || code === "_moi") return true;
  if (typeof FB === "undefined" || !FB.ok) return false;
  if (d.by === FB.uid) return true;
  return !!(Live.code === code && Live.doc && Live.doc.gm === FB.uid);
}

/* ---------- Écran « Contenu maison » ---------- */
function hbMeta(d) {
  const o = hbShape(d);
  if (!o) return "";
  switch (d.type) {
    case "sub": return (CLASSES[o.cls] ? CLASSES[o.cls].n : "") + " · " + (d.sk ? "niveaux " + o.feats.map((x) => x.l).join(", ") : o.feats.length + " aptitude" + (o.feats.length > 1 ? "s" : ""));
    case "bg": return o.ab.map((a) => ABIL[a].s).join(", ") + " · " + o.skills.map((k) => SKILLS[k] ? SKILLS[k].n : k).join(", ") + (FEATS[o.feat] ? " · " + FEATS[o.feat].n : "");
    case "feat": return HB_CAT_L[o.cat] || HB_CAT_L.origine;
    case "spell": return (o.l ? "Niveau " + o.l : "Tour de magie") + " · " + SC[o.e] + (o.cl.length ? " · " + o.cl.map((k) => CLASSES[k].n).join(", ") : "");
    case "item": return (o.kind ? o.kind + " · " : "") + (HB_RARITY_L[o.rarity] || o.rarity) + (o.attune ? " · harmonisation" : "");
  }
  return "";
}

function viewHB() {
  const code = S.hbCode;
  const local = code === "_moi";
  if (!local && (typeof FB === "undefined" || !FB.ok)) return `<header class="topbar"><button class="icon-btn" data-a="hbBack" aria-label="Retour">${ICON.back}</button><div class="tb-title"><strong>Livres et créations</strong></div></header><main class="sheet"><p class="mute">Le contenu de l’aventure demande une connexion.</p></main>`;
  if (!local) Live.watch(code);
  if (S.hbf) return viewHBForm();
  const todo = Object.values(PHB_RAW).filter((d) => HB_RAW["hb_" + d.id] && HB_RAW["hb_" + d.id].sk);
  const defs = HB.defs(code).slice().sort((a, b) => (a.type === b.type ? (a.n || "").localeCompare(b.n || "", "fr") : HB_TYPES.findIndex((t) => t[0] === a.type) - HB_TYPES.findIndex((t) => t[0] === b.type)));

  const counts = {}; defs.forEach((d) => (counts[d.type] = (counts[d.type] || 0) + 1));
  return `<header class="topbar">
    <button class="icon-btn" data-a="hbBack" aria-label="Retour">${ICON.back}</button>
    <div class="tb-title"><strong>Livres et créations</strong><span class="eyebrow">${local ? "Sur cet appareil" : esc(HB.advName(code)) + " · " + esc(code)}</span></div>
    <button class="btn small primary" data-a="hbNew">${ICON.plus}<span class="hide-s">Ajouter</span></button>
  </header>
  <main class="sheet hb-page">
    <section class="panel hb-intro"><p>Les sous-classes, historiques et dons du Manuel des joueurs sont déjà dans le créateur : il ne manque que leur texte, à recopier une fois depuis votre livre. Vous pouvez aussi ajouter vos propres créations.</p>
      <p class="mute small">${local ? "Ce contenu est enregistré sur cet appareil et dans les personnages qui l’utilisent." : "Ce contenu n’est visible que par les personnes qui ont le code de l’aventure. Chacun peut compléter ou ajouter des entrées ; seuls leur auteur et le MJ peuvent les modifier."}</p></section>
    ${typeof hbioPanel === "function" ? hbioPanel(code) : ""}
    <div class="chips hb-filter">${chip("À compléter (" + todo.length + ")", f === "todo", "hbFilter", 'data-v="todo"')}${chip("Tout (" + defs.length + ")", f === "all", "hbFilter", 'data-v="all"')}${HB_TYPES.map(([k, n]) => chip(n + (counts[k] ? " (" + counts[k] + ")" : ""), f === k, "hbFilter", `data-v="${k}"`)).join("")}</div>
    ${f === "todo" ? (shown.length ? `<div class="hb-list">${shown.map((d) => `<article class="hb-card todo">
      <div class="hb-top"><span class="hb-type">${HB_TYPE_L[d.type] || ""}</span><b>${esc(d.n)}</b></div>
      <span class="mute small">${esc(hbMeta(d))}</span>
      <div class="hb-foot"><span></span><button class="btn small" data-a="hbFill" data-k="hb_${esc(d.id)}">Compléter</button></div>
    </article>`).join("")}</div>` : `<section class="panel empty-state"><h3 class="ph">Tout est complété</h3><p>Le contenu du Manuel des joueurs est entièrement renseigné.</p></section>`) : shown.length ? `<div class="hb-list">${shown.map((d) => `<article class="hb-card">
      <div class="hb-top"><span class="hb-type">${HB_TYPE_L[d.type] || ""}</span><b>${esc(d.n)}</b></div>
      <span class="mute small">${esc(hbMeta(d))}</span>
      ${d.d ? `<p class="hb-desc">${esc(d.d.length > 220 ? d.d.slice(0, 220) + "…" : d.d)}</p>` : ""}
      <div class="hb-foot"><span class="mute small">${d.byName ? "Par " + esc(d.byName) : ""}</span>${hbCanEdit(d, code) ? `<span class="row-btns"><button class="btn small ghost" data-a="hbEdit" data-id="${esc(d.id)}">Modifier</button><button class="btn small ghost danger" data-a="hbDelAsk" data-id="${esc(d.id)}">Supprimer</button></span>` : ""}</div>
    </article>`).join("")}</div>` : `<section class="panel empty-state"><h3 class="ph">${defs.length ? "Rien dans cette catégorie" : "Aucun contenu maison"}</h3><p>Touchez <b>Ajouter</b> pour créer votre première entrée.</p></section>`}
  </main>`;
}

function hbBlank(type) {
  return { type, n: "", d: "", castMode: "", castAb: "int", castList: "magicien", cls: S.hbCls || "barbare", feats: [{ l: 3, n: "", d: "" }], spellsTxt: "", ab: [], skills: [], tool: "", feat: "vigilant", featList: "clr", gear: "", gold: 15, cat: "origine", pre: "", fab: [], l: 1, e: "evo", t: "1 action", p: "18 m", c: "V, S", du: "Instantanée", co: false, ri: false, cl: [], dmg: "", ty: "feu", heal: "", atk: "", up: "", rarity: K("peu commun"), attune: false, kind: "" };
}
function hbFormFrom(d) {
  const f = { ...hbBlank(d.type), ...clone(d) };
  delete f.sk; delete f.src;
  const cast = d.type === "sub" ? hbCastOf(d) : null;
  if (cast) Object.assign(f, { castMode: "third", castAb: cast.ab, castList: cast.list });
  delete f.cast;
  if (d.type === "feat") f.fab = d.ab || [];
  if (d.type === "sub" && (!f.feats || !f.feats.length)) f.feats = [{ l: 3, n: "", d: "" }];
  return f;
}

function hbInput(k, label, ph, opts = {}) {

}

/* « 3 : Bénédiction, Soins » → { 3: ["benediction", "soins"] } */
const normName = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, "'").replace(/\s+/g, " ").trim();
function hbParseSpells(txt) {
  const out = {}, unknown = [];
  const byName = {};
  Object.entries(SPELLS).forEach(([id, s]) => (byName[normName(s.n)] = id));
  String(txt || "").split("\n").forEach((line) => {
    if (!line.trim()) return;
    const m = line.match(/^\s*(?:niv(?:eau)?\.?\s*)?(\d+)\s*[:\-–.)]\s*(.+)$/i) || [null, "3", line];
    const lv = clampLv(m[1], 1, 20);
    m[2].split(/[,;]/).map((x) => x.trim()).filter(Boolean).forEach((n) => {
      const id = byName[normName(n)];
      if (id) (out[lv] = out[lv] || []).push(id); else unknown.push(n);
    });
  });
  return { spells: out, unknown };
}
function hbSpellPreview(txt) {
  const r = hbParseSpells(txt);
  const ok = Object.values(r.spells).flat().length;
  return `${ok} sort${ok > 1 ? "s" : ""} reconnu${ok > 1 ? "s" : ""}${r.unknown.length ? ` · introuvables : ${r.unknown.map(esc).join(", ")} (créez-les d’abord comme sorts maison, ou vérifiez l’orthographe)` : ""}`;
}

function hbAuthorName() {
  const u = typeof Account !== "undefined" && Account.user ? Account.user() : null;
  if (u && u.displayName) return u.displayName;
  if (Live.doc && Live.doc.gm === FB.uid) return "MJ";
  const ch = S.chars.find((c) => c.adv === S.hbCode);
  return ch ? ch.b.name : "Joueur";
}

function hbValidate(f) {
  if (!f.n.trim()) return "Donnez un nom.";
  if (f.type === "sub" && !f.feats.some((x) => x.n.trim())) return "Ajoutez au moins une aptitude.";
  if (f.type === "bg" && f.ab.length !== 3) return "Choisissez trois caractéristiques.";
  if (f.type === "bg" && f.skills.length !== 2) return "Choisissez deux compétences.";
  if (f.type === "spell" && !f.cl.length) return "Choisissez au moins une classe.";
  if (f.type === "spell" && f.dmg && !/^\d*d\d+([+-]\d+)?$/i.test(f.dmg.replace(/\s/g, ""))) return "Dégâts : utilisez une formule comme 3d6 ou 2d8+2.";
  if (f.type === "spell" && f.heal && !/^\d*d\d+([+-]\d+)?$/i.test(f.heal.replace(/\s/g, ""))) return "Soins : utilisez une formule comme 2d8.";
  return null;
}
function hbToDoc(f) {
  const d = { id: f.id || uid(), type: f.type, n: f.n.trim().slice(0, 120), d: (f.d || "").slice(0, 6000), adv: S.hbCode, updated: Date.now() };
  if (f.type === "sub") { d.cls = f.cls; d.feats = f.feats.filter((x) => x.n.trim()).slice(0, 30).map((x) => ({ l: clampLv(x.l, 3, 20), n: x.n.trim().slice(0, 120), d: (x.d || "").slice(0, 3000) })); d.spellsTxt = (f.spellsTxt || "").slice(0, 2000); d.spells = hbParseSpells(f.spellsTxt).spells; d.cast = !CLASSES[f.cls].caster && f.castMode === "third" ? { ab: f.castAb, list: f.castList } : null; }
  if (f.type === "bg") Object.assign(d, { ab: f.ab, skills: f.skills, tool: f.tool.slice(0, 120), feat: f.feat, featList: f.featList, gear: f.gear.slice(0, 1000), gold: Math.max(0, parseInt(f.gold, 10) || 0) });
  if (f.type === "feat") Object.assign(d, { cat: f.cat, pre: f.pre.slice(0, 200), ab: f.fab });
  if (f.type === "spell") Object.assign(d, { l: +f.l, e: f.e, cl: f.cl, t: f.t.slice(0, 80), p: f.p.slice(0, 80), c: f.c.slice(0, 200), du: f.du.slice(0, 80), co: !!f.co, ri: !!f.ri, atk: f.atk, dmg: f.dmg.replace(/\s/g, ""), ty: f.ty, heal: f.heal.replace(/\s/g, ""), up: f.up.slice(0, 200) });
  if (f.type === "item") Object.assign(d, { kind: f.kind.slice(0, 120), rarity: f.rarity, attune: !!f.attune });
  return d;
}

async function hbAct(a, d, el) {
  switch (a) {
    case "hbOpen": S.hbCode = d.code; S.hbBack = { view: S.view, tab: S.tab, gmTab: S.gmTab }; S.hbf = null; S.hbDirect = false; S.hbFilter = HB.defs(d.code).length ? "all" : "todo"; S.view = "hb"; window.scrollTo(0, 0); return true;
    case "hbFill": {
      const filled = HB_RAW[d.k] && !HB_RAW[d.k].sk ? HB_RAW[d.k] : null;
      const raw = filled || PHB_RAW[d.k]; if (!raw) return true;
      const where = filled ? hbCodeOf(filled.id) || filled.adv || hbHome() : null;
      if (filled && !hbCanEdit(filled, where)) { toast("Seuls l’auteur de cette entrée et le MJ peuvent la modifier."); return true; }
      if (S.view !== "hb") { S.hbCode = where || hbHome(); S.hbBack = { view: S.view, tab: S.tab, gmTab: S.gmTab, y: window.scrollY }; S.hbDirect = true; S.view = "hb"; }
      S.hbf = hbFormFrom(raw); window.scrollTo(0, 0); return true;
    }
    case "hbBack": { const bk = S.hbBack || { view: "home" }; S.view = bk.view; if (bk.tab) S.tab = bk.tab; if (bk.gmTab) S.gmTab = bk.gmTab; S.hbf = null; S.hbDirect = false; setTimeout(() => window.scrollTo(0, bk.y || 0), 0); return true; }
    case "hbFilter": S.hbFilter = d.v; return true;
    case "hbNew": S.hbf = hbBlank(HB_TYPE_L[S.hbFilter] ? S.hbFilter : "sub"); window.scrollTo(0, 0); return true;
    case "hbType": { const keep = { n: S.hbf.n, d: S.hbf.d }; S.hbf = { ...hbBlank(d.v), ...keep }; return true; }
    case "hbEdit": { const def = HB.defs(S.hbCode).find((x) => x.id === d.id); if (def) { S.hbf = hbFormFrom(def); window.scrollTo(0, 0); } return true; }
    case "hbCancel": S.hbf = null; if (S.hbDirect) return hbAct("hbBack", {}); return true;
    case "hbSet": { const f = S.hbf; f[d.k] = d.k === "l" ? +d.v : d.v; if (d.k === "cls") S.hbCls = d.v; return true; }
    case "hbFlag": S.hbf[d.k] = !S.hbf[d.k]; return true;
    case "hbToggle": { if (el && el.getAttribute("aria-disabled") === "true") return true; toggleIn(S.hbf[d.k], d.v, d.max ? +d.max : null); return true; }
    case "hbFeatAdd": { const last = S.hbf.feats[S.hbf.feats.length - 1]; S.hbf.feats.push({ l: last ? last.l : 3, n: "", d: "" }); return true; }
    case "hbFeatDel": S.hbf.feats.splice(+d.i, 1); if (!S.hbf.feats.length) S.hbf.feats.push({ l: 3, n: "", d: "" }); return true;
    case "hbSave": {
      const f = S.hbf, err = hbValidate(f);
      if (err) { f.err = err; return true; }
      const doc = hbToDoc(f);
      const prev = HB.defs(S.hbCode).find((x) => x.id === doc.id);
      doc.by = prev ? prev.by : FB.uid;
      doc.byName = prev ? prev.byName : hbAuthorName();
      try {
        if (!hbLocal(S.hbCode)) await FB.adv(S.hbCode).collection("homebrew").doc(doc.id).set(doc);
        HB.set(S.hbCode, [...HB.defs(S.hbCode).filter((x) => x.id !== doc.id), doc], S.hbCode === "_moi" ? "Cet appareil" : undefined);
        S.hbf = null; S.hbFilter = doc.id.startsWith("phb_") ? "todo" : doc.type;
        const ch = curChar(); if (ch && S.hbBack && S.hbBack.view === "sheet") { hbEmbed(ch.b); saveSoon(ch); }
        toast(prev ? "Modifications enregistrées" : doc.id.startsWith("phb_") ? "« " + doc.n + " » complété" : "« " + doc.n + " » ajouté");
        if (S.hbDirect) return hbAct("hbBack", {});
      } catch (e) { f.err = e && e.code === "permission-denied" ? "Enregistrement refusé : publiez les nouvelles règles Firestore (voir FIREBASE.md)." : "Enregistrement impossible. Vérifiez votre connexion."; }
      return true;
    }
    case "hbDelAsk": S.modal = { k: "hbDel", id: d.id }; return true;
    case "hbDel": {
      try {
        if (!hbLocal(S.hbCode)) await FB.adv(S.hbCode).collection("homebrew").doc(d.id).delete();
        HB.set(S.hbCode, HB.defs(S.hbCode).filter((x) => x.id !== d.id));
        toast("Entrée supprimée");
      } catch (e) { toast("Suppression impossible."); }
      S.modal = null; return true;
    }
    case "setSub": { const b = S.draft; b.subHb = d.v || null; cleanBuild(b); return true; }
  }
  return false;
}

function hbModal(m) {

   on le remplit tranquillement, puis on l’importe en une fois. */

const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
const HBIO = { p: null, busy: false };
function xlsxLoad() {
  if (window.XLSX) return Promise.resolve();
  if (HBIO.p) return HBIO.p;
  HBIO.p = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = XLSX_URL;
    s.onload = () => res();
    s.onerror = () => { HBIO.p = null; s.remove(); rej(new Error("xlsx")); };
    document.head.appendChild(s);
  });
  return HBIO.p;
}
function downloadFile(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
const hbFileName = (code, ext) => "forge-livres-" + (code === "_moi" ? "appareil" : code) + "." + ext;

  [K("sub"), "Sous-classes", ["id", "Classe", "Sous-classe", "Niveau", "Aptitude", "Texte", "Sorts toujours préparés", "Incantation"]],
  [K("bg"), "Historiques", ["id", "Nom", "Caractéristiques", "Compétences", "Outil", "Don", "Description", "Équipement", "po"]],
  [K("feat"), "Dons", ["id", "Nom", "Catégorie", "Prérequis", "+1 parmi", "Texte"]],
  [K("spell"), "Sorts", ["id", "Nom", "Niveau", "École", "Classes", "Temps", "Portée", "Composantes", "Durée", "Concentration", "Rituel", "Jet", "Dégâts", "Type", "Soins", "Niveaux supérieurs", "Texte"]],
  [K("item"), "Objets", ["id", "Nom", "Catégorie", "Rareté", "Harmonisation", "Texte"]],
];
const HBX_NAMES = { "sous-classes": "sub", subclasses: "sub", historiques: "bg", backgrounds: "bg", dons: "feat", feats: "feat", sorts: "spell", spells: "spell", objets: "item", items: "item" };

/* Entrées à exporter : complétées dans cette aventure, sinon complétées ailleurs sur l’appareil, sinon le catalogue vide */
function hbExportDefs(code) {
  const defs = HB.defs(code);
  const ids = new Set(defs.map((d) => d.id));
  const out = [...defs];
  Object.values(PHB_RAW).forEach((sk) => {
    if (ids.has(sk.id)) return;
    const cur = HB_RAW["hb_" + sk.id];
    out.push(cur && !cur.sk ? cur : sk);
  });
  return out;
}
const yes = (v) => /^(oui|yes|x|1|true|vrai|o|y)$/i.test(String(v).trim());
const list = (v) => String(v || "").split(/[,;\s]+/).map((x) => x.trim().toLowerCase()).filter(Boolean);

function hbRows(defs) {
  const rows = { sub: [], bg: [], feat: [], spell: [], item: [] };
  const catOrder = (d) => (d.type === "feat" ? HB_CATS.indexOf(d.cat || "origine") : 0);
  const sorted = defs.slice().sort((a, b) => (a.cls || "").localeCompare(b.cls || "") || catOrder(a) - catOrder(b) || String(a.n).localeCompare(String(b.n), "fr"));
  sorted.forEach((d) => {
    switch (d.type) {
      case "sub": {
        const cast = hbCastOf(d);
        rows.sub.push([d.id, d.cls, d.n, "", "", d.d || "", d.spellsTxt || "", cast ? cast.ab + ":" + cast.list : ""]);
        if (d.sk) (d.feats || []).forEach((f) => { for (let i = 0; i < (f.l === 3 ? 4 : 2); i++) rows.sub.push([d.id, d.cls, d.n, f.l, "", "", "", ""]); }); // plusieurs aptitudes possibles par niveau
        else (d.feats || []).forEach((f) => rows.sub.push([d.id, d.cls, d.n, f.l, f.n || "", f.d || "", "", ""]));
        break;
      }
      case "bg": rows.bg.push([d.id, d.n, (d.ab || []).join(", "), (d.skills || []).join(", "), d.tool || "", d.feat || "", d.d || "", d.gear || "", d.sk ? "" : d.gold || 0]); break;
      case "feat": rows.feat.push([d.id, d.n, d.cat || "origine", d.pre || "", (d.ab || []).join(", "), d.d || ""]); break;
      case "spell": rows.spell.push([d.id, d.n, d.l, d.e, (d.cl || []).join(", "), d.t || "", d.p || "", d.c || "", d.du || "", d.co ? "oui" : "", d.ri ? "oui" : "", d.atk || "", d.dmg || "", d.ty || "", d.heal || "", d.up || "", d.d || ""]); break;
      case "item": rows.item.push([d.id, d.n, d.kind || "", d.rarity || "", d.attune ? "oui" : "", d.d || ""]); break;
    }
  });
  return rows;
}

async function hbExportXlsx(code) {
  await xlsxLoad();
  const wb = XLSX.utils.book_new();
  const readme = XLSX.utils.aoa_to_sheet(hbReadme());
  readme["!cols"] = [{ wch: 34 }, { wch: 110 }, { wch: 46 }, { wch: 60 }];
  XLSX.utils.book_append_sheet(wb, readme, "Mode d’emploi");
  const rows = hbRows(hbExportDefs(code));
  const widths = { sub: [26, 12, 26, 7, 28, 80, 30, 14], bg: [18, 18, 16, 16, 26, 22, 60, 50, 6], feat: [24, 26, 10, 18, 12, 80], spell: [18, 22, 6, 6, 22, 14, 10, 12, 12, 8, 8, 6, 8, 10, 8, 18, 80], item: [18, 26, 20, 12, 8, 80] };
  HBX_SHEETS.forEach(([k, name, head]) => {
    const ws = XLSX.utils.aoa_to_sheet([head, ...rows[k]]);
    ws["!cols"] = widths[k].map((w) => ({ wch: w }));
    ws["!freeze"] = { xSplit: 0, ySplit: 1 };
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  downloadFile(hbFileName(code, "xlsx"), new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
}
function hbExportJson(code) {
  const data = { app: "forge-des-heros", kind: "livres", v: 1, exported: new Date().toISOString(), entries: HB.defs(code) };
  downloadFile(hbFileName(code, "json"), new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
}

/* ---------- Import ---------- */
const slugId = (s) => "x" + normName(s).replace(/[^a-z0-9]+/g, "").slice(0, 24) + "_" + uid().slice(0, 5);
function hbFromSheets(sheets, report) {
  const docs = [];
  const cell = (r, i) => String(r[i] == null ? "" : r[i]).trim();
  const skOf = (id) => PHB_RAW["hb_" + id];
  // Sorts d’abord : une sous-classe du même fichier peut s’y référer
  const spellDocs = [];
  (sheets.spell || []).forEach((r, i) => {
    const n = cell(r, 1); if (!n) return;
    const cl = list(cell(r, 4)).filter((k) => CLASSES[k]);
    if (!cl.length) { report.bad.push("Sort « " + n + " » (ligne " + (i + 2) + ") : indiquez au moins une classe."); return; }
    const atk = cell(r, 11).toLowerCase();
    const doc = { id: cell(r, 0) || slugId(n), type: "spell", n: n.slice(0, 120), l: clampLv(cell(r, 2), 0, 9), e: SC[cell(r, 3)] ? cell(r, 3) : "evo", cl, t: cell(r, 5) || "1 action", p: cell(r, 6) || "—", c: cell(r, 7) || "V, S", du: cell(r, 8) || "Instantanée", co: yes(cell(r, 9)), ri: yes(cell(r, 10)), atk: atk === "cac" || atk === "dist" || ABIL[atk] ? atk : "", dmg: cell(r, 12).replace(/\s/g, ""), ty: DMG[cell(r, 13)] ? cell(r, 13) : "force", heal: cell(r, 14).replace(/\s/g, ""), up: cell(r, 15).slice(0, 200), d: cell(r, 16).slice(0, 6000) };
    spellDocs.push(doc);
    if (!SPELLS["hb_" + doc.id]) hbRegister(doc, true);
  });
  // Sous-classes : regroupées par id (ou par nom)
  const subs = new Map();
  (sheets.sub || []).forEach((r, i) => {
    const id = cell(r, 0) || "", name = cell(r, 2);
    if (!id && !name) return;
    const key = id || "new:" + cell(r, 1) + ":" + name;
    if (!subs.has(key)) subs.set(key, { id, cls: cell(r, 1).toLowerCase(), n: name, d: "", spellsTxt: "", cast: undefined, feats: [], line: i + 2 });
    const s = subs.get(key);
    const lv = parseInt(cell(r, 3), 10);
    // sorts et incantation acceptés sur n’importe quelle ligne de la sous-classe
    const sp = cell(r, 6); if (sp && !s.spellsTxt.includes(sp)) s.spellsTxt = s.spellsTxt ? s.spellsTxt + "\n" + sp : sp;
    const c = cell(r, 7); if (c) { const [ab, li] = c.toLowerCase().split(/[:\/ ]+/); s.cast = ABIL[ab] && CLASSES[li] ? { ab, list: li } : null; }
    if (!lv) s.d = cell(r, 5) || s.d;
    else s.feats.push({ l: clampLv(lv, 3, 20), n: cell(r, 4), d: cell(r, 5) });
  });
  subs.forEach((s) => {
    const sk = s.id && skOf(s.id);
    const named = s.feats.filter((f) => f.n);
    if (!named.length) { report.skip++; return; }
    const cls = CLASSES[s.cls] ? s.cls : sk ? sk.cls : null;
    if (!cls) { report.bad.push("Sous-classe « " + s.n + " » : classe inconnue (" + s.cls + ")."); return; }
    const doc = { id: s.id || slugId(s.n), type: "sub", n: (s.n || (sk && sk.n) || "").slice(0, 120), d: s.d.slice(0, 6000), cls, feats: named.slice(0, 30).map((f) => ({ l: f.l, n: f.n.slice(0, 120), d: f.d.slice(0, 3000) })), spellsTxt: s.spellsTxt.slice(0, 2000) };
    doc.spells = hbParseSpells(doc.spellsTxt).spells;
    if (s.cast !== undefined) doc.cast = s.cast; else if (sk && sk.cast) doc.cast = sk.cast;
    docs.push(doc);
  });
  (sheets.bg || []).forEach((r, i) => {
    const id = cell(r, 0), n = cell(r, 1); if (!id && !n) return;
    const sk = id && skOf(id);
    const d = cell(r, 6), gear = cell(r, 7);
    if (sk && !d && !gear) { report.skip++; return; }
    const ab = list(cell(r, 2)).filter((a) => ABIL[a]), skills = list(cell(r, 3)).filter((k) => SKILLS[k]);
    if (ab.length !== 3 || skills.length !== 2) { report.bad.push("Historique « " + n + " » (ligne " + (i + 2) + ") : il faut 3 caractéristiques et 2 compétences."); return; }
    const feat = FEATS[cell(r, 5)] ? cell(r, 5) : sk ? sk.feat : "vigilant";
    docs.push({ id: id || slugId(n), type: "bg", n: (n || sk.n).slice(0, 120), d: d.slice(0, 6000), ab, skills, tool: cell(r, 4).slice(0, 120), feat, featList: sk ? sk.featList : "clr", gear: gear.slice(0, 1000), gold: Math.max(0, parseInt(cell(r, 8), 10) || 0) });
  });
  (sheets.feat || []).forEach((r) => {
    const id = cell(r, 0), n = cell(r, 1); if (!id && !n) return;
    const sk = id && skOf(id), d = cell(r, 5);
    if (!d) { report.skip++; return; }
    docs.push({ id: id || slugId(n), type: "feat", n: (n || sk.n).slice(0, 120), d: d.slice(0, 6000), cat: /^g/i.test(cell(r, 2)) ? "general" : /^s/i.test(cell(r, 2)) ? "style" : /^f/i.test(cell(r, 2)) ? "faveur" : "origine", pre: cell(r, 3).slice(0, 200), ab: list(cell(r, 4)).filter((a) => ABIL[a]) });
  });
  docs.push(...spellDocs);
  (sheets.item || []).forEach((r) => {
    const n = cell(r, 1); if (!n) return;
    docs.push({ id: cell(r, 0) || slugId(n), type: "item", n: n.slice(0, 120), kind: cell(r, 2).slice(0, 120), rarity: HB_RARITY.includes(cell(r, 3).toLowerCase()) ? cell(r, 3).toLowerCase() : K("peu commun"), attune: yes(cell(r, 4)), d: cell(r, 5).slice(0, 6000) });
  });
  return docs;
}

async function hbImportFile(file, code) {
  const report = { ok: 0, skip: 0, bad: [], refused: 0 };
  let docs = [];
  try {
    if (/\.json$/i.test(file.name)) {
      const data = JSON.parse(await file.text());
      const entries = Array.isArray(data) ? data : data && data.entries;
      if (!Array.isArray(entries)) throw new Error("format");
      docs = entries.filter((d) => d && d.id && d.type && HB_TYPE_L[d.type] && typeof d.n === "string").map((d) => ({ ...d, n: d.n.slice(0, 120), d: String(d.d || "").slice(0, 6000) }));
    } else {
      await xlsxLoad();
      const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
      const sheets = {};
      wb.SheetNames.forEach((name, i) => {
        const k = HBX_NAMES[normName(name)];
        if (!k) return;
        sheets[k] = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "", raw: false }).slice(1);
      });
      if (!Object.keys(sheets).length) throw new Error("format");
      docs = hbFromSheets(sheets, report);
    }
  } catch (e) {
    return { ...report, fail: e && e.message === "xlsx" ? "Impossible de charger le lecteur Excel. Vérifiez votre connexion." : "Ce fichier n’est pas un export de Forge des Héros." };
  }
  const prevAll = HB.defs(code);
  const done = [];
  for (const raw of docs) {
    const prev = prevAll.find((x) => x.id === raw.id);
    if (prev && !hbCanEdit(prev, code)) { report.refused++; continue; }
    const doc = JSON.parse(JSON.stringify({ ...raw, adv: code, updated: Date.now(), by: prev ? prev.by : (typeof FB !== "undefined" && FB.uid) || "local", byName: prev ? prev.byName : hbAuthorName() }));
    done.push(doc);
  }
  if (!hbLocal(code)) {
    const res = await Promise.allSettled(done.map((doc) => FB.adv(code).collection("homebrew").doc(doc.id).set(doc)));
    const okDocs = done.filter((_, i) => res[i].status === "fulfilled");
    report.refused += done.length - okDocs.length;
    done.length = 0; done.push(...okDocs);
  }
  HB.set(code, [...prevAll.filter((x) => !done.some((d) => d.id === x.id)), ...done], code === "_moi" ? "Cet appareil" : undefined);
  report.ok = done.length;
  return report;
}

/* Actions et fenêtre de résultat */
async function hbioAct(a, d) {
  switch (a) {
    case "hbExportX": try { toast("Préparation du fichier…"); await hbExportXlsx(S.hbCode); toast("Fichier Excel téléchargé"); } catch (e) { toast("Impossible de charger le module Excel. Vérifiez votre connexion."); } return true;
    case "hbExportJ": hbExportJson(S.hbCode); toast("Sauvegarde téléchargée"); return true;

  return false;
}

  return `<h3>Import terminé</h3>
    <dl class="facts"><div><dt>Importées</dt><dd><b>${r.ok}</b> ${r.ok > 1 ? "entrées" : "entrée"}</dd></div>
    <div><dt>Encore vides</dt><dd>${r.skip} (ignorées, à compléter plus tard)</dd></div>
    ${r.refused ? `<div><dt>Refusées</dt><dd>${r.refused} (entrées d’un autre joueur : seul le MJ peut les remplacer)</dd></div>` : ""}</dl>
    ${r.bad.length ? `<p class="bad small">${r.bad.slice(0, 8).map(esc).join("<br>")}${r.bad.length > 8 ? "<br>…" : ""}</p>` : ""}
    <div class="row-btns"><button class="btn primary" data-a="closeModal">OK</button></div>`;
}
