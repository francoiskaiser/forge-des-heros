<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Concept : une table de taverne à la chandelle — bois sombre, parchemin, braise.
   Fiche dense et lisible, chaque bonus est un dé qu’on touche. */
:root {
  --bg: #15110e;
  --bg2: #1b1612;
  --panel: #211a15;
  --panel2: #2a2119;
  --line: #3b2f25;
  --line2: #4d3d30;
  --ink: #eee3cc;
  --mute: #a99a82;
  --faint: #6f6252;
  --ember: #e59a4f;
  --ember2: #f4bd78;
  --emberbg: rgba(229, 154, 79, .14);
  --blood: #d0584a;
  --bloodbg: rgba(208, 88, 74, .16);
  --verd: #6fbf98;
  --verdbg: rgba(111, 191, 152, .15);
  --arc: #a89ae8;
  --arcbg: rgba(168, 154, 232, .15);
  --f-display: "IM Fell English SC", "Cormorant SC", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
  --onember: #1d130a;
  --bloodink: #ffd9d3;
  --dmgink: #ffcfc7;
  --healink: #c7f1dd;
  --barbg: rgba(27, 22, 18, .94);
  --scrim: rgba(8, 6, 4, .66);
  --shadow: rgba(0, 0, 0, .55);
  --glow: rgba(229, 154, 79, .10);
  color-scheme: dark;
}
/* Mode clair : parchemin de jour, encre brune, braise assombrie pour le contraste */
:root[data-forge-theme="light"] {
  --bg: #f2ebdf;
  --bg2: #e9e0d0;
  --panel: #fbf7f0;
  --panel2: #f4ede2;
  --line: #ddd1be;
  --line2: #c6b49a;
  --ink: #2b2118;
  --mute: #66563f;
  --faint: #8f7d64;
  --ember: #b25c19;
  --ember2: #8f4710;
  --emberbg: rgba(178, 92, 25, .11);
  --blood: #b2382c;
  --bloodbg: rgba(178, 56, 44, .09);
  --verd: #2b7d55;
  --verdbg: rgba(43, 125, 85, .11);
  --arc: #5a4ab8;
  --arcbg: rgba(90, 74, 184, .09);
  --onember: #fffaf2;
  --bloodink: #8a281e;
  --dmgink: #962f22;
  --healink: #1d6643;
  --barbg: rgba(251, 247, 240, .94);
  --scrim: rgba(43, 33, 24, .42);
  --shadow: rgba(70, 45, 20, .18);
  --glow: rgba(178, 92, 25, .07);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg);
  background-image: radial-gradient(ellipse 80% 40% at 50% -10%, var(--glow), transparent 70%);
  color: var(--ink); font: 16px/1.5 var(--f-body); margin: 0; min-height: 100%;
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}
body.noscroll { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg2); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
[aria-disabled="true"] { opacity: .38; cursor: not-allowed; }
svg { width: 1.15em; height: 1.15em; flex: none; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; margin: 0; text-wrap: balance; }
.mute { color: var(--mute); }
.small { font-size: .86rem; }
.bad { color: var(--blood); }
.warn { color: var(--ember2); font-size: .8rem; }
.center { text-align: center; }
.lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--mute); }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--ember); }
b, strong { font-weight: 700; }
.wrap, .home, .create-grid, .sheet, .home-head, .rail { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Boutons */
.btn { display: inline-flex; align-items: center; gap: .5em; padding: .62em 1.1em; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel2); font-weight: 700; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--ember); }
.btn.primary { background: var(--ember); color: var(--onember); border-color: var(--ember); }
.btn.primary:hover { background: var(--ember2); }
.btn.ghost { background: transparent; }
.btn.small { padding: .4em .85em; font-size: .9rem; }
.btn.danger { color: var(--blood); }
.btn.dmgb { background: var(--bloodbg); border-color: var(--blood); color: var(--bloodink); }
.btn.healb { background: var(--verdbg); border-color: var(--verd); color: var(--healink); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
.icon-btn:hover { background: var(--panel2); }
.mini { min-width: 34px; height: 34px; padding: 0 .55em; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel2); font-weight: 700; }
.mini:disabled { opacity: .35; }
.mini.dmg { color: var(--blood); } .mini.heal { color: var(--verd); }
.row-btns { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .8rem; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip { display: inline-flex; align-items: baseline; gap: .35em; padding: .4em .8em; border-radius: 999px; border: 1px solid var(--line2); background: var(--bg2); font-size: .92rem; transition: all .12s; }
.chip small { font-size: .7rem; color: var(--faint); letter-spacing: .06em; }
.chip:hover { border-color: var(--ember); }
.chip.on { background: var(--emberbg); border-color: var(--ember); color: var(--ember2); }
.chip.on small { color: var(--ember); }
.chip.lock { border-style: dashed; }
.chips.levels { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; max-width: 560px; }
.chips.levels .chip { justify-content: center; padding: .4em 0; font-variant-numeric: tabular-nums; }

/* Accueil */
.home-head { padding-block: 28px 8px; max-width: 1100px; margin: 0 auto; }
.brand { display: flex; gap: 14px; align-items: center; }
.brand-mark { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 14px; background: var(--emberbg); color: var(--ember); border: 1px solid rgba(229, 154, 79, .35); }
.brand-mark svg { width: 32px; height: 32px; }
.brand h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1; color: var(--ember2); }
.brand p { margin: .25rem 0 0; color: var(--mute); }
.home { max-width: 1100px; margin: 0 auto; padding-block: 16px 40px; }
.home-intro h2 { font-size: 1.4rem; }
.home-intro p { margin: .2rem 0 1rem; }
.hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.hero-card { display: flex; gap: 14px; align-items: center; text-align: left; padding: 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); transition: border-color .15s, transform .15s; min-width: 0; }
.hero-card:hover { border-color: var(--ember); transform: translateY(-1px); }
.hero-card.new { border-style: dashed; background: transparent; }
.hc-body { display: grid; gap: 2px; min-width: 0; }
.hc-name { font-family: var(--f-display); font-size: 1.25rem; line-height: 1.15; overflow-wrap: anywhere; }
.hc-line { color: var(--mute); font-size: .88rem; }
.hc-stats { display: flex; gap: 14px; margin-top: 4px; font-variant-numeric: tabular-nums; font-weight: 700; }
.hc-stats span { display: inline-flex; gap: 5px; align-items: center; }
.hc-stats svg { color: var(--ember); }
.sigil { width: 48px; height: 48px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--ember); color: var(--ember2); font-family: var(--f-display); font-size: 1.1rem; background: radial-gradient(circle at 50% 35%, rgba(229, 154, 79, .22), transparent 70%); }
.sigil.big { width: 56px; height: 56px; font-size: 1.3rem; }
.home-tools { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 22px; }
.legal { color: var(--faint); font-size: .78rem; margin-top: 32px; max-width: 70ch; }

/* Barre du haut */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px; padding: 8px max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); background: var(--barbg); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.tb-title { flex: 1; min-width: 0; display: grid; line-height: 1.2; }
.tb-title strong { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-title .eyebrow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-actions { display: flex; gap: 6px; align-items: center; }

/* Créateur */
.rail { display: flex; gap: 4px; overflow-x: auto; padding-block: 10px; max-width: 1200px; margin: 0 auto; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail-step { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; color: var(--mute); border: 1px solid transparent; position: relative; }
.rail-step.on { border-color: var(--ember); color: var(--ink); background: var(--emberbg); }
.rs-num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .82rem; font-weight: 700; border: 1px solid var(--line2); }
.rail-step.done .rs-num { background: var(--ember); color: var(--onember); border-color: var(--ember); }
.rail-step.done .rs-num svg { width: 15px; height: 15px; }
.rs-badge { font-size: .7rem; background: var(--line2); color: var(--ink); border-radius: 999px; padding: 0 6px; font-weight: 700; }
.create-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; padding-block: 8px 30px; }
.step-main { min-width: 0; }
.step-head { margin-bottom: 14px; }
.step-head h2 { font-size: clamp(1.7rem, 4vw, 2.2rem); color: var(--ember2); line-height: 1.1; }
.todo { color: var(--ember2); font-size: .9rem; margin: .35rem 0 0; }
.ok { color: var(--verd); font-size: .9rem; margin: .35rem 0 0; display: flex; gap: 6px; align-items: center; }
.block { margin-bottom: 22px; }
.bh { font-size: 1.15rem; margin-bottom: 10px; color: var(--ink); }
.summary { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); }
.sum-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.sum-top { display: flex; gap: 12px; align-items: center; }
.sum-name { font-family: var(--f-display); font-size: 1.25rem; line-height: 1.15; overflow-wrap: anywhere; }
.sum-abil { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center; }
.sum-abil > div { display: grid; padding: 6px 0; border-radius: 8px; background: var(--bg2); }
.sum-abil b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.sum-abil .lbl { font-size: .62rem; }
.sum-vitals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
.sum-vitals > div { display: grid; }
.sum-vitals b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.sum-cast { display: flex; justify-content: space-between; font-size: .9rem; color: var(--arc); border-top: 1px solid var(--line); padding-top: 10px; }
.step-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }

.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.pick-grid.two { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.pick-card { text-align: left; display: grid; gap: 8px; align-content: start; padding: 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); transition: border-color .15s, background .15s; min-width: 0; }
.pick-card:hover { border-color: var(--line2); background: var(--panel2); }
.pick-card.on { border-color: var(--ember); background: linear-gradient(180deg, var(--emberbg), var(--panel) 70%); box-shadow: 0 0 0 1px var(--ember) inset; }
.pc-head { display: flex; align-items: center; gap: 10px; }
.pc-head .sigil { width: 36px; height: 36px; font-size: .9rem; }
.pc-name { font-family: var(--f-display); font-size: 1.2rem; flex: 1; line-height: 1.1; }
.pc-hd { font-size: .78rem; color: var(--ember); border: 1px solid rgba(229, 154, 79, .4); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.pc-tag { color: var(--mute); font-size: .9rem; line-height: 1.35; }
.pc-meta { display: flex; justify-content: space-between; font-size: .8rem; color: var(--faint); letter-spacing: .05em; }
.diff { color: var(--ember); letter-spacing: 2px; }
.pc-list { display: grid; gap: 2px; font-size: .84rem; color: var(--mute); }
.pc-list b { color: var(--ink); font-weight: 700; margin-right: 4px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; min-width: 0; }
.panel h3 { font-size: 1.35rem; color: var(--ember2); margin-bottom: 8px; }
.panel h4 { font-size: 1.05rem; margin: 2px 0 10px; }
.panel h4 + .chips, .panel .chips + h4 { margin-top: 8px; }
.panel .chips + p, .panel p + .chips { margin-top: 8px; }
.subpanel { display: grid; gap: 10px; }
.detail { margin-top: 6px; }
.facts { display: grid; gap: 8px; margin: 10px 0; }
.facts > div { display: grid; grid-template-columns: 170px 1fr; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 7px; }
.facts dt { color: var(--mute); font-size: .88rem; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.feats { display: grid; gap: 6px; }
.feat { border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); }
.feat summary { padding: 9px 12px; cursor: pointer; font-weight: 700; list-style: none; display: flex; gap: 10px; align-items: baseline; }
.feat summary::-webkit-details-marker { display: none; }
.feat summary::after { content: "+"; margin-left: auto; color: var(--faint); }
.feat[open] summary::after { content: "−"; }
.feat p { margin: 0; padding: 0 12px 11px; color: var(--mute); font-size: .93rem; }
.feat.locked { opacity: .45; }
.lv { font-size: .72rem; color: var(--ember); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; min-width: 44px; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.opt { text-align: left; display: grid; gap: 4px; align-content: start; padding: 12px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); }
.opt:hover { border-color: var(--line2); }
.opt.on { border-color: var(--ember); background: var(--emberbg); }
.opt b { font-weight: 700; }
.opt span { color: var(--mute); font-size: .86rem; line-height: 1.35; }
.opt.tall { padding: 14px; }
.gear { margin: 4px 0; padding-left: 18px; color: var(--mute); font-size: .9rem; }
.gold { color: var(--ember2); font-weight: 700; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
.gold.big { font-size: 1.6rem; font-family: var(--f-display); font-weight: 400; }
.plain { padding-left: 18px; color: var(--mute); margin: 10px 0 0; }

.abil-table { padding: 6px 12px; }
.ab-row { display: grid; grid-template-columns: minmax(0, 1fr) 92px 48px 60px 52px; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.abil-table:has(.ab-row.head span:nth-child(6)) .ab-row { grid-template-columns: minmax(0, 1fr) 92px 44px 50px 56px 52px; }
.ab-row:last-child { border-bottom: 0; }
.ab-row.head { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); padding-bottom: 4px; }
.ab-row.pri .ab-name { color: var(--ember2); }
.ab-name { font-weight: 700; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.tagp { font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ember); font-weight: 700; }
.ab-bonus { color: var(--verd); text-align: center; }
.ab-total { font-size: 1.2rem; font-weight: 700; text-align: center; }
.ab-mod { text-align: center; color: var(--ember2); font-weight: 700; }
select { background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; padding: .38em .5em; width: 100%; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.bonus-pick { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
.bonus-pick > span { font-weight: 700; color: var(--verd); min-width: 46px; font-size: .9rem; }

.spell-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; border-bottom: 1px solid var(--line); }
.spell-row:last-child { border-bottom: 0; }
.sr-main { display: flex; align-items: center; gap: 10px; padding: 9px 4px; text-align: left; min-width: 0; }
.sr-check { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line2); display: grid; place-items: center; flex: none; color: var(--onember); }
.spell-row.on .sr-check { background: var(--arc); border-color: var(--arc); }
.spell-row.lock .sr-check { background: var(--line2); border-color: var(--line2); color: var(--ink); }
.sr-check svg { width: 14px; height: 14px; }
.sr-name { font-weight: 700; flex: 1; min-width: 0; }
.sr-meta { color: var(--faint); font-size: .8rem; text-align: right; }
.sr-info { width: 34px; color: var(--mute); font-style: italic; font-family: Georgia, serif; }
.sr-body { grid-column: 1 / -1; padding: 2px 6px 12px 36px; color: var(--mute); font-size: .92rem; }
.sr-body p { margin: .4rem 0; }
.tagc { font-style: normal; font-size: .62rem; border: 1px solid var(--arc); color: var(--arc); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }
.spell-facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; margin: 4px 0; }
.spell-facts div { display: grid; }
.spell-facts dt { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.spell-facts dd { margin: 0; color: var(--ink); font-size: .9rem; }
.lvl-sep { font-family: var(--f-display); color: var(--ember); font-size: 1.05rem; margin: 16px 0 4px; border-bottom: 1px solid var(--line2); padding-bottom: 3px; }
.lvl-sep:first-child { margin-top: 4px; }

.field { display: grid; gap: 5px; margin-bottom: 12px; min-width: 0; }
.field > span { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); }
.field input, .field textarea, textarea.notes, textarea.code { background: var(--bg2); border: 1px solid var(--line2); border-radius: 9px; padding: .6em .75em; width: 100%; resize: vertical; }
.field.big input { font-family: var(--f-display); font-size: 1.5rem; padding: .35em .6em; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.align-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.align-grid .chip { justify-content: center; }
textarea.code { font-family: ui-monospace, monospace; font-size: .8rem; }

/* Fiche */
.sheet { max-width: 1200px; margin: 0 auto; padding-block: 14px 30px; }
.vitals { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
.hp-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.hp-card.down { border-color: var(--blood); background: linear-gradient(180deg, var(--bloodbg), var(--panel)); }
.hp-top { display: flex; justify-content: space-between; align-items: center; }
.temp { color: var(--arc); font-size: .85rem; font-weight: 700; }
.hp-num { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.hp-num b { font-size: 2.6rem; line-height: 1; font-weight: 700; }
.hp-num span { color: var(--mute); font-size: 1.1rem; }

/* Barre de jets */
#rollbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--barbg); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.rb-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.advseg { display: flex; border: 1px solid var(--line2); border-radius: 999px; overflow: hidden; flex: none; }
.advseg button { padding: 7px 12px; font-size: .85rem; font-weight: 700; color: var(--mute); }
.advseg button.on { color: var(--onember); background: var(--ink); }
.advseg button.on.adv { background: var(--verd); }
.advseg button.on.dis { background: var(--blood); color: #fff; }
.last-roll { flex: 1; min-width: 0; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.lr-label { color: var(--mute); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.last-roll b { font-size: 1.4rem; font-variant-numeric: tabular-nums; color: var(--ember2); }
.last-roll.crit b { color: var(--verd); } .last-roll.fumble b { color: var(--blood); }
.rb-inner > .mute { flex: 1; text-align: right; }
.tray-btn { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--ember); color: var(--onember); }
.tray-btn svg { width: 26px; height: 26px; }

#rolltoast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 40; transition: opacity .2s, transform .25s cubic-bezier(.2, 1.4, .4, 1); }
#rolltoast.show { opacity: 1; transform: translate(-50%, 0); }
.rt { display: grid; justify-items: center; gap: 2px; min-width: 220px; max-width: min(360px, calc(100vw - 32px)); padding: 12px 22px 14px; border-radius: 18px; background: var(--panel2); border: 1px solid var(--ember); box-shadow: 0 18px 50px var(--shadow), 0 0 30px rgba(229, 154, 79, .2); text-align: center; }
.rt-label { font-size: .85rem; color: var(--mute); }
.rt-total { font-size: 3rem; font-weight: 700; line-height: 1; color: var(--ember2); font-variant-numeric: tabular-nums; animation: pop .35s ease-out; }
.rt-detail { font-size: .8rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.rt-note { font-family: var(--f-display); font-size: 1.15rem; }
.rt.crit { border-color: var(--verd); } .rt.crit .rt-total, .rt.crit .rt-note { color: var(--verd); }
.rt.fumble { border-color: var(--blood); } .rt.fumble .rt-total, .rt.fumble .rt-note { color: var(--blood); }
.rt.dmgr .rt-total { color: var(--dmgink); } .rt.healr { border-color: var(--verd); } .rt.healr .rt-total { color: var(--verd); }
@keyframes pop { 0% { transform: scale(.4) rotate(-20deg); opacity: 0; } 70% { transform: scale(1.12) rotate(4deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
#toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -20px); opacity: 0; pointer-events: none; z-index: 60; background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; transition: all .2s; max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Modales et plateau */
.modal-back { position: fixed; inset: 0; background: var(--scrim); z-index: 45; }
.modal { position: fixed; z-index: 50; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 40px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 18px; padding: 22px; box-shadow: 0 30px 80px var(--shadow); }

.dice-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.die { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border-radius: 14px; border: 1px solid var(--line2); background: var(--bg2); font-family: var(--f-display); font-size: 1.3rem; color: var(--ember2); transition: transform .1s, border-color .15s; }
.die:hover { border-color: var(--ember); }
.die:active { transform: scale(.94) rotate(-6deg); }
.log { display: grid; }
.log-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.log-row > div { display: grid; min-width: 0; }
.log-total { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ember2); }
.log-row.crit .log-total, .log-row.healr .log-total { color: var(--verd); }
.log-row.fumble .log-total { color: var(--blood); }

/* Responsive */
@media (max-width: 980px) {
  .create-grid { grid-template-columns: minmax(0, 1fr); }
  .summary { position: static; order: -1; }
  .sum-card { padding: 12px; gap: 10px; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .vitals { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .hide-s { display: none; }
  .stat-tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
  .tile { padding: 8px 2px; border-radius: 11px; }
  .tile b { font-size: 1.25rem; }
  .tile .tsub { display: none; }
  .tile .lbl { font-size: .58rem; letter-spacing: .04em; }
  .abil-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .skills { grid-template-columns: minmax(0, 1fr); }
  .facts > div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .two-col { grid-template-columns: minmax(0, 1fr); }
  .align-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .align-grid .chip { font-size: .78rem; padding: .4em .3em; }
  .ab-row, .abil-table:has(.ab-row.head span:nth-child(6)) .ab-row { grid-template-columns: minmax(0, 1fr) 70px 34px 40px 40px; gap: 5px; }
  .abil-table:has(.ab-row.head span:nth-child(6)) .ab-row { grid-template-columns: minmax(0, 1fr) 66px 30px 30px 36px 36px; }
  .death { grid-template-columns: minmax(0, 1fr); }
  .advseg button { padding: 7px 9px; font-size: .78rem; }
  .atk:has(.alt) { grid-template-columns: minmax(0, 1fr) auto auto; }
  .atk .alt { grid-column: 3; }
  .rail-step .rs-label { display: none; }
  .rail-step.on .rs-label { display: inline; }
  .pick-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pick-grid.two { grid-template-columns: minmax(0, 1fr); }
  .pc-tag { font-size: .82rem; }
  .sum-vitals b { font-size: 1rem; }
  .step-nav .btn { padding: .6em .9em; }
}
@media (max-width: 640px) { .tb-actions .btn.small:not(.ghost) { padding: .4em .7em; font-size: .82rem; } }
@media (max-width: 380px) { .pick-grid { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Forge des Héros — moteur de règles (fonctions pures) */

const mod = (s) => Math.floor((s - 10) / 2);
const sg = (n) => (n >= 0 ? "+" + n : "−" + Math.abs(n));
const pbOf = (lv) => 2 + Math.floor((lv - 1) / 4);

function assignStandard(b) {
  const pri = PRIORITY[b.cls] || ABK;
  const pool = b.method === "roll" && b.rolled ? [...b.rolled].sort((x, y) => y - x) : STD_ARRAY;

const MI_LIST = { clr: "clerc", drd: "druide", mag: "magicien" };
const MI_NAME = { clr: "Cleric", drd: "Druid", mag: "Wizard" };

function featsOf(b) {
  const out = [];
  if (b.bg) out.push({ id: BACKGROUNDS[b.bg].feat, src: "bg" });
  if (b.species === "humain" && b.humanFeat) out.push({ id: b.humanFeat, src: "human" });
  return out;
}

function subActive(b) { return b.level >= 3; }

function migrate(b) {
  const o = b.opts;
  if (!o.asis) { o.asis = {}; if (o.asi) o.asis[4] = o.asi; }
  delete o.asi;
  if (!o.boon) o.boon = { id: null, a: null };
  if (!o.lore2) o.lore2 = [];
  if (!o.arcanum) o.arcanum = {};
  ["style2", "strike", "dragon"].forEach((k) => { if (!(k in o)) o[k] = null; });
  if (b.details && !("divinite" in b.details)) b.details.divinite = "";
  return b;
}
function asiAt(b, lv) { if (!b.opts.asis[lv]) b.opts.asis[lv] = { mode: "2", a: null, b: null }; return b.opts.asis[lv]; }
function activeAsiLevels(b) { return asiLevels(b.cls).filter((l) => l <= b.level); }
function metaCount(b) { return b.level >= 17 ? 6 : b.level >= 10 ? 4 : b.level >= 2 ? 2 : 0; }
function martialDie(L) { return L >= 17 ? "1d12" : L >= 11 ? "1d10" : L >= 5 ? "1d8" : "1d6"; }
function attacksPerAction(b) {
  if (b.cls === "guerrier") return b.level >= 20 ? 4 : b.level >= 11 ? 3 : b.level >= 5 ? 2 : 1;
  if (["barbare", "paladin", "rodeur", "moine"].includes(b.cls) && b.level >= 5) return 2;
  if (b.cls === "occultiste" && b.opts.inv.includes("lamedevorante")) return 3;
  if (b.cls === "occultiste" && b.opts.inv.includes("lameassoiffee")) return 2;
  return 1;
}

function abilities(b) {
  migrate(b);
  const out = {};
  ABK.forEach((k) => (out[k] = b.base[k] || 8));
  const bg = b.bg && BACKGROUNDS[b.bg];
  if (bg) {
    if (b.bonus.mode === "21") {
      if (b.bonus.p2) out[b.bonus.p2] += 2;
      if (b.bonus.p1 && b.bonus.p1 !== b.bonus.p2) out[b.bonus.p1] += 1;
    } else bg.ab.forEach((k) => (out[k] += 1));
  }
  ABK.forEach((k) => (out[k] = Math.min(out[k], 20)));
  activeAsiLevels(b).forEach((lv) => {
    const a = b.opts.asis[lv];
    if (!a) return;
    if (a.mode === "2" && a.a) out[a.a] = Math.min(20, out[a.a] + 2);
    if (a.mode === "11") { if (a.a) out[a.a] = Math.min(20, out[a.a] + 1); if (a.b && a.b !== a.a) out[a.b] = Math.min(20, out[a.b] + 1); }
  });
  if (b.level >= 19 && b.opts.boon.a) out[b.opts.boon.a] = Math.min(30, out[b.opts.boon.a] + 1);
  if (b.level >= 20 && b.cls === "barbare") ["for", "con"].forEach((k) => (out[k] = Math.max(out[k], Math.min(25, out[k] + 4))));
  if (b.level >= 20 && b.cls === "moine") ["dex", "sag"].forEach((k) => (out[k] = Math.max(out[k], Math.min(25, out[k] + 4))));
  return out;
}

function classSkillPool(b) {
  const c = CLASSES[b.cls];
  if (!c) return [];
  return c.skills.from === "all" ? SKK : c.skills.from;
}

function profSkills(b) {
  const s = new Set();
  if (b.bg) BACKGROUNDS[b.bg].skills.forEach((k) => s.add(k));
  b.skillsClass.forEach((k) => s.add(k));
  b.skillsSpecies.forEach((k) => s.add(k));
  featsOf(b).forEach((f) => { if (f.id === "doue") b.skilled.forEach((k) => s.add(k)); });
  if (b.cls === "barde" && b.level >= 3) b.skillsLore.forEach((k) => s.add(k));
  if (b.cls === "barbare" && b.level >= 3 && b.skillPrimal) s.add(b.skillPrimal);
  return s;
}

function expertiseCount(b) {
  if (b.cls === "roublard") return b.level >= 6 ? 4 : 2;
  if (b.cls === "barde" && b.level >= 2) return b.level >= 9 ? 4 : 2;
  if (b.cls === "rodeur" && b.level >= 2) return b.level >= 9 ? 3 : 1;
  if (b.cls === "magicien" && b.level >= 2) return 1;
  return 0;
}
function expertisePool(b) {
  const prof = [...profSkills(b)];
  if (b.cls === "magicien") return prof.filter((k) => ["arca", "hist", "inve", "mede", "natu", "reli"].includes(k));
  return prof;
}

function weaponProf(b, w) {
  const c = CLASSES[b.cls];
  if (!c) return false;
  const cats = [...c.weapons];
  if ((b.cls === "clerc" && b.opts.order === "protecteur") || (b.cls === "druide" && b.opts.order === "gardien")) cats.push("guerre");
  if (cats.includes(w.c)) return true;
  if (w.c === "guerre" && cats.includes("guerreLegere") && w.p.includes("L")) return true;
  if (w.c === "guerre" && cats.includes("guerreFinesse") && (w.p.includes("L") || w.p.includes("F"))) return true;
  return false;
}
function armorProfs(b) {
  const c = CLASSES[b.cls];
  if (!c) return [];
  const a = [...c.armor];
  if (b.cls === "clerc" && b.opts.order === "protecteur") a.push("lourde");
  if (b.cls === "druide" && b.opts.order === "gardien") a.push("inter");
  return a;
}

function slotsOf(b) {
  const c = CLASSES[b.cls];
  if (!c || !c.caster) return null;
  const i = b.level - 1;
  if (c.caster === "full") return { type: "std", slots: FULL_SLOTS[i] };
  if (c.caster === "half") return { type: "std", slots: HALF_SLOTS[i] };
  return { type: "pact", n: PACT_SLOTS[i][0], lvl: PACT_SLOTS[i][1] };
}
function maxSpellLevel(b) {

  if (!s) return 0;
  return s.type === "pact" ? s.lvl : s.slots.length;
}
function cantripCount(b) {
  const c = CLASSES[b.cls];
  if (!c || !c.caster) return 0;
  let n = c.cant[b.level - 1];
  if ((b.cls === "clerc" && b.opts.order === "thaumaturge") || (b.cls === "druide" && b.opts.order === "magicien")) n += 1;
  return n;
}
function prepCount(b) {
  const c = CLASSES[b.cls];
  return c && c.caster ? c.prep[b.level - 1] : 0;
}

/* Sorts « toujours préparés » ou donnés par l’espèce/les dons */
function grantedSpells(b) {
  const out = [];
  const c = CLASSES[b.cls];
  const sp = b.species && SPECIES[b.species];
  if (c) {
    if (c.always) Object.entries(c.always).forEach(([lv, ids]) => { if (b.level >= +lv) ids.forEach((id) => out.push({ id, src: "Class", ab: c.sab, always: true, free: b.cls === "paladin" ? "smite" : b.cls === "rodeur" ? "ennemi" : null })); });
    if (b.cls === "druide") out.push({ id: "comanimaux", src: "Druidic", ab: c.sab, always: true });
    if (subActive(b) && c.sub.spells) Object.entries(c.sub.spells).forEach(([lv, ids]) => { if (b.level >= +lv) ids.forEach((id) => out.push({ id, src: c.sub.n, ab: c.sab, always: true })); });
    if (b.cls === "druide" && subActive(b) && b.opts.land) Object.entries(LAND_SPELLS[b.opts.land].s).forEach(([lv, ids]) => { if (b.level >= +lv) ids.forEach((id) => out.push({ id, src: "Circle of the Land", ab: c.sab, always: true })); });
  }
  if (sp) {
    const opt = sp.choice && b.sChoice && sp.choice.opts[b.sChoice];
    if (opt && opt.spells) Object.entries(opt.spells).forEach(([lv, ids]) => {
      if (b.level >= +lv) ids.forEach((id) => out.push({ id, src: sp.n, ab: b.sSpellAb, always: true, free: SPELLS[id].l > 0 ? "sp_" + id : null }));
    });
    if (sp.extraSpells) sp.extraSpells.forEach((id) => out.push({ id, src: sp.n, ab: b.sSpellAb, always: true }));
  }
  if (b.cls === "barde" && b.level >= 6) b.opts.lore2.forEach((id) => out.push({ id, src: "Magical Discoveries", ab: "cha", always: true }));
  if (b.cls === "occultiste") Object.entries(b.opts.arcanum).forEach(([lv, id]) => { if (id && b.level >= ARCANUM_LV[lv]) out.push({ id, src: "Mystic Arcanum", ab: "cha", always: true, free: "arc_" + lv }); });
  featsOf(b).forEach((f) => {
    if (f.id !== "initie") return;
    const m = b.magic[f.src];
    m.cant.forEach((id) => out.push({ id, src: "Initiate (" + MI_NAME[m.list] + ")", ab: m.ab, always: true }));
    if (m.spell) out.push({ id: m.spell, src: "Initiate (" + MI_NAME[m.list] + ")", ab: m.ab, always: true, free: "mi_" + f.src });
  });
  // dédoublonner (garder la première source)
  const seen = new Set();
  return out.filter((s) => SPELLS[s.id] && !seen.has(s.id) && seen.add(s.id));
}

const ARCANUM_LV = { 6: 11, 7: 13, 8: 15, 9: 17 };
function poolClasses(b) { return b.cls === "barde" && b.level >= 10 ? ["barde", "clerc", "druide", "magicien"] : [b.cls]; }
function classSpellPool(b, lvl) {
  const cls = poolClasses(b);

}

function speciesHPBonus(b) { return b.species === "nain" ? b.level : 0; }

function hpMax(b, ab) {
  const c = CLASSES[b.cls];
  if (!c) return 0;
  const cm = mod(ab.con);
  let hp = Math.max(1, c.hd + cm);
  for (let l = 2; l <= b.level; l++) hp += Math.max(1, c.hd / 2 + 1 + cm);
  hp += speciesHPBonus(b);
  if (b.cls === "ensorceleur" && b.level >= 3) hp += b.level;
  return hp;
}

function resources(b, ab) {

  switch (b.cls) {
    case "barbare": add("rage", "Rage", L >= 17 ? 6 : L >= 12 ? 5 : L >= 6 ? 4 : L >= 3 ? 3 : 2, "short1", "+" + rageDmg(L) + " damage"); if (L >= 11) add("relent", "Relentless Rage (DC 10, +5 per use)", 1, "short"); if (L >= 14) add("intim", "Intimidating Presence", 1, "long"); if (L >= 15) add("persist", "Persistent Rage", 1, "long"); break;
    case "barde": add("insp", "Bardic Inspiration", Math.max(1, mod(ab.cha)), L >= 5 ? "short" : "long", bardDie(L)); break;
    case "clerc": if (L >= 2) add("cd", "Channel Divinity", L >= 18 ? 4 : L >= 6 ? 3 : 2, "short1"); if (L >= 10) add("interv", "Divine Intervention", 1, "long"); break;
    case "druide": if (L >= 2) add("ws", "Wild Shape", L >= 17 ? 4 : L >= 6 ? 3 : 2, "short1"); if (L >= 6 && b.opts.land) add("natrec", "Natural Recovery", 1, "long"); break;
    case "guerrier": add("sw", "Second Wind", L >= 10 ? 4 : L >= 4 ? 3 : 2, "short1", "1d10+" + L); if (L >= 2) add("surge", "Action Surge", L >= 17 ? 2 : 1, "short"); if (L >= 9) add("indom", "Indomitable", L >= 17 ? 3 : L >= 13 ? 2 : 1, "long", "+" + L); break;
    case "moine": if (L >= 2) add("focus", "Focus Points", L, "short"); if (L >= 2) add("meta", "Uncanny Metabolism", 1, "long"); if (L >= 6) add("whole", "Wholeness of Body", Math.max(1, mod(ab.sag)), "long"); break;
    case "paladin": add("loh", "Lay on Hands (HP)", 5 * L, "long", "pool"); if (L >= 2) add("smite", "Free Divine Smite", 1, "long"); if (L >= 3) add("cd", "Channel Divinity", L >= 11 ? 3 : 2, "short1"); if (L >= 5) add("steed", "Free Find Steed", 1, "long"); if (L >= 20) add("nimbe", "Holy Nimbus", 1, "long"); break;
    case "rodeur": add("ennemi", "Free Hunter's Mark", L >= 17 ? 6 : L >= 13 ? 5 : L >= 9 ? 4 : L >= 5 ? 3 : 2, "long", L >= 20 ? "d10" : "d6"); if (L >= 10) add("tireless", "Tireless", Math.max(1, mod(ab.sag)), "long"); if (L >= 14) add("veil", "Nature’s Veil", Math.max(1, mod(ab.sag)), "long"); break;
    case "roublard": if (L >= 20) add("luck", "Stroke of Luck", 1, "short"); break;
    case "ensorceleur": add("innate", "Innate Sorcery", 2, "long"); if (L >= 2) add("sp", "Sorcery Points", L, "long"); if (L >= 5) add("sorcrest", "Sorcerous Restoration", 1, "long"); if (L >= 14) add("wings", "Dragon Wings", 1, "long"); break;
    case "occultiste": if (L >= 2) add("cunning", "Magical Cunning", 1, "long"); if (L >= 6) add("darkluck", "Dark One's Own Luck", Math.max(1, mod(ab.cha)), "long", "1d10"); if (L >= 9) add("patron", "Contact Patron", 1, "long"); if (L >= 14) add("hurl", "Hurl Through Hell", 1, "long", "8d10"); break;
    case "magicien": add("arcrec", "Arcane Recovery", 1, "long"); break;
  }
  switch (b.species) {
    case "drakeide": add("breath", "Breath Weapon", pb, "long", L >= 5 ? "2d10" : "1d10"); if (L >= 5) add("flight", "Draconic Flight", 1, "long"); break;
    case "nain": add("stone", "Stonecunning", pb, "long"); break;
    case "orc": add("adren", "Adrenaline Rush", pb, "short"); add("relent", "Relentless Endurance", 1, "long"); break;
    case "goliath": add("giant", "Giant Ancestry", pb, "long"); if (L >= 5) add("large", "Large Form", 1, "long"); break;
    case "gnome": if (b.sChoice === "foret") add("sp_comanimaux", "Speak with Animals", pb, "long"); break;
  }
  grantedSpells(b).forEach((s) => { if (s.free && s.free.startsWith("sp_") && s.id !== "comanimaux") add(s.free, SPELLS[s.id].n + " (free)", 1, "long"); });
  featsOf(b).forEach((f) => { if (f.id === "initie" && b.magic[f.src].spell) add("mi_" + f.src, SPELLS[b.magic[f.src].spell].n + " (free)", 1, "long"); });
  if (b.cls === "occultiste") Object.entries(b.opts.arcanum).forEach(([lv, id]) => { if (id && L >= ARCANUM_LV[lv]) add("arc_" + lv, SPELLS[id].n + " (arcanum)", 1, "long"); });
  if (L >= 19 && b.opts.boon.id === "destin") add("boonfate", "Boon of Fate", 1, "short", "2d4");
  if (L >= 19 && b.opts.boon.id === "rappel") add("boonrecall", "Spell Recall", 1, "long");
  if (b.cls === "barde" && L >= 3) r.forEach((x) => { if (x.k === "insp") x.note += " · Cutting Words"; });
  return r;
}

function rageDmg(L) { return L >= 16 ? 4 : L >= 9 ? 3 : 2; }
function bardDie(L) { return L >= 15 ? "d12" : L >= 10 ? "d10" : L >= 5 ? "d8" : "d6"; }

function features(b) {
  const out = [];
  const c = CLASSES[b.cls], sp = SPECIES[b.species];
  if (sp) {
    sp.traits.forEach((t) => {
      const m = t.n.match(/\(niv\. (\d)\)/);
      if (m && b.level < +m[1]) return;
      out.push({ n: t.n.replace(/ \(niv\. \d\)/, ""), d: t.d, src: sp.n });
    });
    const opt = sp.choice && b.sChoice && sp.choice.opts[b.sChoice];
    if (opt) out.push({ n: sp.choice.label + " : " + opt.n, d: opt.d || ("Damage type: " + DMG[opt.t] + "."), src: sp.n });
  }
  if (c) for (let l = 1; l <= b.level; l++) (c.feats[l] || []).forEach(([n, d]) => out.push({ n, d, src: c.n + " " + l, lvl: l }));
  featsOf(b).forEach((f) => out.push({ n: FEATS[f.id].n, d: FEATS[f.id].d, src: f.src === "bg" ? "Background" : "Human" }));
  if (b.opts.style && FIGHTING_STYLES[b.opts.style]) out.push({ n: "Style: " + FIGHTING_STYLES[b.opts.style].n, d: FIGHTING_STYLES[b.opts.style].d, src: c.n });
  if (b.cls === "guerrier" && b.level >= 7 && b.opts.style2 && FIGHTING_STYLES[b.opts.style2]) out.push({ n: "Style: " + FIGHTING_STYLES[b.opts.style2].n, d: FIGHTING_STYLES[b.opts.style2].d, src: "Champion" });
  const so = STRIKE_OPTS[b.cls];
  if (so && b.level >= so.lvl && b.opts.strike && so.opts[b.opts.strike]) out.push({ n: so.label + " : " + so.opts[b.opts.strike].n, d: so.opts[b.opts.strike].d, src: c.n });
  if (b.cls === "ensorceleur" && b.level >= 6 && b.opts.dragon) out.push({ n: "Affinity: " + DMG[b.opts.dragon], d: "Resistance to " + DMG[b.opts.dragon] + "; + your CHA modifier to damage of this type from your spells.", src: "Draconic Sorcery" });
  if (b.level >= 19 && b.opts.boon.id) out.push({ n: EPIC_BOONS[b.opts.boon.id].n, d: EPIC_BOONS[b.opts.boon.id].d, src: "Epic Boon" });
  if (b.cls === "rodeur" && b.level >= 3 && b.opts.prey) out.push({ n: b.opts.prey === "colosse" ? "Colossus Slayer" : "Horde Breaker", d: b.opts.prey === "colosse" ? "Once per turn, +1d8 damage against a creature that is missing any of its Hit Points." : "Once per turn, an extra attack against another creature within 5 feet of the original target.", src: "Hunter" });
  if (b.cls === "druide" && b.level >= 3 && b.opts.land) out.push({ n: "Land: " + LAND_SPELLS[b.opts.land].n, d: "Circle spells are always prepared.", src: "Circle of the Land" });
  b.opts.inv.forEach((k) => INVOCATIONS[k] && out.push({ n: INVOCATIONS[k].n, d: INVOCATIONS[k].d, src: "Invocation" }));
  b.opts.meta.forEach((k) => METAMAGIC[k] && out.push({ n: METAMAGIC[k].n, d: METAMAGIC[k].d, src: "Metamagic" }));
  return out;
}

function compute(b, p) {
  const c = CLASSES[b.cls], sp = SPECIES[b.species], bg = BACKGROUNDS[b.bg];
  const L = b.level, pb = pbOf(L);
  const ab = abilities(b), m = {};
  ABK.forEach((k) => (m[k] = mod(ab[k])));
  const feats = featsOf(b).map((f) => f.id);
  const inv = (p && p.inv) || [];

  // Compétences
  const prof = profSkills(b), exp = new Set(b.expertise);
  const skills = SKK.map((k) => {
    const s = SKILLS[k];
    let v = m[s.a], pr = 0;
    if (prof.has(k)) { pr = exp.has(k) ? 2 : 1; v += pb * pr; }
    else if (b.cls === "barde" && L >= 2) v += Math.floor(pb / 2);
    if (b.cls === "clerc" && b.opts.order === "thaumaturge" && (k === "arca" || k === "reli")) v += Math.max(1, m.sag);
    if (b.cls === "druide" && b.opts.order === "magicien" && (k === "arca" || k === "natu")) v += Math.max(1, m.sag);
    return { k, n: s.n, a: s.a, v, pr };
  });
  const saveProf = new Set(c ? c.saves : []);
  if (b.cls === "moine" && L >= 14) ABK.forEach((k) => saveProf.add(k));
  if (b.cls === "roublard" && L >= 15) { saveProf.add("sag"); saveProf.add("cha"); }
  const aura = b.cls === "paladin" && L >= 6 ? Math.max(1, m.cha) : 0;
  const saves = ABK.map((k) => ({ k, v: m[k] + (saveProf.has(k) ? pb : 0) + aura, pr: saveProf.has(k) }));

  // Armure & CA
  const eqArmor = inv.find((i) => i.eq && i.ref && i.ref.startsWith("a:") && ARMORS[i.ref.slice(2)] && ARMORS[i.ref.slice(2)].t !== "bouclier");
  const eqShield = inv.find((i) => i.eq && i.ref === "a:bouclier");
  const armor = eqArmor && ARMORS[eqArmor.ref.slice(2)];
  const aprof = armorProfs(b);
  let ac, acNote;
  if (armor) {
    ac = armor.ac + Math.min(m.dex, armor.dex); acNote = armor.n;
    if ((b.opts.style === "defense" && (b.cls === "guerrier" || b.cls === "paladin" || b.cls === "rodeur")) || (b.cls === "guerrier" && L >= 7 && b.opts.style2 === "defense")) ac += 1;
  } else {
    const opts = [{ v: 10 + m.dex, n: "Unarmored" }];
    if (b.cls === "barbare") opts.push({ v: 10 + m.dex + m.con, n: "Unarmored Defense" });
    if (b.cls === "moine" && !eqShield) opts.push({ v: 10 + m.dex + m.sag, n: "Unarmored Defense" });
    if (b.cls === "ensorceleur" && L >= 3) opts.push({ v: 10 + m.dex + m.cha, n: "Draconic Resilience" });
    const best = opts.sort((x, y) => y.v - x.v)[0];
    ac = best.v; acNote = best.n;
  }
  if (eqShield) { ac += 2; acNote += " + " + ARMORS.bouclier.n.toLowerCase(); }
  const armorWarn = (armor && !aprof.includes(armor.t)) || (eqShield && !aprof.includes("bouclier"));
  const stealthDis = armor && armor.st;

  // Vitesse
  let speed = sp ? sp.speed : 9;
  const opt = sp && sp.choice && b.sChoice && sp.choice.opts[b.sChoice];
  if (opt && opt.speed) speed = opt.speed;
  if (b.cls === "barbare" && L >= 5 && !(armor && armor.t === "lourde")) speed += 3;
  if (b.cls === "moine" && L >= 2 && !armor && !eqShield) speed += L >= 18 ? 9 : L >= 14 ? 7.5 : L >= 10 ? 6 : L >= 6 ? 4.5 : 3;
  if (b.cls === "rodeur" && L >= 6 && !(armor && armor.t === "lourde")) speed += 3;
  if (armor && armor.str && ab.for < armor.str) speed -= 3;
  let darkvision = sp ? sp.dv : 0;
  if (opt && opt.dv) darkvision = opt.dv;

  // Attaques
  const attacks = [];
  const maDie = martialDie(L);
  const archery = b.opts.style === "archerie" || (b.cls === "guerrier" && L >= 7 && b.opts.style2 === "archerie");
  const crit = b.cls === "guerrier" ? (L >= 15 ? 18 : L >= 3 ? 19 : 20) : 20;
  inv.filter((i) => i.eq && i.ref && i.ref.startsWith("w:")).forEach((i) => {
    const w = WEAPONS[i.ref.slice(2)];
    if (!w) return;
    const isMonkW = b.cls === "moine" && w.k === "cac" && (w.c === "simple" || w.p.includes("L"));
    let a = w.k === "dist" ? "dex" : "for";
    if (w.p.includes("F") || isMonkW) a = m.dex > m.for ? "dex" : "for";
    const proficient = weaponProf(b, w);
    let hit = m[a] + (proficient ? pb : 0) + (archery && w.k === "dist" ? 2 : 0);
    let die = w.d;
    if (isMonkW && dieAvg(maDie) > dieAvg(die)) die = maDie;
    const mastery = c && c.mastery && b.opts.mastery.includes(i.ref.slice(2)) ? w.m : null;
    const props = w.p.map((x) => WPROP[x]).join(", ");
    attacks.push({
      n: w.n, hit, dmg: die + (m[a] ? sg(m[a]).replace("−", "-") : ""), alt: w.v ? w.v + (m[a] ? sg(m[a]).replace("−", "-") : "") : null,
      ty: DMG[w.t], range: w.r || (w.p.includes("AL") ? "10 feet" : "5 feet"), props, mastery, prof: proficient, crit,
      rage: b.cls === "barbare" && a === "for",
    });
  });
  const unarmedA = b.cls === "moine" && m.dex > m.for ? "dex" : "for";
  attacks.push({ n: "Unarmed Strike", hit: m[unarmedA] + pb, dmg: b.cls === "moine" ? maDie + (m[unarmedA] ? sg(m[unarmedA]).replace("−", "-") : "") : String(Math.max(1, 1 + m.for)), ty: DMG.contondant, range: "5 feet", props: "", prof: true, crit, rage: b.cls === "barbare" });

  // Incantation
  let casting = null;
  const granted = grantedSpells(b);
  if (c && c.caster) {
    casting = { ab: c.sab, dc: 8 + pb + m[c.sab], atk: pb + m[c.sab], slots: slotsOf(b), max: maxSpellLevel(b) };
  }
  const spellList = [];
  const potent = (b.cls === "clerc" || b.cls === "druide") && L >= 7 && b.opts.strike === "puissant";
  const dmgBonus = (s) => {
    let v = 0, why = [];
    if (s.l === 0 && potent && s.cl.includes(b.cls)) { v += m.sag; why.push("Potent Spellcasting"); }
    if (b.cls === "magicien" && L >= 10 && s.e === "evo" && s.l > 0 && s.cl.includes("magicien")) { v += m.int; why.push("Empowered Evocation"); }
    if (b.cls === "ensorceleur" && L >= 6 && b.opts.dragon && s.ty === b.opts.dragon) { v += m.cha; why.push("Elemental Affinity"); }
    if (b.cls === "occultiste" && s.id === "dechargeocculte" && b.opts.inv.includes("dechiree")) { v += m.cha; why.push("Agonizing Blast"); }
    return { v, why };
  };
  const pushSpell = (id, src, abk, always, free) => {
    const s = SPELLS[id];
    if (!s || spellList.some((x) => x.id === id)) return;
    const db = s.dmg ? dmgBonus({ ...s, id }) : { v: 0, why: [] };
    spellList.push({ id, ...s, src, ab: abk, dc: 8 + pb + m[abk], atk: pb + m[abk], mod: m[abk], always, free, dmgBonus: db.v, dmgWhy: db.why });
  };
  b.cant.forEach((id) => pushSpell(id, c.n, c.sab, false));
  b.prep.forEach((id) => pushSpell(id, c.n, c.sab, false));
  granted.forEach((g) => pushSpell(g.id, g.src, g.ab, true, g.free));
  spellList.sort((x, y) => x.l - y.l || x.n.localeCompare(y.n, "fr"));

  const init = m.dex + (feats.includes("vigilant") ? pb : 0);
  const perc = skills.find((s) => s.k === "perc").v;

  const langs = ["Common", ...b.langs.map((l) => LANG_L[l] || l)];
  if (b.cls === "roublard") langs.push("Thieves’ Cant");
  if (b.cls === "druide") langs.push("Druidic");

  return {
    L, pb, ab, m, skills, saves, ac, acNote, armorWarn, stealthDis, speed, darkvision, init, perc,
    hpMax: hpMax(b, ab), hd: c ? c.hd : 8, attacks, casting, spells: spellList,
    resources: resources(b, ab), features: features(b), langs,
    sneak: b.cls === "roublard" ? Math.ceil(L / 2) + "d6" : null, rageDmg: b.cls === "barbare" ? rageDmg(L) : 0,
    apa: attacksPerAction(b), crit, aura, maDie,
    profs: {
      armor: aprof.map((a) => ({ legere: "Light", inter: "Medium", lourde: "Heavy", bouclier: "Shields" })[a]).join(", ") || "None",
      weapons: c ? c.weapons.map((w) => ({ simple: "Simple weapons", guerre: "Martial weapons", guerreLegere: "Martial weapons with the Light property", guerreFinesse: "Martial weapons (Finesse or Light)" })[w]).join(", ") + ((b.cls === "clerc" && b.opts.order === "protecteur") || (b.cls === "druide" && b.opts.order === "gardien") ? ", martial weapons" : "") : "",
      tools: [c && c.tools !== "—" ? c.tools : null, bg ? bg.tool : null].filter(Boolean).join(", ") || "None",
    },
    sub: c && L >= 3 ? c.sub.n : null,
  };
}

function dieAvg(d) { const [n, f] = d.split("d").map(Number); return n * (f + 1) / 2; }

/* Équipement de départ → inventaire */
function itemFrom(entry) {
  const [ref, q] = entry;
  if (ref.startsWith("w:")) return { uid: uid(), ref, n: WEAPONS[ref.slice(2)].n, q: q || 1, eq: false };
  if (ref.startsWith("a:")) return { uid: uid(), ref, n: ARMORS[ref.slice(2)].n, q: 1, eq: false };
  return { uid: uid(), ref: "g:" + ref, n: GEAR[ref] || ref, q: q || 1, eq: false };
}
function itemName(i) {
  if (i.ref && i.ref.startsWith("w:") && WEAPONS[i.ref.slice(2)]) return WEAPONS[i.ref.slice(2)].n;
  if (i.ref && i.ref.startsWith("a:") && ARMORS[i.ref.slice(2)]) return ARMORS[i.ref.slice(2)].n;
  if (i.ref && i.ref.startsWith("g:") && GEAR[i.ref.slice(2)]) return GEAR[i.ref.slice(2)];
  return i.n;
}
function startingInventory(b) {
  const c = CLASSES[b.cls], bg = BACKGROUNDS[b.bg];
  let inv = [], gold = 0;
  if (c) {
    if (b.gear.cls === "A") { inv.push(...c.gearA.map(itemFrom)); gold += c.goldA; }
    else if (b.gear.cls === "B" && c.gearB) { inv.push(...c.gearB.map(itemFrom)); gold += c.goldBg; }
    else gold += c.goldB;
  }
  if (bg) { if (b.gear.bg === "A") { inv.push(...bg.gear.map(itemFrom)); gold += bg.gold; } else gold += 50; }
  // équiper automatiquement : meilleure armure maîtrisée, bouclier, armes
  const aprof = armorProfs(b);
  const armors = inv.filter((i) => i.ref.startsWith("a:") && i.ref !== "a:bouclier" && aprof.includes(ARMORS[i.ref.slice(2)].t));
  if (armors.length) armors.sort((x, y) => ARMORS[y.ref.slice(2)].ac - ARMORS[x.ref.slice(2)].ac)[0].eq = true;
  const sh = inv.find((i) => i.ref === "a:bouclier");
  if (sh && aprof.includes("bouclier")) sh.eq = true;
  inv.filter((i) => i.ref.startsWith("w:")).forEach((i) => (i.eq = true));
  // fusionner les doublons
  const merged = [];
  inv.forEach((i) => { const f = merged.find((x) => x.ref === i.ref); if (f) f.q += i.q; else merged.push(i); });
  return { inv: merged, gold };
}

function newPlay(b) {
  const s = startingInventory(b);
  const p = { hp: 0, temp: 0, hdUsed: 0, slots: {}, pact: 0, res: {}, ds: { s: 0, f: 0 }, cond: [], insp: b.species === "humain", inv: s.inv, gold: s.gold, notes: "", conc: null };
  p.hp = compute(b, p).hpMax;
  return p;
}

/* Validation par étape : liste de messages manquants */
function issues(b) {
  const out = { classe: [], origine: [], carac: [], options: [], sorts: [], equip: [], details: [] };
  const c = CLASSES[b.cls], sp = SPECIES[b.species], bg = BACKGROUNDS[b.bg];
  if (!c) out.classe.push("Choose a class");
  if (!sp) out.origine.push("Choose a species");
  if (sp && sp.choice && !b.sChoice) out.origine.push(sp.choice.label);
  if (!bg) out.origine.push("Choose a background");
  if (bg && b.bonus.mode === "21" && (!b.bonus.p2 || !b.bonus.p1 || b.bonus.p1 === b.bonus.p2)) out.carac.push("Assign your background bonuses");
  if (b.method === "points") { const spent = ABK.reduce((t, k) => t + (PB_COST[b.base[k]] ?? 99), 0); if (spent > 27) out.carac.push("Too many points spent"); }
  if (b.method === "roll" && !b.rolled) out.carac.push("Roll the dice");
  migrate(b);
  activeAsiLevels(b).forEach((lv) => { const a = b.opts.asis[lv]; if (!a || !a.a || (a.mode === "11" && (!a.b || a.b === a.a))) out.carac.push("Ability Score Improvement (lvl. " + lv + ")"); });
  if (b.level >= 19 && (!b.opts.boon.id || !b.opts.boon.a)) out.carac.push("Epic Boon (lvl. 19)");
  if (c) {
    const need = c.skills.n;
    if (b.skillsClass.length < need) out.options.push(`Class skills (${b.skillsClass.length}/${need})`);
    if (sp && sp.skillPick && b.skillsSpecies.length < sp.skillPick.n) out.options.push("Species skill");
    if (featsOf(b).some((f) => f.id === "doue") && b.skilled.length < 3) out.options.push(`Skilled feat (${b.skilled.length}/3)`);
    if (b.species === "humain" && !b.humanFeat) out.options.push("Origin feat (Human)");
    featsOf(b).forEach((f) => { if (f.id === "initie") { const mm = b.magic[f.src]; if (mm.cant.length < 2 || !mm.spell) out.options.push("Magic Initiate spells"); } });
    const ex = expertiseCount(b); if (b.expertise.length < ex) out.options.push(`Expertise (${b.expertise.length}/${ex})`);
    if (b.cls === "barde" && b.level >= 3 && b.skillsLore.length < 3) out.options.push("College of Lore skills");
    if (b.cls === "barbare" && b.level >= 3 && !b.skillPrimal) out.options.push("Primal Knowledge");
    if (c.mastery && b.opts.mastery.length < c.mastery) out.options.push(`Weapon Mastery (${b.opts.mastery.length}/${c.mastery})`);
    if ((b.cls === "guerrier" || (["paladin", "rodeur"].includes(b.cls) && b.level >= 2)) && !b.opts.style) out.options.push("Fighting Style");

function rollDie(f) {
  if (typeof crypto !== "undefined" && crypto.getRandomValues) { const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % f) + 1; }
  return Math.floor(Math.random() * f) + 1;
}
// "2d6+1d4+3" → { total, parts:[{d:6, r:[..]}], mod }
function rollExpr(expr, opts = {}) {
  const clean = String(expr).replace(/\s/g, "").replace(/−/g, "-").toLowerCase();
  const re = /([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g;
  let mt, total = 0, parts = [], modv = 0;
  while ((mt = re.exec(clean))) {
    if (mt[3]) {
      const sgn = mt[1] === "-" ? -1 : 1, n = Math.min(+(mt[2] || 1) * (opts.crit ? 2 : 1), 100), f = +mt[3];
      const r = Array.from({ length: n }, () => rollDie(f));
      parts.push({ d: f, r, sgn });
      total += sgn * r.reduce((a, x) => a + x, 0);
    } else if (mt[5]) { const v = (mt[4] === "-" ? -1 : 1) * +mt[5]; modv += v; total += v; }
  }
  return { total, parts, mod: modv };
}
function rollD20(modv, mode) {
  const a = rollDie(20), b2 = mode !== "normal" ? rollDie(20) : null;
  let kept = a;
  if (mode === "adv") kept = Math.max(a, b2);
  if (mode === "dis") kept = Math.min(a, b2);
  return { dice: b2 == null ? [a] : [a, b2], kept, total: kept + modv, mod: modv, mode };
}

const Store = {

    try {
      if (window.claude && claude.use) {
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        const id = user ? await user.id() : null;
        if (db && id) { this.db = db; this.uid = id; this.mode = "cloud"; }
      }
    } catch (e) { /* repli local */ }
  },
  col() { return this.db.collection("data/users/" + this.uid); },
  async seeded() {
    if (this.mode === "cloud") { try { const d = await this.db.doc("data/users/" + this.uid + "/_meta").get(); return d.exists; } catch (e) { return true; } }
    try { return localStorage.getItem("forge-heros-seeded") === "1"; } catch (e) { return false; }
  },
  async markSeeded() {
    if (this.mode === "cloud") { try { await this.db.doc("data/users/" + this.uid + "/_meta").set({ seeded: true }); } catch (e) { } return; }
    try { localStorage.setItem("forge-heros-seeded", "1"); } catch (e) { }
  },
  async all() {
    if (this.mode === "cloud") {
      try { const snap = await this.col().get(); return snap.docs.map((d) => d.data()).filter((d) => d && d.b); }
      catch (e) { this.mode = "local"; }
    }
    try { const raw = localStorage.getItem("forge-heros"); return raw ? JSON.parse(raw) : []; } catch (e) { return Object.values(this.mem); }
  },
  async put(ch) {
    ch.updated = Date.now();
    if (typeof cloudPut === "function") cloudPut(ch);
    if (typeof pushMember === "function") pushMember(ch);
    if (this.mode === "cloud") {
      try { await this.col().doc(ch.id).set(clone(ch)); return true; }
      catch (e) {
        if (e && (e.code === "unavailable" || e.code === "resource_exhausted")) { toast("Can’t save right now. Will retry on the next change."); return false; }
        // Lecteur sans droit d’écriture (lien partagé) : on garde les personnages dans ce navigateur.
        this.mode = "local";
      }
    }
    this.mem[ch.id] = ch;
    try { const list = (JSON.parse(localStorage.getItem("forge-heros") || "[]")).filter((c) => c.id !== ch.id); list.push(ch); localStorage.setItem("forge-heros", JSON.stringify(list)); } catch (e) { }
    return true;
  },
  async del(id) {
    if (typeof cloudDel === "function") cloudDel(id);
    if (this.mode === "cloud") { try { await this.col().doc(id).delete(); } catch (e) { } return; }
    delete this.mem[id];
    try { localStorage.setItem("forge-heros", JSON.stringify((JSON.parse(localStorage.getItem("forge-heros") || "[]")).filter((c) => c.id !== id))); } catch (e) { }
  },
};
