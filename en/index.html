/* Forge des Héros — comptes et synchronisation des personnages entre appareils */

const Account = { status: "", unsub: null, busy: false, errCode: null, retry: null };
function syncFailed(e) {
  Account.status = "err"; Account.errCode = (e && e.code) || "unknown";
  clearTimeout(Account.retry);
  Account.retry = setTimeout(() => { if (Account.user()) syncAccount(); }, 20000);
}
window.addEventListener("online", () => { if (Account.user() && Account.status === "err") syncAccount(); });
Account.user = () => (FB.ok && FB.auth && FB.auth.currentUser && !FB.auth.currentUser.isAnonymous ? FB.auth.currentUser : null);

function userChars() { return FB.db.collection("users").doc(FB.uid).collection("chars"); }
function cloudDoc(ch) { return { id: ch.id, b: clone(ch.b), p: clone(ch.p), adv: ch.adv || null, advName: ch.advName || null, updated: ch.updated || Date.now() }; }
function localSaveAll() {
  try { localStorage.setItem("forge-heros", JSON.stringify(S.chars)); } catch (e) { }
  Store.mem = {}; S.chars.forEach((c) => (Store.mem[c.id] = c));
}

/* Appelés par Store.put et Store.del */
const cloudTimers = {};
function cloudPut(ch) {
  const u = Account.user();
  if (!u) return;
  ch.synced = true; ch.owner = u.uid;
  clearTimeout(cloudTimers[ch.id]);
  cloudTimers[ch.id] = setTimeout(() => {
    userChars().doc(ch.id).set(cloudDoc(ch)).then(() => { if (Account.status !== "ok") { Account.status = "ok"; liveRender(); } })
      .catch((e) => { syncFailed(e); liveRender(); });
  }, 600);
}
function cloudDel(id) { if (Account.user()) userChars().doc(id).delete().catch(() => { }); }

/* Fusion initiale : le plus récent l’emporte ; un personnage déjà synchronisé mais absent du compte a été supprimé ailleurs */
async function syncAccount() {
  const u = Account.user();
  if (!u) return;
  Account.status = "sync"; render();
  try {
    const snap = await userChars().get();
    const remote = {};
    snap.docs.forEach((d) => (remote[d.id] = d.data()));
    const uploads = [];
    // le personnage d’exemple de cet appareil n’est pas recopié dans un compte qui a déjà des personnages
    if (snap.docs.length) S.chars = S.chars.filter((ch) => !(ch.example && !remote[ch.id]));
    S.chars = S.chars.filter((ch) => {
      const r = remote[ch.id];
      if (!r) { if (ch.synced && ch.owner === u.uid) return false; uploads.push(ch); return true; }
      if ((r.updated || 0) > (ch.updated || 0)) Object.assign(ch, { b: migrate(r.b), p: r.p, adv: r.adv || null, advName: r.advName || null, updated: r.updated });
      else if ((ch.updated || 0) > (r.updated || 0)) uploads.push(ch);
      ch.synced = true; ch.owner = u.uid;
      return true;
    });
    Object.values(remote).forEach((r) => { if (!S.chars.some((c) => c.id === r.id)) S.chars.push({ id: r.id, b: migrate(r.b), p: r.p, adv: r.adv || null, advName: r.advName || null, updated: r.updated, synced: true, owner: u.uid }); });
    await Promise.all(uploads.map((ch) => { ch.synced = true; ch.owner = u.uid; return userChars().doc(ch.id).set(cloudDoc(ch)); }));
    localSaveAll();
    // aventures dont ce compte est le MJ
    try {
      const q = await FB.db.collection("adventures").where("gm", "==", u.uid).get();
      q.docs.forEach((d) => { if (!GmList.get().some((x) => x.code === d.id)) GmList.add(d.id, d.data().name); });
    } catch (e) { }
    S.chars.filter((c) => c.adv).forEach((c) => pushMember(c));
    watchAccount();
    Account.status = "ok"; Account.errCode = null;
  } catch (e) { syncFailed(e); }
  render();
}

/* Écoute en direct : les modifications faites sur un autre appareil arrivent ici */
function watchAccount() {
  if (Account.unsub) Account.unsub();
  Account.unsub = userChars().onSnapshot((q) => {
    let changed = false;
    q.docChanges().forEach((chg) => {
      const r = chg.doc.data(), i = S.chars.findIndex((c) => c.id === chg.doc.id);
      if (chg.type === "removed") {
        if (i >= 0) { S.chars.splice(i, 1); changed = true; if (S.cur === chg.doc.id && S.view === "sheet") S.view = "home"; }
        return;
      }
      if (i < 0) { S.chars.push({ id: r.id, b: migrate(r.b), p: r.p, adv: r.adv || null, advName: r.advName || null, updated: r.updated, synced: true, owner: FB.uid }); changed = true; }
      else if ((r.updated || 0) > (S.chars[i].updated || 0)) { Object.assign(S.chars[i], { b: migrate(r.b), p: r.p, adv: r.adv || null, advName: r.advName || null, updated: r.updated }); changed = true; }
    });
    if (changed) { localSaveAll(); liveRender(); }
  }, () => { });
}

/* Passage vers un compte existant : le compte anonyme de cet appareil change d’identifiant.
   On retire ses fiches des aventures et on prépare le transfert des aventures dont il est MJ. */
async function switchAccount(signIn) {
  const oldUid = FB.uid;
  await Promise.all(S.chars.filter((c) => c.adv).map((c) => FB.members(c.adv).doc(oldUid + "_" + c.id).delete().catch(() => { })));
  const claims = {};
  for (const g of GmList.get()) {
    const t = uid() + uid() + uid();
    try { const d = await FB.adv(g.code).get(); if (d.exists && d.data().gm === oldUid) { await FB.adv(g.code).update({ claim: t }); claims[g.code] = t; } } catch (e) { }
  }
  await signIn();
  for (const [code, t] of Object.entries(claims)) {
    try { await FB.adv(code).update({ gm: FB.uid, claimProof: t, claim: firebase.firestore.FieldValue.delete() }); } catch (e) { }
  }
}

const AUTH_ERR = {
  "auth/invalid-email": "Invalid email address.",
  "auth/missing-password": "Enter a password.",
  "auth/weak-password": "Password too short: at least 6 characters.",
  "auth/email-already-in-use": "An account already exists with this address. Use “Sign in”.",
  "auth/credential-already-in-use": "This account is already in use.",
  "auth/invalid-credential": "Incorrect email or password.",
  "auth/wrong-password": "Incorrect email or password.",
  "auth/user-not-found": "No account with this address. Use “Create an account”.",
  "auth/too-many-requests": "Too many attempts. Try again in a few minutes.",
  "auth/popup-closed-by-user": "Sign-in window closed before finishing.",
  "auth/popup-blocked": "The sign-in window was blocked. Allow pop-ups or use email.",
  "auth/operation-not-supported-in-this-environment": "Google sign-in doesn’t work in this mode. Use email and password.",
  "auth/operation-not-allowed": "This sign-in method isn’t enabled in Firebase (Authentication › Sign-in method).",
  "auth/unauthorized-domain": "This site isn’t authorized in Firebase (Authentication › Settings › Authorized domains).",
  "auth/network-request-failed": "No internet connection.",
};
const authMsg = (e) => AUTH_ERR[e && e.code] || "Can’t sign in" + (e && e.code ? " (" + e.code + ")" : "") + ".";

async function afterLogin(kind) {
  S.modal = null; S.acc = { mode: "in" };
  toast(kind === "new" ? "Account created. Your characters are synced." : "Signed in. Syncing your characters…");
  await syncAccount();
}

async function accAct(a, d) {
  if (typeof settingsAct === "function" && (await settingsAct(a, d))) return true;
  switch (a) {
    case "accOpen": S.view = "account"; S.acc = { mode: "in" }; window.scrollTo(0, 0); return true;
    case "accMode": S.acc = { mode: d.v }; return true;
    case "accGoogle": {
      if (Account.busy) return true;
      Account.busy = true;
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const cur = FB.auth.currentUser;
        try {
          if (cur && cur.isAnonymous) await cur.linkWithPopup(provider);
          else await FB.auth.signInWithPopup(provider);
        } catch (e) {
          if (e.code === "auth/credential-already-in-use" && e.credential) await switchAccount(() => FB.auth.signInWithCredential(e.credential));
          else throw e;
        }
        await afterLogin();
      } catch (e) { S.acc = { mode: "in", err: authMsg(e) }; }
      Account.busy = false;
      return true;
    }
    case "accEmail": {
      if (Account.busy) return true;
      const email = ($("#accEmail").value || "").trim(), pw = $("#accPw").value || "", mode = (S.acc && S.acc.mode) || "in";
      if (!email || !pw) { S.acc = { mode, err: "Enter your email and password.", email }; return true; }
      Account.busy = true;
      try {
        const cur = FB.auth.currentUser;
        if (mode === "new") {
          const cred = firebase.auth.EmailAuthProvider.credential(email, pw);
          if (cur && cur.isAnonymous) await cur.linkWithCredential(cred);
          else await FB.auth.createUserWithEmailAndPassword(email, pw);
          await afterLogin("new");
        } else {
          if (cur && cur.isAnonymous) await switchAccount(() => FB.auth.signInWithEmailAndPassword(email, pw));
          else await FB.auth.signInWithEmailAndPassword(email, pw);
          await afterLogin();
        }
      } catch (e) { S.acc = { mode, err: authMsg(e), email }; }
      Account.busy = false;
      return true;
    }
    case "accReset": {
      const email = ($("#accEmail").value || "").trim();
      if (!email) { S.acc = { mode: "in", err: "Enter your email address first." }; return true; }
      try { await FB.auth.sendPasswordResetEmail(email); S.acc = { mode: "in", info: "Email sent to " + email + ". Follow the link to choose a new password.", email }; }
      catch (e) { S.acc = { mode: "in", err: authMsg(e), email }; }
      return true;
    }
    case "accRetry": S.modal = null; await syncAccount(); toast(Account.status === "ok" ? "Synced" : "Failure: " + (Account.errCode || "unknown")); return true;
    case "accOutDo": {
      if (Account.unsub) { Account.unsub(); Account.unsub = null; }
      Live.stop();
      // Les personnages du compte quittent cet appareil ; ceux créés hors connexion restent.
      S.chars = S.chars.filter((c) => !c.synced);
      localSaveAll();
      try { localStorage.removeItem("forge-gm"); } catch (e) { }
      await FB.auth.signOut();
      try { await FB.auth.signInAnonymously(); } catch (e) { }
      Account.status = ""; S.modal = null; S.acc = { mode: "in" };
      toast("Signed out. Your characters stay in your account.");
      return true;
    }
  }
  return false;
}

/* Forge des Héros — page Compte et réglages : thème, langue, support, version */

const APP_VERSION = "1.7.1";

/* ---------- Thème ---------- */
const Theme = {
  get() { try { return localStorage.getItem("forge-theme") || "dark"; } catch (e) { return "dark"; } },
  set(v) { try { localStorage.setItem("forge-theme", v); } catch (e) { } this.apply(); },
  resolved() {
    const v = this.get();
    if (v !== "system") return v;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  },
  apply() {
    const r = this.resolved();
    document.documentElement.setAttribute("data-forge-theme", r);
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", r === "light" ? "#f2ebdf" : "#15110e");
  },
};
Theme.apply();
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: light)");
  const onChange = () => { if (Theme.get() === "system") Theme.apply(); };
  if (mq.addEventListener) mq.addEventListener("change", onChange); else if (mq.addListener) mq.addListener(onChange);
}

/* ---------- Page Compte et réglages ---------- */
function syncLabel() {
  if (Account.status === "sync") return "Syncing…";
  if (Account.status === "err") return Account.errCode === "permission-denied" ? "Access denied by Firebase" : Account.errCode === "unavailable" ? "Offline, retrying automatically" : "Sync failed";
  return "Synced";
}

  const u = Account.user();

    ${Account.status === "err" ? `<div class="sync-err"><b>Sync failed</b> (code : ${esc(Account.errCode || "unknown")}).<br>${Account.errCode === "permission-denied" ? "Firebase denies access: the Firestore security rules are out of date." : "The app retries automatically every 20 seconds."}</div><div class="row-btns"><button class="btn small" data-a="accRetry">Retry now</button></div>` : ""}
    ${S.acc && S.acc.confirmOut ? `<div class="confirm-box"><p>When you sign out, your characters disappear from this device. They stay in your account and come back the next time you sign in.</p><div class="row-btns"><button class="btn dmgb" data-a="accOutDo">Sign out</button><button class="btn ghost" data-a="accOutCancel">Cancel</button></div></div>`

}

/* ---------- Support ---------- */
function feedbackModal(m) {
  if (m.k !== "feedback") return null;
  if (m.sent) return `<h3>Thank you!</h3><p>${m.type === "bug" ? "Your report was sent. It will be looked at quickly." : "Your idea was sent. Thanks for helping the Forge!"}</p><div class="row-btns"><button class="btn primary" data-a="closeModal">Close</button></div>`;
  const bug = m.type === "bug";
  const u = typeof Account !== "undefined" && FB.ok ? Account.user() : null;
  return `<h3>${bug ? "Report a problem" : "Suggest an improvement"}</h3>
    <div class="chips">${chip("Problem", bug, "fbType", 'data-v="bug"')}${chip("Improvement", !bug, "fbType", 'data-v="idea"')}</div>
    <label class="field fb-msg"><span>${bug ? "What happened?" : "Your idea"}</span><textarea id="fbMsg" rows="6" maxlength="4000" placeholder="${bug ? "What you were doing, what happened, what you expected…" : "Describe what would help you…"}">${esc(m.msg || "")}</textarea></label>
    <label class="field"><span>Email for a reply (optional)</span><input id="fbEmail" type="email" value="${esc(m.email != null ? m.email : (u && u.email) || "")}" placeholder="you@example.com"></label>

    <div class="row-btns"><button class="btn primary" data-a="fbSend">Send</button><button class="btn ghost" data-a="closeModal">Cancel</button></div>`;
}

async function settingsAct(a, d) {
  switch (a) {
    case "openSettings": S.view = "account"; S.acc = { mode: "in" }; S.modal = null; window.scrollTo(0, 0); return true;
    case "setTheme": Theme.set(d.v); return true;
    case "langSoon": toast(d.v === "en" ? "English is available in the installed app." : "This language is coming soon."); return false;
    case "setLang": {
      if (d.v === LANG) return false;
      try { localStorage.setItem("forge-lang", d.v); } catch (e) { }
      location.href = LANG === "fr" ? "en/" : "../";
      return false;
    }
    case "noop": return false;
    case "accOutAsk": S.acc = Object.assign({}, S.acc, { confirmOut: true }); return true;
    case "accOutCancel": S.acc = { mode: "in" }; return true;
    case "fbOpen": S.modal = { k: "feedback", type: d.v }; return true;
    case "fbType": { const msg = ($("#fbMsg") || {}).value, email = ($("#fbEmail") || {}).value; S.modal = { k: "feedback", type: d.v, msg, email }; return true; }
    case "fbSend": {
      const msg = ($("#fbMsg").value || "").trim(), email = ($("#fbEmail").value || "").trim(), type = S.modal.type;
      if (msg.length < 5) { S.modal = Object.assign({}, S.modal, { msg, email, err: "Please describe it in a few words." }); return true; }
      if (!FB.ok) { S.modal = Object.assign({}, S.modal, { msg, email, err: "Sending only works in the installed app, connected to the internet." }); return true; }
      const tech = $("#fbTech") ? $("#fbTech").checked : false;
      const ch = curChar();
      const doc = { type, message: msg, email: email || null, uid: FB.uid, version: APP_VERSION, created: Date.now(),
        device: tech ? { ua: navigator.userAgent.slice(0, 300), screen: window.innerWidth + "x" + window.innerHeight, theme: Theme.resolved(), standalone: !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) } : null,
        context: tech ? { view: S.view, tab: S.tab, cls: ch ? ch.b.cls : null, level: ch ? ch.b.level : null } : null };
      try { await FB.db.collection("feedback").add(doc); S.modal = { k: "feedback", type, sent: true }; }
      catch (e) { S.modal = Object.assign({}, S.modal, { msg, email, err: "Couldn’t send (" + ((e && e.code) || "error") + "). Check your connection." }); }
      return true;
    }
  }
  return false;
}

    document.body.appendChild(el);
  });
  window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").then((r) => r.update()).catch(() => {}));
}
