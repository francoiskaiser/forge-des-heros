      <button class="opt ${b.sChoice === k ? "on" : ""}" data-a="setSChoice" data-v="${k}"><b>${o.n}</b><span>${o.d || "Damage type: " + DMG[o.t]}</span></button>`).join("")}</div>` : "";
    const size = sp.sizeChoice ? `<h4>Size</h4><div class="chips">${[K("Moyenne"), K("Petite")].map((z) => chip(SIZE_L[z], b.size === z, "setSize", `data-v="${z}"`)).join("")}</div>` : "";
    const sab = sp.spellAb ? `<h4>Spellcasting ability for species spells</h4><div class="chips">${["int", "sag", "cha"].map((a) => chip(ABIL[a].n, b.sSpellAb === a, "setSAb", `data-v="${a}"`)).join("")}</div>` : "";
    spDetail = `<section class="panel detail"><h3>${sp.n}</h3><p class="mute">${sp.desc}</p>
      <div class="feats">${sp.traits.map((t) => `<details class="feat" open><summary>${t.n}</summary><p>${t.d}</p></details>`).join("")}</div>${choice}${size}${sab}</section>`;
  }
  return `<section class="block"><h3 class="bh">Background</h3><p class="mute small">Your past determines three abilities to increase, an Origin feat, and two skills.</p><div class="pick-grid two">${bgs}</div></section>
  <section class="block"><h3 class="bh">Species</h3><div class="pick-grid">${sps}</div></section>${spDetail}`;
}

function stepAbilities(b) {
  const bg = BACKGROUNDS[b.bg], ab = abilities(b);
  const methods = [["standard", "Standard array"], ["points", "Point buy"], ["roll", "Roll 4d6"]].map(([k, n]) => chip(n, b.method === k, "setMethod", `data-v="${k}"`)).join("");
  let pool = null;
  if (b.method === "standard") pool = STD_ARRAY;
  if (b.method === "roll" && b.rolled) pool = b.rolled;
  const spent = ABK.reduce((t, k) => t + (PB_COST[b.base[k]] ?? 0), 0);
  const rows = ABK.map((k) => {
    let ctrl;
    if (b.method === "points") ctrl = `<div class="stepper"><button class="mini" data-a="pb" data-k="${k}" data-d="-1" ${b.base[k] <= 8 ? "disabled" : ""} aria-label="Decrease">−</button><b>${b.base[k]}</b><button class="mini" data-a="pb" data-k="${k}" data-d="1" ${b.base[k] >= 15 || spent + (PB_COST[b.base[k] + 1] - PB_COST[b.base[k]]) > 27 ? "disabled" : ""} aria-label="Increase">+</button></div>`;
    else if (pool) ctrl = `<select id="base-${k}" data-swap="${k}" aria-label="Score for ${ABIL[k].n}">${pool.map((v, i) => `<option value="${v}" ${b.base[k] === v ? "selected" : ""}>${v}</option>`).join("")}</select>`;
    else ctrl = `<b class="mute">—</b>`;
    let bonus = 0;
    if (bg) { if (b.bonus.mode === "21") bonus = (b.bonus.p2 === k ? 2 : 0) + (b.bonus.p1 === k && b.bonus.p1 !== b.bonus.p2 ? 1 : 0); else bonus = bg.ab.includes(k) ? 1 : 0; }
    const asi = ab[k] - Math.min(20, (b.base[k] || 8) + bonus);
    const pri = CLASSES[b.cls] && CLASSES[b.cls].prim.includes(k);
    return `<div class="ab-row ${pri ? "pri" : ""}"><span class="ab-name">${ABIL[k].n}${pri ? "<span class=\"tagp\">primary</span>" : ""}</span>${ctrl}<span class="ab-bonus">${bonus ? "+" + bonus : "·"}</span>${b.level >= 4 ? `<span class="ab-bonus">${asi > 0 ? "+" + asi : "·"}</span>` : ""}<span class="ab-total">${ab[k]}</span><span class="ab-mod">${sg(mod(ab[k]))}</span></div>`;
  }).join("");
  const bonusUi = bg ? `<section class="panel"><h4>Background bonuses (${bg.n})</h4>
    <div class="chips">${chip("+2 and +1", b.bonus.mode === "21", "setBonusMode", 'data-v="21"')}${chip("+1 to three", b.bonus.mode === "111", "setBonusMode", 'data-v="111"')}</div>
    ${b.bonus.mode === "21" ? `<div class="bonus-pick"><span>+2</span><div class="chips">${bg.ab.map((a) => chip(ABIL[a].n, b.bonus.p2 === a, "setP2", `data-v="${a}"`)).join("")}</div></div>
    <div class="bonus-pick"><span>+1</span><div class="chips">${bg.ab.filter((a) => a !== b.bonus.p2).map((a) => chip(ABIL[a].n, b.bonus.p1 === a, "setP1", `data-v="${a}"`)).join("")}</div></div>` : `<p class="mute small">+1 to ${bg.ab.map((a) => ABIL[a].n).join(", ")}.</p>`}
  </section>` : `<p class="todo">Choose a background in the Origin step to assign its bonuses.</p>`;
  const asiUi = activeAsiLevels(b).map((lv) => {
    const a = asiAt(b, lv), dl = `data-lv="${lv}"`;
    return `<section class="panel"><h4>Ability Score Improvement (level ${lv})</h4>
    <div class="chips">${chip("+2 to one", a.mode === "2", "setAsiMode", 'data-v="2" ' + dl)}${chip("+1 to two", a.mode === "11", "setAsiMode", 'data-v="11" ' + dl)}</div>
    <div class="bonus-pick"><span>${a.mode === "2" ? "+2" : "+1"}</span><div class="chips">${ABK.map((x) => chip(ABIL[x].s, a.a === x, "setAsiA", `data-v="${x}" ${dl}`)).join("")}</div></div>
    ${a.mode === "11" ? `<div class="bonus-pick"><span>+1</span><div class="chips">${ABK.filter((x) => x !== a.a).map((x) => chip(ABIL[x].s, a.b === x, "setAsiB", `data-v="${x}" ${dl}`)).join("")}</div></div>` : ""}
  </section>`;
  }).join("") + (b.level >= 19 ? `<section class="panel"><h4>Epic Boon (level 19)</h4><p class="mute small">An Epic Boon feat and +1 to one ability score, up to 30.</p>
    <div class="opt-grid">${Object.entries(EPIC_BOONS).map(([k, x]) => `<button class="opt ${b.opts.boon.id === k ? "on" : ""}" data-a="boon" data-v="${k}"><b>${x.n}</b><span>${x.d}</span></button>`).join("")}</div>
    <div class="bonus-pick"><span>+1</span><div class="chips">${ABK.map((x) => chip(ABIL[x].s, b.opts.boon.a === x, "boonAb", `data-v="${x}"`)).join("")}</div></div></section>` : "") + (b.level >= 20 && (b.cls === "barbare" || b.cls === "moine") ? `<p class="mute small">Level 20: ${b.cls === "barbare" ? "Strength and Constitution" : "Dexterity and Wisdom"} +4 (max 25), already included.</p>` : "");
  return `<section class="block"><div class="chips">${methods}</div>
    <p class="mute small">${b.method === "standard" ? "Assign 15, 14, 13, 12, 10, and 8. Choosing a value swaps it with the ability that had it." : b.method === "points" ? `27 points to spend, scores from 8 to 15. <b class="${spent > 27 ? "bad" : ""}">${27 - spent} points left.</b>` : "Roll 4d6 six times and keep the three highest dice each time."}</p>
    <div class="row-btns">${b.method === "roll" ? `<button class="btn" data-a="rollStats">${ICON.d20} ${b.rolled ? "Reroll" : "Thrown"} the dice</button>` : ""}${b.cls && b.method !== "points" ? `<button class="btn ghost" data-a="recommend">Recommended spread for ${CLASSES[b.cls].n}</button>` : ""}</div>
  </section>
  <section class="panel abil-table"><div class="ab-row head"><span>Ability</span><span>Base</span><span>Bkg.</span>${b.level >= 4 ? "<span>Levels</span>" : ""}<span>Total</span><span>Mod.</span></div>${rows}</section>
  ${bonusUi}${asiUi}`;
}

function skillChips(b, pool, selected, max, act, lockSet) {
  return `<div class="chips">${pool.map((k) => {
    const locked = lockSet && lockSet.has(k) && !selected.includes(k);
    const on = selected.includes(k);
    const full = !on && selected.length >= max;
    return `<button class="chip ${on ? "on" : ""} ${locked ? "lock" : ""}" data-a="${act}" data-v="${k}" ${locked || full ? 'aria-disabled="true"' : ""} aria-pressed="${on}" title="${locked ? "Already proficient" : ""}">${SKILLS[k].n}<small>${ABIL[SKILLS[k].a].s}</small></button>`;
  }).join("")}</div>`;
}

function magicPicker(b, src) {
  const m = b.magic[src], cls = MI_LIST[m.list];
  const cants = Object.keys(SPELLS).filter((id) => SPELLS[id].l === 0 && SPELLS[id].cl.includes(cls)).sort((x, y) => SPELLS[x].n.localeCompare(SPELLS[y].n, "fr"));
  const l1 = Object.keys(SPELLS).filter((id) => SPELLS[id].l === 1 && SPELLS[id].cl.includes(cls)).sort((x, y) => SPELLS[x].n.localeCompare(SPELLS[y].n, "fr"));
  return `<div class="subpanel"><h4>Magic Initiate ${src === "bg" ? "(background)" : "(Human feat)"}</h4>
    ${src === "human" ? `<div class="chips">${Object.entries(MI_NAME).map(([k, n]) => chip("List " + n, m.list === k, "miList", `data-src="${src}" data-v="${k}"`)).join("")}</div>` : `<p class="mute small">Spell list: ${MI_NAME[m.list]}</p>`}
    <div class="bonus-pick"><span>Ability.</span><div class="chips">${["int", "sag", "cha"].map((a) => chip(ABIL[a].n, m.ab === a, "miAb", `data-src="${src}" data-v="${a}"`)).join("")}</div></div>
    <p class="lbl">Two cantrips (${m.cant.length}/2)</p>
    <div class="chips">${cants.map((id) => chip(SPELLS[id].n, m.cant.includes(id), "miCant", `data-src="${src}" data-v="${id}"`, !m.cant.includes(id) && m.cant.length >= 2 ? 'aria-disabled="true"' : "")).join("")}</div>
    <p class="lbl">One level 1 spell</p>
    <div class="chips">${l1.map((id) => chip(SPELLS[id].n, m.spell === id, "miSpell", `data-src="${src}" data-v="${id}"`)).join("")}</div></div>`;
}

function stepOptions(b) {
  const c = CLASSES[b.cls], sp = SPECIES[b.species], bg = BACKGROUNDS[b.bg];
  if (!c) return `<p class="todo">Choose a class first.</p>`;
  const bgSkills = new Set(bg ? bg.skills : []);
  const fromOthers = (exclude) => { const s = profSkills(b); exclude.forEach((k) => s.delete(k)); return s; };
  const out = [];
  out.push(`<section class="panel"><h4>Skills for ${c.n} — ${b.skillsClass.length}/${c.skills.n}</h4>
    ${bg ? `<p class="mute small">Already granted by your background: ${bg.skills.map((k) => SKILLS[k].n).join(", ")}.</p>` : ""}
    ${skillChips(b, classSkillPool(b), b.skillsClass, c.skills.n, "skClass", fromOthers(b.skillsClass))}</section>`);
  if (sp && sp.skillPick) out.push(`<section class="panel"><h4>Species skill (${sp.n})</h4>${skillChips(b, sp.skillPick.from === "all" ? SKK : sp.skillPick.from, b.skillsSpecies, sp.skillPick.n, "skSpecies", fromOthers(b.skillsSpecies))}</section>`);
  if (sp && sp.bonusFeat) out.push(`<section class="panel"><h4>Origin feat (Human)</h4><div class="opt-grid">${Object.entries(FEATS).map(([k, f]) => `<button class="opt ${b.humanFeat === k ? "on" : ""}" data-a="humanFeat" data-v="${k}"><b>${f.n}</b><span>${f.d}</span></button>`).join("")}</div></section>`);
  featsOf(b).forEach((f) => {
    if (f.id === "doue") out.push(`<section class="panel"><h4>Skilled feat — ${b.skilled.length}/3</h4>${skillChips(b, SKK, b.skilled, 3, "skSkilled", fromOthers(b.skilled))}</section>`);
    if (f.id === "initie") out.push(`<section class="panel">${magicPicker(b, f.src)}</section>`);
  });
  if (b.cls === "barde" && b.level >= 3) out.push(`<section class="panel"><h4>College of Lore: three skills — ${b.skillsLore.length}/3</h4>${skillChips(b, SKK, b.skillsLore, 3, "skLore", fromOthers(b.skillsLore))}</section>`);
  if (b.cls === "barbare" && b.level >= 3) out.push(`<section class="panel"><h4>Primal Knowledge: one Barbarian skill</h4>${skillChips(b, c.skills.from, b.skillPrimal ? [b.skillPrimal] : [], 1, "skPrimal", fromOthers(b.skillPrimal ? [b.skillPrimal] : []))}</section>`);
  const ex = expertiseCount(b);
  if (ex) out.push(`<section class="panel"><h4>Expertise — ${b.expertise.length}/${ex}</h4><p class="mute small">Proficiency bonus doubled.</p><div class="chips">${expertisePool(b).map((k) => chip(SKILLS[k].n, b.expertise.includes(k), "expertise", `data-v="${k}"`, !b.expertise.includes(k) && b.expertise.length >= ex ? 'aria-disabled="true"' : "")).join("")}</div></section>`);
  if (b.cls === "clerc") out.push(`<section class="panel"><h4>Divine Order</h4><div class="opt-grid">
    <button class="opt ${b.opts.order === "protecteur" ? "on" : ""}" data-a="order" data-v="protecteur"><b>Protector</b><span>Proficiency with Martial weapons and Heavy armor.</span></button>
    <button class="opt ${b.opts.order === "thaumaturge" ? "on" : ""}" data-a="order" data-v="thaumaturge"><b>Thaumaturge</b><span>One extra cantrip and + WIS modifier to Arcana and Religion checks.</span></button></div></section>`);
  if (b.cls === "druide") out.push(`<section class="panel"><h4>Primal Order</h4><div class="opt-grid">
    <button class="opt ${b.opts.order === "magicien" ? "on" : ""}" data-a="order" data-v="magicien"><b>Wizard</b><span>One extra cantrip and + WIS modifier to Arcana and Nature checks.</span></button>
    <button class="opt ${b.opts.order === "gardien" ? "on" : ""}" data-a="order" data-v="gardien"><b>Warden</b><span>Proficiency with Martial weapons and Medium armor.</span></button></div></section>`);
  if (b.cls === "guerrier" || (["paladin", "rodeur"].includes(b.cls) && b.level >= 2))
    out.push(`<section class="panel"><h4>Fighting Style</h4><div class="opt-grid">${Object.entries(FIGHTING_STYLES).map(([k, f]) => `<button class="opt ${b.opts.style === k ? "on" : ""}" data-a="style" data-v="${k}"><b>${f.n}</b><span>${f.d}</span></button>`).join("")}</div></section>`);
  if (c.mastery) {
    const ws = Object.entries(WEAPONS).filter(([k, w]) => weaponProf(b, w) && (b.cls !== "barbare" || w.k === "cac"));
    out.push(`<section class="panel"><h4>Weapon Mastery — ${b.opts.mastery.length}/${c.mastery}</h4><p class="mute small">You can use the mastery property of these weapons. Hover a weapon to see its effect.</p>
      <div class="chips">${ws.map(([k, w]) => chip(w.n + `<small>${MASTERY[w.m].split(" — ")[0]}</small>`, b.opts.mastery.includes(k), "mastery", `data-v="${k}"`, (!b.opts.mastery.includes(k) && b.opts.mastery.length >= c.mastery ? 'aria-disabled="true"' : "") + ` title="${esc(MASTERY[w.m])}"`)).join("")}</div>
      ${b.opts.mastery.length ? `<ul class="plain small">${b.opts.mastery.map((k) => `<li><b>${WEAPONS[k].n}</b> · ${MASTERY[WEAPONS[k].m]}</li>`).join("")}</ul>` : ""}</section>`);
  }
  if (b.cls === "occultiste") {
    const n = c.inv[b.level - 1];
    out.push(`<section class="panel"><h4>Eldritch Invocations — ${b.opts.inv.length}/${n}</h4><div class="opt-grid">${Object.entries(INVOCATIONS).filter(([, v]) => v.lv <= b.level).map(([k, v]) => `<button class="opt ${b.opts.inv.includes(k) ? "on" : ""}" data-a="inv" data-v="${k}" ${!b.opts.inv.includes(k) && b.opts.inv.length >= n ? 'aria-disabled="true"' : ""}><b>${v.n}</b><span>${v.d}</span></button>`).join("")}</div></section>`);
  }
  if (b.cls === "ensorceleur" && b.level >= 2) { const mc = metaCount(b); out.push(`<section class="panel"><h4>Metamagic — ${b.opts.meta.length}/${mc}</h4><div class="opt-grid">${Object.entries(METAMAGIC).map(([k, v]) => `<button class="opt ${b.opts.meta.includes(k) ? "on" : ""}" data-a="meta" data-v="${k}" ${!b.opts.meta.includes(k) && b.opts.meta.length >= mc ? 'aria-disabled="true"' : ""}><b>${v.n}</b><span>${v.d}</span></button>`).join("")}</div></section>`); }
  if (b.cls === "ensorceleur" && b.level >= 6) out.push(`<section class="panel"><h4>Elemental Affinity: damage type</h4><p class="mute small">The one from your draconic ancestry.</p><div class="chips">${[K("acide"), K("froid"), K("feu"), K("foudre"), K("poison")].map((t) => chip(DMG[t][0].toUpperCase() + DMG[t].slice(1), b.opts.dragon === t, "dragon", `data-v="${t}"`)).join("")}</div></section>`);
  if (b.cls === "guerrier" && b.level >= 7) out.push(`<section class="panel"><h4>Second Fighting Style (Champion)</h4><div class="opt-grid">${Object.entries(FIGHTING_STYLES).filter(([k]) => k !== b.opts.style).map(([k, f]) => `<button class="opt ${b.opts.style2 === k ? "on" : ""}" data-a="style2" data-v="${k}"><b>${f.n}</b><span>${f.d}</span></button>`).join("")}</div></section>`);
  if (STRIKE_OPTS[b.cls] && b.level >= STRIKE_OPTS[b.cls].lvl) { const so = STRIKE_OPTS[b.cls]; out.push(`<section class="panel"><h4>${so.label} (level ${so.lvl})</h4><div class="opt-grid">${Object.entries(so.opts).map(([k, o]) => `<button class="opt ${b.opts.strike === k ? "on" : ""}" data-a="strike" data-v="${k}"><b>${o.n}</b><span>${o.d}</span></button>`).join("")}</div></section>`); }
  if (b.cls === "rodeur" && b.level >= 3) out.push(`<section class="panel"><h4>Hunter’s Prey</h4><div class="opt-grid">
    <button class="opt ${b.opts.prey === "colosse" ? "on" : ""}" data-a="prey" data-v="colosse"><b>Colossus Slayer</b><span>Once per turn, +1d8 damage against a wounded target.</span></button>
    <button class="opt ${b.opts.prey === "horde" ? "on" : ""}" data-a="prey" data-v="horde"><b>Horde Breaker</b><span>One extra attack against another creature near the target.</span></button></div></section>`);
  if (b.cls === "druide" && b.level >= 3) out.push(`<section class="panel"><h4>Circle of the Land: your land</h4><div class="opt-grid">${Object.entries(LAND_SPELLS).map(([k, l]) => `<button class="opt ${b.opts.land === k ? "on" : ""}" data-a="land" data-v="${k}"><b>${l.n}</b><span>${Object.values(l.s).flat().map((id) => SPELLS[id].n).join(", ")}</span></button>`).join("")}</div></section>`);
  out.push(`<section class="panel"><h4>Languages — ${b.langs.length}/2</h4><p class="mute small">You speak Common and two other languages.</p><div class="chips">${LANGS.map((l) => chip(LANG_L[l], b.langs.includes(l), "lang", `data-v="${esc(l)}"`, !b.langs.includes(l) && b.langs.length >= 2 ? 'aria-disabled="true"' : "")).join("")}</div></section>`);
  return out.join("");
}

function spellRow(id, on, act, disabled, locked, src) {
  const s = SPELLS[id];
  const open = S.openSpell === id;
  return `<div class="spell-row ${on ? "on" : ""} ${locked ? "lock" : ""}">
    <button class="sr-main" data-a="${locked ? "toggleSpell" : act}" data-v="${id}" ${disabled && !on && !locked ? 'aria-disabled="true"' : ""} aria-pressed="${on}">
      <span class="sr-check">${on || locked ? ICON.check : ""}</span>
      <span class="sr-name">${s.n}${s.co ? '<i class="tagc" title="Concentration">C</i>' : ""}${s.ri ? "<i class=\"tagc\" title=\"Ritual\">R</i>" : ""}</span>
      <span class="sr-meta">${src ? esc(src) : SC[s.e]}</span>
    </button>
    <button class="sr-info" data-a="toggleSpell" data-v="${id}" aria-label="Details" aria-expanded="${open}">${open ? "−" : "i"}</button>
    ${open ? `<div class="sr-body">${spellDetail(s)}</div>` : ""}
  </div>`;
}
function spellDetail(s) {
  return `<dl class="spell-facts"><div><dt>Spellcasting</dt><dd>${s.t}</dd></div><div><dt>Range</dt><dd>${s.p}</dd></div><div><dt>Components</dt><dd>${s.c}</dd></div><div><dt>Duration</dt><dd>${s.co ? "Concentration, " : ""}${s.du}</dd></div></dl><p>${s.d}</p>${s.up ? `<p class="mute small">Higher levels: ${s.up}</p>` : ""}`;
}

function stepSpells(b) {
  const c = CLASSES[b.cls];
  if (!c || !c.caster) return `<p class="mute">This class doesn’t cast spells.</p>`;
  const nc = cantripCount(b), np = prepCount(b), max = maxSpellLevel(b);
  const granted = grantedSpells(b);
  const gIds = new Set(granted.map((g) => g.id));
  let html = "";
  if (granted.length) html += `<section class="panel"><h4>Always prepared</h4><p class="mute small">These spells don’t count against your prepared spells.</p>${granted.map((g) => spellRow(g.id, true, "", false, true, g.src + (SPELLS[g.id].l ? " · lvl. " + SPELLS[g.id].l : " · cantrip"))).join("")}</section>`;
  if (nc) html += `<section class="panel"><h4>Cantrips — ${b.cant.length}/${nc}</h4>${classSpellPool(b, 0).filter((id) => !gIds.has(id)).map((id) => spellRow(id, b.cant.includes(id), "pickCant", b.cant.length >= nc)).join("")}</section>`;
  const lvTabs = ["all", ...Array.from({ length: max }, (_, i) => i + 1)].map((l) => chip(l === "all" ? "All" : "Level " + l, S.spellLvl == l, "spellLvl", `data-v="${l}"`)).join("");
  const pool = [];
  for (let l = 1; l <= max; l++) if (S.spellLvl === "all" || S.spellLvl == l) pool.push(`<p class="lvl-sep">Level ${l}</p>` + classSpellPool(b, l).filter((id) => !gIds.has(id)).map((id) => spellRow(id, b.prep.includes(id), "pickPrep", b.prep.length >= np)).join(""));
  if (b.cls === "barde" && b.level >= 6) {
    const lp = []; for (let l = 0; l <= max; l++) lp.push(...Object.keys(SPELLS).filter((id) => SPELLS[id].l === l && !SPELLS[id].cl.includes("barde") && SPELLS[id].cl.some((x) => ["clerc", "druide", "magicien"].includes(x)) && !gIds.has(id) || b.opts.lore2.includes(id) && SPELLS[id].l === l));
    const uniq = [...new Set(lp)].sort((x, y) => SPELLS[x].l - SPELLS[y].l || SPELLS[x].n.localeCompare(SPELLS[y].n, "fr"));
    html += `<section class="panel"><h4>Magical Discoveries — ${b.opts.lore2.length}/2</h4><p class="mute small">Two Cleric, Druid, or Wizard spells, always prepared.</p>${uniq.map((id) => spellRow(id, b.opts.lore2.includes(id), "lore2", b.opts.lore2.length >= 2, false, SPELLS[id].l ? "lvl. " + SPELLS[id].l : "cantrip")).join("")}</section>`;
  }
  if (b.cls === "occultiste") Object.entries(ARCANUM_LV).forEach(([sl, lv]) => {
    if (b.level < lv) return;
    html += `<section class="panel"><h4>Mystic Arcanum — level ${sl}</h4><p class="mute small">Once per Long Rest, without a spell slot.</p>${Object.keys(SPELLS).filter((id) => SPELLS[id].l === +sl && SPELLS[id].cl.includes("occultiste")).map((id) => spellRow(id, b.opts.arcanum[sl] === id, "arcanum\" data-lv=\"" + sl, false)).join("")}</section>`;
  });
  html += `<section class="panel"><h4>Prepared spells — ${b.prep.length}/${np}</h4><p class="mute small">${b.cls === "magicien" ? "Your spellbook holds these spells; you change them on a Long Rest." : b.cls === "barde" && b.level >= 10 ? "Magical Secrets: the Cleric, Druid, and Wizard spell lists are open to you." : c.caster === "pact" ? "Your Pact Magic slots return after a Short Rest." : "You can change your prepared spells after a Long Rest."}</p><div class="chips">${lvTabs}</div>${pool.join("")}</section>`;
  return html;
}

function gearList(list) {
  return `<ul class="gear">${list.map(([ref, q]) => {
    const n = ref.startsWith("w:") ? WEAPONS[ref.slice(2)].n : ref.startsWith("a:") ? ARMORS[ref.slice(2)].n : GEAR[ref];
    return `<li>${q && q > 1 ? `<b>${q}×</b> ` : ""}${n}</li>`;
  }).join("")}</ul>`;
}
function stepEquip(b) {
  const c = CLASSES[b.cls], bg = BACKGROUNDS[b.bg];
  if (!c || !bg) return `<p class="todo">Choose a class and a background.</p>`;
  const clsOpts = [["A", "Class equipment", gearList(c.gearA) + `<p class="gold">+ ${c.goldA} gp</p>`]];
  if (c.gearB) clsOpts.push(["B", "Alternative equipment", gearList(c.gearB) + `<p class="gold">+ ${c.goldBg} gp</p>`]);
  clsOpts.push([c.gearB ? "C" : "B", "Gold only", `<p class="gold big">${c.goldB} gp</p><p class="mute small">Buy your equipment yourself.</p>`]);
  const st = startingInventory(b);
  return `<section class="block"><h3 class="bh">${c.n}</h3><div class="opt-grid">${clsOpts.map(([k, n, h]) => `<button class="opt tall ${b.gear.cls === k ? "on" : ""}" data-a="gearCls" data-v="${k}"><b>${n}</b>${h}</button>`).join("")}</div></section>
  <section class="block"><h3 class="bh">${bg.n}</h3><div class="opt-grid">
    <button class="opt tall ${b.gear.bg === "A" ? "on" : ""}" data-a="gearBg" data-v="A"><b>Background equipment</b>${gearList(bg.gear)}<p class="gold">+ ${bg.gold} gp</p></button>
    <button class="opt tall ${b.gear.bg === "B" ? "on" : ""}" data-a="gearBg" data-v="B"><b>Gold only</b><p class="gold big">50 gp</p></button></div></section>
  <section class="panel"><h4>Your starting pack</h4><p class="mute small">${st.inv.length} items · ${st.gold} gp. Weapons and your best proficient armor are equipped automatically.</p></section>`;
}

function stepDetails(b) {
  const d = b.details;
  const field = (k, label, ph, area) => `<label class="field"><span>${label}</span>${area ? `<textarea id="d-${k}" data-f="details.${k}" rows="3" placeholder="${ph}">${esc(d[k])}</textarea>` : `<input id="d-${k}" data-f="details.${k}" value="${esc(d[k])}" placeholder="${ph}">`}</label>`;
  return `<section class="panel"><label class="field big"><span>Character name</span><input id="d-name" data-f="name" value="${esc(b.name)}" placeholder="E.g. Aldric Ironbreaker" autocomplete="off"></label>
    <div class="field"><span>Alignment</span><div class="align-grid">${ALIGN.map((a) => chip(ALIGN_L[a], b.align === a, "align", `data-v="${a}"`)).join("")}</div></div>
    <div class="two-col">${field("age", "Age", "E.g. 27 years")}${field("taille", "Height and weight", "E.g. 5'11\", 165 lb")}</div>
    ${["clerc", "paladin"].includes(b.cls) ? `<div class="deity-hint">${b.cls === "clerc" ? "A cleric draws power from a deity or a sacred force: choose it with your GM." : "A paladin is bound by an oath, often sworn before a deity: name it if so."}</div>` : ""}
    ${field("divinite", "Deity or faith", "Name of the god, pantheon, or force you serve (optional)")}
    ${field("apparence", "Appearance", "Hair, eyes, distinguishing marks…", true)}
    ${field("personnalite", "Personality traits", "How do you behave?", true)}
    <div class="two-col">${field("ideaux", "Ideals", "What you believe in", true)}${field("liens", "Bonds", "What ties you to the world", true)}</div>
    ${field("defauts", "Flaws", "Your weaknesses", true)}
    ${field("histoire", "History", "Where do you come from?", true)}
  </section>`;
}

/* ---------------- Fiche ---------------- */
function viewSheet() {
  const ch = curChar();
  if (!ch) return "";
  const b = ch.b, p = ch.p, s = compute(b, p), c = CLASSES[b.cls], sp = SPECIES[b.species];
  const hpPct = Math.max(0, Math.min(100, (p.hp / s.hpMax) * 100));
  const down = p.hp <= 0;
  const tabs = [["actions", "Actions"], ["carac", "Skills"], ...(s.spells.length ? [["sorts", "Spells"]] : []), ["inv", "Inventory"], ["traits", "Features"], ...(typeof FB !== "undefined" && FB.ok ? [["adv", ch.adv ? "Adventure ●" : "Adventure"]] : []), ["notes", "Notes"]];
  const tabBody = { actions: tabActions, carac: tabSkills, sorts: tabSpells, inv: tabInventory, traits: tabTraits, notes: tabNotes, adv: typeof tabAdventure === "function" ? tabAdventure : tabActions }[S.tab] || tabActions;
  return `<header class="topbar sheet-top">
    <button class="icon-btn" data-a="home" aria-label="Back">${ICON.back}</button>
    <div class="tb-title"><strong>${esc(b.name)}</strong><span class="eyebrow">${sp.n} · ${c.n} ${b.level}${s.sub ? " · " + esc(s.sub) : ""}</span></div>
    <div class="tb-actions">
      <button class="btn small ghost" data-a="rest" data-v="short">${ICON.fire}<span class="hide-s">Short Rest</span></button>
      <button class="btn small ghost" data-a="rest" data-v="long">${ICON.moon}<span class="hide-s">Long Rest</span></button>
      ${b.level < MAXLV ? `<button class="btn small" data-a="levelUp">Level ${b.level + 1}</button>` : ""}
      <button class="icon-btn" data-a="edit" aria-label="Edit character">${ICON.edit}</button>
    </div>
  </header>
  <main class="sheet">
    <section class="vitals">
      <div class="hp-card ${down ? "down" : ""}">
        <div class="hp-top"><span class="lbl">Hit Points</span>${p.temp ? `<span class="temp">+${p.temp} temp.</span>` : ""}</div>
        <button class="hp-num" data-a="hpModal"><b>${p.hp}</b><span>/ ${s.hpMax}</span></button>
        <div class="hp-bar"><i style="width:${hpPct}%"></i></div>
        <div class="hp-quick"><button class="mini dmg" data-a="hpQuick" data-v="-1" aria-label="Remove 1 HP">−1</button><button class="mini" data-a="hpModal">Adjust</button><button class="mini heal" data-a="hpQuick" data-v="1" aria-label="Add 1 HP">+1</button></div>
      </div>
      <div class="stat-tiles">
        <div class="tile"><span class="lbl">AC</span><b>${s.ac}</b><span class="tsub">${esc(s.acNote)}</span>${s.armorWarn ? "<span class=\"warn\">not proficient</span>" : ""}</div>
        <button class="tile roll" data-a="r20" data-l="Initiative" data-m="${s.init}"><span class="lbl">Initiative</span><b>${sg(s.init)}</b><span class="tsub">${ICON.d20}</span></button>
        <div class="tile"><span class="lbl">Speed</span><b>${fmtM(s.speed)}</b><span class="tsub">${s.darkvision ? "Darkvision " + fmtM(s.darkvision) : "&nbsp;"}</span></div>
        <div class="tile"><span class="lbl">Proficiency</span><b>${sg(s.pb)}</b><span class="tsub">Passive Perc. ${10 + s.perc}</span></div>
        <button class="tile ${p.insp ? "lit" : ""}" data-a="insp" aria-pressed="${p.insp}"><span class="lbl">Inspiration</span><b>${p.insp ? "★" : "☆"}</b><span class="tsub">heroic</span></button>
      </div>
    </section>
    ${down ? deathSaves(p) : ""}
    <section class="abil-strip">${ABK.map((k) => {
      const sv = s.saves.find((x) => x.k === k);
      return `<div class="abil"><button class="ab-main" data-a="r20" data-l="Test de ${ABIL[k].n}" data-m="${s.m[k]}"><span class="lbl">${ABIL[k].n}</span><b>${sg(s.m[k])}</b><span class="ab-score">${s.ab[k]}</span></button>
        <button class="ab-save ${sv.pr ? "pr" : ""}" data-a="r20" data-l="Sauvegarde de ${ABIL[k].n}" data-m="${sv.v}"><i></i>Save ${sg(sv.v)}</button></div>`;
    }).join("")}</section>
    ${p.cond.length ? `<div class="conds">${p.cond.map((x) => `<button class="cond" data-a="cond" data-v="${esc(x)}">${esc(COND_L[x] || x)} ${ICON.close}</button>`).join("")}</div>` : ""}
    <nav class="tabs" role="tablist">${tabs.map(([k, n]) => `<button role="tab" class="tab ${S.tab === k ? "on" : ""}" data-a="tab" data-v="${k}" aria-selected="${S.tab === k}">${n}</button>`).join("")}</nav>
    <section class="tab-body">${tabBody(ch, s)}</section>
  </main>`;
}

function deathSaves(p) {
  const dots = (n, k) => [0, 1, 2].map((i) => `<button class="ds ${i < n ? "on" : ""} ${k}" data-a="ds" data-k="${k}" data-i="${i}" aria-label="${k === "s" ? "Success" : "Failure"} ${i + 1}"></button>`).join("");
  return `<section class="panel death"><div><span class="lbl">Death Saving Throws</span><p class="mute small">At 0 HP: roll a d20 at the start of your turn. 10 or higher = success.</p></div>
    <div class="ds-row"><span>Successes</span>${dots(p.ds.s, "s")}</div><div class="ds-row"><span>Failures</span>${dots(p.ds.f, "f")}</div>
    <button class="btn small" data-a="deathRoll">${ICON.d20} Thrown</button></section>`;
}

function resRow(ch, r) {
  const used = ch.p.res[r.k] || 0, left = r.max - used;
  const reset = r.reset === "long" ? "Long Rest" : r.reset === "short" ? "Short Rest" : "1 per Short Rest";
  if (r.max > 6) return `<div class="res"><div><b>${r.n}</b><span class="mute small">${left}/${r.max} · ${reset}${r.note ? " · " + r.note : ""}</span></div>
    <div class="res-pool"><button class="mini" data-a="resPool" data-k="${r.k}" data-d="1" aria-label="Spend">−</button><b>${left}</b><button class="mini" data-a="resPool" data-k="${r.k}" data-d="-1" aria-label="Regain">+</button></div></div>`;
  return `<div class="res"><div><b>${r.n}</b><span class="mute small">${reset}${r.note ? " · " + r.note : ""}</span></div>
    <div class="pips">${Array.from({ length: r.max }, (_, i) => `<button class="pip ${i < left ? "on" : ""}" data-a="resPip" data-k="${r.k}" data-i="${i}" aria-label="${r.n} ${i + 1}"></button>`).join("")}</div></div>`;
}

function tabActions(ch, s) {
  const b = ch.b;
  const atk = s.attacks.map((a) => `<div class="atk">
    <div class="atk-name"><b>${esc(a.n)}</b><span class="mute small">${a.range}${a.props ? " · " + a.props : ""}${a.mastery ? ` · <span class="mast" title="${esc(MASTERY[a.mastery])}">${MASTERY[a.mastery].split(" — ")[0]}</span>` : ""}${a.prof ? "" : " · <span class='bad'>not proficient</span>"}</span></div>
    <button class="rb hit" data-a="r20" data-l="${esc(a.n)} — attaque" data-m="${a.hit}" data-crit="${a.crit}">${sg(a.hit)}</button>
    <button class="rb dmg" data-a="rDmg" data-l="${esc(a.n)} — dégâts ${a.ty}" data-e="${a.dmg}${a.rage ? "" : ""}">${esc(a.dmg)}<small>${a.ty}</small></button>
    ${a.alt ? `<button class="rb dmg alt" data-a="rDmg" data-l="${esc(a.n)} à deux mains" data-e="${a.alt}">${esc(a.alt)}<small>2 hands</small></button>` : ""}
  </div>`).join("");
  const cantrips = s.spells.filter((x) => x.l === 0 && (x.atk || x.sv || x.dmg));
  const cantHtml = cantrips.map((x) => {
    const dice = x.dmg ? scaleCantrip(x, b.level) : null;
    return `<div class="atk spell">
      <div class="atk-name"><b>${x.n}</b><span class="mute small">${x.p} · cantrip</span></div>
      ${x.atk ? `<button class="rb hit" data-a="r20" data-l="${esc(x.n)} — attaque" data-m="${x.atk}">${sg(x.atk)}</button>` : `<span class="rb dc">DC ${x.dc}<small>${ABIL[x.sv].s}</small></span>`}
      ${dice ? `<button class="rb dmg" data-a="rDmg" data-l="${esc(x.n)} — ${DMG[x.ty]}" data-e="${dice}${x.dmgBonus ? (x.dmgBonus > 0 ? "+" : "") + x.dmgBonus : ""}">${dice}${x.dmgBonus ? sg(x.dmgBonus) : ""}<small>${x.beams ? beams(b.level) + " beam" + (beams(b.level) > 1 ? "s" : "") : DMG[x.ty]}</small></button>` : ""}
    </div>`;
  }).join("");
  const extras = [];
  if (s.sneak) extras.push(`<button class="rb dmg wide" data-a="rDmg" data-l="Attaque sournoise" data-e="${s.sneak}">Sneak Attack ${s.sneak}</button>`);
  if (b.cls === "barbare") extras.push(`<span class="chipline">While raging: +${s.rageDmg} to Strength damage</span>`);
  if (b.cls === "guerrier") extras.push(`<button class="rb dmg wide" data-a="rHeal" data-l="Second souffle" data-e="1d10+${b.level}">Second Wind 1d10+${b.level}</button>`);
  if (b.cls === "barde") { const bd = bardDie(b.level); extras.push(`<button class="rb dmg wide" data-a="rDmg" data-l="Inspiration bardique" data-e="1${bd}">Inspiration ${bd}</button>`); }
  if (b.cls === "clerc" && b.level >= 7 && b.opts.strike === "divine") extras.push(`<button class="rb dmg wide" data-a="rDmg" data-l="Frappe divine" data-e="${b.level >= 14 ? "2d8" : "1d8"}">Divine Strike ${b.level >= 14 ? "2d8" : "1d8"}</button>`);
  if (b.cls === "druide" && b.level >= 7 && b.opts.strike === "primale") extras.push(`<button class="rb dmg wide" data-a="rDmg" data-l="Frappe primale" data-e="${b.level >= 15 ? "2d8" : "1d8"}">Primal Strike ${b.level >= 15 ? "2d8" : "1d8"}</button>`);
  if (b.cls === "paladin" && b.level >= 11) extras.push(`<button class="rb dmg wide" data-a="rDmg" data-l="Frappes radieuses" data-e="1d8">Radiant Strikes +1d8</button>`);
  if (b.cls === "barbare" && b.level >= 9) extras.push(`<button class="rb dmg wide" data-a="rDmg" data-l="Frappe brutale" data-e="${b.level >= 17 ? "2d10" : "1d10"}">Brutal Strike ${b.level >= 17 ? "2d10" : "1d10"}</button>`);
  if (b.cls === "moine" && b.level >= 6) extras.push(`<button class="rb heal wide" data-a="rHeal" data-l="Plénitude du corps" data-e="${s.maDie}+${s.m.sag}">Wholeness of Body ${s.maDie}${sg(s.m.sag)}</button>`);
  if (b.cls === "rodeur" && b.level >= 10) extras.push(`<button class="rb heal wide" data-a="rHeal" data-l="Infatigable (PV temporaires)" data-e="1d8+${s.m.sag}">Tireless 1d8${sg(s.m.sag)}</button>`);
  if (b.cls === "clerc" && b.level >= 2) extras.push(`<button class="rb dmg wide" data-a="rDmg" data-l="Étincelle divine" data-e="1d8+${s.m.sag}">Divine Spark 1d8${sg(s.m.sag)}</button>`);
  if (b.species === "drakeide") extras.push(`<button class="rb dmg wide" data-a="rDmg" data-l="Souffle (JS Dex DD ${8 + s.m.con + s.pb})" data-e="${b.level >= 5 ? "2d10" : "1d10"}">Breath Weapon ${b.level >= 5 ? "2d10" : "1d10"} · DC ${8 + s.m.con + s.pb}</button>`);
  if (b.cls === "rodeur" || s.spells.some((x) => x.id === "marquechasseur")) { const hm = b.cls === "rodeur" && b.level >= 20 ? "1d10" : "1d6"; extras.push(`<button class="rb dmg wide" data-a="rDmg" data-l="Marque du chasseur" data-e="${hm}">Hunter’s Mark +${hm}</button>`); }
  if (b.cls === "rodeur" && b.opts.prey === "colosse" && b.level >= 3) extras.push(`<button class="rb dmg wide" data-a="rDmg" data-l="Tueur de colosses" data-e="1d8">Colossus Slayer +1d8</button>`);
  if (b.cls === "barbare" && b.level >= 3) extras.push(`<button class="rb dmg wide" data-a="rDmg" data-l="Frénésie" data-e="${s.rageDmg}d6">Frenzy ${s.rageDmg}d6</button>`);
  return `<div class="cols">
    <section class="panel"><h3 class="ph">Attacks</h3><p class="mute small">Attacks per action: ${s.apa}${s.crit < 20 ? " · critical on " + s.crit + "-20" : ""}${b.cls === "moine" ? " · Martial Arts " + s.maDie.slice(1) : ""}</p>
      ${atk}${cantHtml}${extras.length ? `<div class="extras">${extras.join("")}</div>` : ""}</section>
    <section class="panel"><h3 class="ph">Resources</h3>${s.resources.length ? s.resources.map((r) => resRow(ch, r)).join("") : "<p class=\"mute small\">No limited resources.</p>"}
      <div class="hd-row"><div><b>Hit Dice</b><span class="mute small">d${s.hd} · ${b.level - ch.p.hdUsed}/${b.level} left</span></div><button class="btn small" data-a="spendHD" ${ch.p.hdUsed >= b.level ? "disabled" : ""}>Spend a die</button></div>
      <div class="cond-pick"><span class="lbl">Conditions</span><div class="chips">${CONDITIONS.map((x) => chip(COND_L[x], ch.p.cond.includes(x), "cond", `data-v="${x}"`)).join("")}</div></div>
    </section></div>`;
}
function cantripTier(lvl) { return lvl >= 17 ? 4 : lvl >= 11 ? 3 : lvl >= 5 ? 2 : 1; }
function beams(lvl) { return cantripTier(lvl); }
function scaleCantrip(x, lvl) {
  if (x.beams) return x.dmg; // un dé par rayon
  if (!x.sc) return x.dmg;
  const [n, f] = x.dmg.split("d");
  return (+n * cantripTier(lvl)) + "d" + f;
}

function tabSkills(ch, s) {
  const prof = profSkills(ch.b);
  return `<div class="cols">
  <section class="panel"><h3 class="ph">Skills</h3><div class="skills">${s.skills.map((k) => `<button class="skill ${k.pr ? "pr" + k.pr : ""}" data-a="r20" data-l="${k.n}" data-m="${k.v}"><i class="dot"></i><span>${k.n}</span><small>${ABIL[k.a].s}</small><b>${sg(k.v)}</b></button>`).join("")}</div>
    <p class="mute small legend"><i class="dot pr1"></i> proficient <i class="dot pr2"></i> expertise</p></section>
  <section class="panel"><h3 class="ph">Senses and proficiencies</h3>
    <dl class="facts"><div><dt>Passive Perception</dt><dd>${10 + s.perc}</dd></div>
    <div><dt>Passive Investigation</dt><dd>${10 + s.skills.find((x) => x.k === "inve").v}</dd></div>
    <div><dt>Passive Insight</dt><dd>${10 + s.skills.find((x) => x.k === "pspi").v}</dd></div>
    ${s.darkvision ? `<div><dt>Darkvision</dt><dd>${fmtM(s.darkvision)}</dd></div>` : ""}
    <div><dt>Armor</dt><dd>${s.profs.armor}</dd></div><div><dt>Weapons</dt><dd>${s.profs.weapons}</dd></div>
    <div><dt>Tools</dt><dd>${esc(s.profs.tools)}</dd></div><div><dt>Languages</dt><dd>${s.langs.map(esc).join(", ")}</dd></div></dl>
    ${s.stealthDis ? "<p class=\"warn\">Your armor gives Disadvantage on Stealth checks.</p>" : ""}
  </section></div>`;
}

function tabSpells(ch, s) {
  const b = ch.b, p = ch.p, cast = s.casting;
  let slots = "";
  if (cast && cast.slots.type === "std") slots = cast.slots.slots.map((n, i) => {
    const lv = i + 1, used = p.slots[lv] || 0;
    return `<div class="slot-lv"><span class="lbl">Lvl. ${lv}</span><div class="pips">${Array.from({ length: n }, (_, j) => `<button class="pip arc ${j < n - used ? "on" : ""}" data-a="slotPip" data-lv="${lv}" data-i="${j}" data-max="${n}" aria-label="Slot ${lv}"></button>`).join("")}</div></div>`;
  }).join("");
  if (cast && cast.slots.type === "pact") slots = `<div class="slot-lv"><span class="lbl">Pact lvl. ${cast.slots.lvl}</span><div class="pips">${Array.from({ length: cast.slots.n }, (_, j) => `<button class="pip arc ${j < cast.slots.n - (p.pact || 0) ? "on" : ""}" data-a="pactPip" data-i="${j}" data-max="${cast.slots.n}" aria-label="Pact slot"></button>`).join("")}</div><span class="mute small">Short Rest</span></div>`;
  const byLv = {};
  s.spells.forEach((x) => (byLv[x.l] = byLv[x.l] || []).push(x));
  const groups = Object.keys(byLv).sort((a, b2) => a - b2).map((l) => `<p class="lvl-sep">${l == 0 ? "Cantrips" : "Level " + l}</p>` + byLv[l].map((x) => {
    const open = S.openSpell === x.id;
    const dmg = x.dmg ? (x.l === 0 ? scaleCantrip(x, b.level) : x.dmg) + (x.dmgBonus ? (x.dmgBonus > 0 ? "+" : "") + x.dmgBonus : "") : null;
    const heal = x.heal ? x.heal + (x.id === "simulacredevie" ? "" : (x.mod >= 0 ? "+" : "") + x.mod) : null;
    return `<div class="spell-row sheet-spell ${p.conc === x.id ? "conc" : ""}">
      <button class="sr-main" data-a="toggleSpell" data-v="${x.id}" aria-expanded="${open}">
        <span class="sr-name">${x.n}${x.co ? '<i class="tagc" title="Concentration">C</i>' : ""}${x.ri ? "<i class=\"tagc\" title=\"Ritual\">R</i>" : ""}</span>
        <span class="sr-meta">${x.t} · ${x.p}${x.always ? " · " + esc(x.src) : ""}</span>
      </button>
      <div class="sr-acts">
        ${x.atk ? `<button class="rb hit" data-a="r20" data-l="${esc(x.n)} — attaque" data-m="${x.atk}">${sg(x.atk)}</button>` : ""}
        ${x.sv ? `<span class="rb dc">DC ${x.dc}<small>${ABIL[x.sv].s}</small></span>` : ""}

/* ---------------- Modales ---------------- */
function viewModal() {
  const m = S.modal, ch = curChar();
  let inner = "";
  const ax = typeof advModal === "function" ? advModal(m) : null;
  if (ax) inner = ax;
  else if (m.k === "hp") {
    const s = compute(ch.b, ch.p);
    inner = `<h3>Hit Points</h3><p class="mute">${ch.p.hp} / ${s.hpMax}${ch.p.temp ? ` · ${ch.p.temp} temporary` : ""}</p>
      <label class="field big"><span>Amount</span><input id="hpAmt" type="number" inputmode="numeric" placeholder="0" autofocus></label>
      <div class="row-btns"><button class="btn dmgb" data-a="hpApply" data-v="dmg">Damage</button><button class="btn healb" data-a="hpApply" data-v="heal">Cure Wounds</button><button class="btn ghost" data-a="hpApply" data-v="temp">Temporary HP</button></div>`;
  } else if (m.k === "rest") {
    const s = compute(ch.b, ch.p);
    inner = m.v === "long" ? `<h3>Long Rest</h3><p>You regain all your HP, Hit Dice, spell slots, and resources. Temporary HP are lost.</p><div class="row-btns"><button class="btn primary" data-a="restDo" data-v="long">Rest</button><button class="btn ghost" data-a="closeModal">Cancel</button></div>`
      : `<h3>Short Rest</h3><p>An hour of respite. Spend Hit Dice to regain HP (d${s.hd} + ${sg(s.m.con)} each). ${CLASSES[ch.b.cls].caster === "pact" ? "Your Pact Magic slots return." : ""}</p>
        <p class="mute">Hit Dice left: ${ch.b.level - ch.p.hdUsed}/${ch.b.level} · HP ${ch.p.hp}/${s.hpMax}</p>
        <div class="row-btns"><button class="btn" data-a="spendHD" ${ch.p.hdUsed >= ch.b.level ? "disabled" : ""}>Spend a Hit Die</button><button class="btn primary" data-a="restDo" data-v="short">Finish the rest</button></div>`;
  } else if (m.k === "cast") {
    const sp = SPELLS[m.v], s = compute(ch.b, ch.p), cast = s.casting;
    const entry = s.spells.find((x) => x.id === m.v);
    const opts = [];
    if (cast && cast.slots.type === "std") cast.slots.slots.forEach((n, i) => { const lv = i + 1; if (lv >= sp.l) opts.push(`<button class="btn ${n - (ch.p.slots[lv] || 0) > 0 ? "" : "off"}" data-a="castDo" data-v="${m.v}" data-lv="${lv}" ${n - (ch.p.slots[lv] || 0) > 0 ? "" : "disabled"}>Slot level ${lv} <small>(${n - (ch.p.slots[lv] || 0)}/${n})</small></button>`); });
    if (cast && cast.slots.type === "pact" && cast.slots.lvl >= sp.l) { const left = cast.slots.n - (ch.p.pact || 0); opts.push(`<button class="btn" data-a="castDo" data-v="${m.v}" data-lv="pact" ${left > 0 ? "" : "disabled"}>Pact slot, level ${cast.slots.lvl} <small>(${left}/${cast.slots.n})</small></button>`); }
    if (entry && entry.free) { const r = s.resources.find((x) => x.k === entry.free); if (r) { const left = r.max - (ch.p.res[r.k] || 0); opts.push(`<button class="btn ghost" data-a="castDo" data-v="${m.v}" data-lv="free" data-k="${r.k}" ${left > 0 ? "" : "disabled"}>Free <small>(${left}/${r.max} per rest)</small></button>`); } }
    if (sp.ri) opts.push(`<button class="btn ghost" data-a="castDo" data-v="${m.v}" data-lv="ritual">As a Ritual (+10 minutes, no slot)</button>`);
    inner = `<h3>Thrown ${sp.n}</h3>${spellDetail(sp)}<div class="cast-opts">${opts.join("") || "<p class=\"mute\">No slot available for this spell.</p>"}</div>`;
  } else if (m.k === "del") {
    inner = `<h3>Delete ${esc(ch.b.name)} ?</h3><p>The character will be permanently erased. Export it first if you want to keep it.</p><div class="row-btns"><button class="btn dmgb" data-a="delDo">Delete permanently</button><button class="btn ghost" data-a="closeModal">Cancel</button></div>`;
  } else if (m.k === "export") {
    inner = `<h3>Export</h3><p class="mute">Copy this text to back up your character or import it on another device.</p><textarea id="exportTxt" class="code" rows="8" readonly>${esc(JSON.stringify({ forge: 1, b: ch.b, p: ch.p }))}</textarea><div class="row-btns"><button class="btn primary" data-a="copyExport">Copy</button></div>`;
  } else if (m.k === "import") {
    inner = `<h3>Import a character</h3><p class="mute">Paste the text exported from Forge des Héros.</p><textarea id="importTxt" class="code" rows="8" placeholder='{"forge":1,…}'></textarea>${m.err ? `<p class="bad">${esc(m.err)}</p>` : ""}<div class="row-btns"><button class="btn primary" data-a="importDo">Import</button></div>`;
  }
  return `<div class="modal-back" data-a="closeModal"></div><div class="modal" role="dialog" aria-modal="true"><button class="icon-btn mclose" data-a="closeModal" aria-label="Close">${ICON.close}</button>${inner}</div>`;
}

function viewRollbar() {

    ${last ? `<button class="last-roll ${last.cls || ""}" data-a="openTray"><span class="lr-label">${esc(last.label)}</span><b>${last.total}</b></button>` : `<span class="mute small hide-s">Tap a bonus to roll</span>`}

function viewTray() {

    <div class="tray-head"><h3>Dice tray</h3><button class="icon-btn" data-a="closeTray" aria-label="Close">${ICON.close}</button></div>

    <div class="add-item"><label class="field"><span>Custom formula</span><input id="trayExpr" value="${esc(S.trayExpr)}" placeholder="E.g. 2d6+3" autocomplete="off"></label><button class="btn" data-a="trayExpr">Thrown</button></div>
    <h4>Background</h4>

  </div>`;

function logRow(r) {
  return `<div class="log-row ${r.cls || ""}"><div><b>${esc(r.label)}</b><span class="mute small">${esc(r.detail)}</span></div><span class="log-total">${r.total}</span></div>`;
}

function pushRoll(r) {
  S.log.unshift(r);
  S.log = S.log.slice(0, 40);
  showRollToast(r);
}
function showRollToast(r) {
  const el = $("#rolltoast");
  el.innerHTML = `<div class="rt ${r.cls || ""}"><span class="rt-label">${esc(r.label)}</span><span class="rt-total">${r.total}</span><span class="rt-detail">${esc(r.detail)}</span>${r.note ? `<span class="rt-note">${esc(r.note)}</span>` : ""}</div>`;
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
  clearTimeout(showRollToast.t);
  showRollToast.t = setTimeout(() => el.classList.remove("show"), 4200);
}
function doD20(label, m, critOn = 20) {
  const r = rollD20(m, S.rollMode);
  let cls = "", note = "";
  if (r.kept >= critOn) { cls = "crit"; note = "Critical!"; }
  else if (r.kept === 1) { cls = "fumble"; note = "Critical miss"; }
  const modeTxt = r.mode === "adv" ? " (advantage)" : r.mode === "dis" ? " (disadvantage)" : "";
  pushRoll({ label: label + modeTxt, total: r.total, detail: `d20 [${r.dice.join(", ")}] ${sg(m)}`, cls, note });
}
function doExpr(label, expr, kind) {
  const r = rollExpr(expr);
  if (!r.parts.length && !r.mod) { toast("Formula not recognized. Example: 2d6+3"); return; }
  const detail = r.parts.map((p) => `${p.sgn < 0 ? "−" : ""}${p.r.length}d${p.d} [${p.r.join(", ")}]`).join(" ") + (r.mod ? " " + sg(r.mod) : "");
  pushRoll({ label, total: Math.max(kind === "dmg" || kind === "heal" ? 0 : -999, r.total), detail, cls: kind === "heal" ? "healr" : kind === "dmg" ? "dmgr" : "" });
  return r;
}

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("show"), 3000);
}

/* ---------------- Actions ---------------- */
function toggleIn(arr, v, max) {
  const i = arr.indexOf(v);
  if (i >= 0) arr.splice(i, 1);
  else if (max == null || arr.length < max) arr.push(v);
  else if (max === 1) { arr.splice(0, 1, v); }
}

function setClass(b, k) {
  if (b.cls === k) return;
  b.cls = k;
  b.skillsClass = []; b.expertise = []; b.skillsLore = []; b.skillPrimal = null;
  b.opts = { style: null, style2: null, order: null, strike: null, dragon: null, mastery: [], inv: [], meta: [], prey: null, land: null, lore2: [], arcanum: {}, asis: b.opts.asis || {}, boon: b.opts.boon || { id: null, a: null } };
  b.cant = []; b.prep = []; b.gear.cls = "A";
  if (b.method !== "points") assignStandard(b);
}

function cleanBuild(b) {
  // retirer les choix devenus invalides après un changement de niveau ou d’option
  const c = CLASSES[b.cls];
  if (!c) return;
  const pool = classSkillPool(b);
  b.skillsClass = b.skillsClass.filter((k) => pool.includes(k)).slice(0, c.skills.n);
  const ex = expertiseCount(b), ep = expertisePool(b);
  b.expertise = b.expertise.filter((k) => ep.includes(k)).slice(0, ex);
  if (c.caster) {
    b.cant = b.cant.slice(0, cantripCount(b));
    const max = maxSpellLevel(b);
    b.prep = b.prep.filter((id) => SPELLS[id] && SPELLS[id].l <= max).slice(0, prepCount(b));
  } else { b.cant = []; b.prep = []; }
  if (c.inv) b.opts.inv = b.opts.inv.filter((k) => INVOCATIONS[k].lv <= b.level).slice(0, c.inv[b.level - 1]);
  b.opts.meta = b.opts.meta.slice(0, metaCount(b));
}

async function act(a, d, el) {
  const b = S.draft, ch = curChar();
  switch (a) {
    /* navigation */
    case "home": S.view = "home"; S.modal = null; S.openSpell = null; if (typeof Live !== "undefined") Live.stop(); break;
    case "new": S.draft = newBuild(); S.editId = null; S.step = 0; S.view = "create"; window.scrollTo(0, 0); break;
    case "open": S.cur = d.id; S.view = "sheet"; S.tab = "actions"; S.openSpell = null; window.scrollTo(0, 0); break;
    case "edit": S.draft = migrate(clone(ch.b)); S.editId = ch.id; S.step = 0; S.view = "create"; window.scrollTo(0, 0); break;
    case "step": S.step = +d.i; S.openSpell = null; window.scrollTo(0, 0); break;
    case "tab": S.tab = d.v; S.openSpell = null; break;
    /* créateur */
    case "setLevel": b.level = +d.v; cleanBuild(b); break;
    case "setClass": setClass(b, d.v); break;
    case "setBg": if (b.bg !== d.v) { b.bg = d.v; b.bonus = { mode: "21", p2: null, p1: null }; const g = BACKGROUNDS[d.v]; if (g.featList) b.magic.bg = { list: g.featList, cant: [], spell: null, ab: g.featList === "mag" ? "int" : "sag" }; const pri = CLASSES[b.cls] ? PRIORITY[b.cls] : ABK; const sorted = g.ab.slice().sort((x, y) => pri.indexOf(x) - pri.indexOf(y)); b.bonus.p2 = sorted[0]; b.bonus.p1 = sorted[1]; b.skillsClass = b.skillsClass.filter((k) => !g.skills.includes(k)); } break;
    case "setSpecies": if (b.species !== d.v) { b.species = d.v; b.sChoice = null; b.skillsSpecies = []; b.humanFeat = null; b.size = d.v === "gnome" || d.v === "halfelin" ? K("Petite") : K("Moyenne"); } break;
    case "setSChoice": b.sChoice = d.v; break;
    case "setSize": b.size = d.v; break;
    case "setSAb": b.sSpellAb = d.v; break;
    case "setMethod": b.method = d.v; if (d.v === "points") ABK.forEach((k) => (b.base[k] = 8)); else if (d.v === "standard") assignStandard(b); else if (d.v === "roll" && b.rolled) assignStandard(b); break;
    case "pb": { const k = d.k, nv = b.base[k] + +d.d; if (nv >= 8 && nv <= 15) b.base[k] = nv; break; }
    case "rollStats": {
      b.rolled = Array.from({ length: 6 }, () => { const r = [1, 2, 3, 4].map(() => rollDie(6)).sort((x, y) => y - x); return r[0] + r[1] + r[2]; });
      assignStandard(b);
      pushRoll({ label: "Ability score roll", total: b.rolled.reduce((x, y) => x + y, 0), detail: "4d6 (best 3): " + b.rolled.join(", ") });
      break;
    }
    case "recommend": assignStandard(b); break;
    case "setBonusMode": b.bonus.mode = d.v; break;
    case "setP2": b.bonus.p2 = d.v; if (b.bonus.p1 === d.v) b.bonus.p1 = null; break;
    case "setP1": b.bonus.p1 = d.v; break;
    case "setAsiMode": b.opts.asis[d.lv] = { mode: d.v, a: null, b: null }; break;
    case "setAsiA": { const x = asiAt(b, d.lv); x.a = d.v; if (x.b === d.v) x.b = null; break; }
    case "setAsiB": asiAt(b, d.lv).b = d.v; break;
    case "boon": b.opts.boon.id = d.v; break;
    case "boonAb": b.opts.boon.a = d.v; break;
    case "style2": b.opts.style2 = d.v; break;
    case "strike": b.opts.strike = d.v; break;
    case "dragon": b.opts.dragon = d.v; break;
    case "lore2": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.opts.lore2, d.v, 2); break;
    case "arcanum": b.opts.arcanum[d.lv] = b.opts.arcanum[d.lv] === d.v ? null : d.v; break;
    case "levelUp": { const nb = migrate(clone(ch.b)); nb.level = Math.min(MAXLV, nb.level + 1); cleanBuild(nb); S.draft = nb; S.editId = ch.id; const st = stepsFor(nb), iss = issues(nb); const first = st.findIndex((x) => (iss[x.k] || []).length); S.step = first >= 0 ? first : st.length - 1; S.view = "create"; window.scrollTo(0, 0); toast("Level " + nb.level + ": complete your new choices"); break; }
    case "skClass": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.skillsClass, d.v, CLASSES[b.cls].skills.n); cleanBuild(b); break;
    case "skSpecies": if (el.getAttribute("aria-disabled") === "true" && !b.skillsSpecies.includes(d.v)) { if (SPECIES[b.species].skillPick.n === 1 && !profSkills(b).has(d.v)) { b.skillsSpecies = [d.v]; break; } return; } toggleIn(b.skillsSpecies, d.v, SPECIES[b.species].skillPick.n); break;
    case "skSkilled": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.skilled, d.v, 3); break;
    case "skLore": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.skillsLore, d.v, 3); break;
    case "skPrimal": b.skillPrimal = b.skillPrimal === d.v ? null : d.v; break;
    case "expertise": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.expertise, d.v, expertiseCount(b)); break;
    case "humanFeat": b.humanFeat = d.v; if (d.v === "initie") b.magic.human = { list: "clr", cant: [], spell: null, ab: "sag" }; if (d.v !== "doue" && BACKGROUNDS[b.bg] && BACKGROUNDS[b.bg].feat !== "doue") b.skilled = []; break;
    case "miList": b.magic[d.src] = { list: d.v, cant: [], spell: null, ab: b.magic[d.src].ab }; break;
    case "miAb": b.magic[d.src].ab = d.v; break;
    case "miCant": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.magic[d.src].cant, d.v, 2); break;
    case "miSpell": b.magic[d.src].spell = d.v; break;
    case "order": b.opts.order = d.v; cleanBuild(b); break;
    case "style": b.opts.style = d.v; break;
    case "mastery": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.opts.mastery, d.v, CLASSES[b.cls].mastery); break;
    case "inv": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.opts.inv, d.v, CLASSES[b.cls].inv[b.level - 1]); break;
    case "meta": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.opts.meta, d.v, 2); break;
    case "prey": b.opts.prey = d.v; break;
    case "land": b.opts.land = d.v; break;
    case "lang": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.langs, d.v, 2); break;
    case "pickCant": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.cant, d.v, cantripCount(b)); break;
    case "pickPrep": if (el.getAttribute("aria-disabled") === "true") return; toggleIn(b.prep, d.v, prepCount(b)); break;
    case "spellLvl": S.spellLvl = d.v; break;
    case "toggleSpell": S.openSpell = S.openSpell === d.v ? null : d.v; break;
    case "gearCls": b.gear.cls = d.v; break;
    case "gearBg": b.gear.bg = d.v; break;
    case "align": b.align = d.v; break;
    case "finish": {
      const all = Object.values(issues(b)).flat();
      if (all.length) { toast("Still missing: " + all[0]); return; }
      if (S.editId) {
        const old = S.chars.find((c) => c.id === S.editId);
        const oldMax = compute(old.b, old.p).hpMax;
        const gearChanged = old.b.cls !== b.cls || old.b.bg !== b.bg || old.b.gear.cls !== b.gear.cls || old.b.gear.bg !== b.gear.bg;
        old.b = clone(b);
        if (gearChanged) { const st = startingInventory(b); old.p.inv = st.inv; old.p.gold = st.gold; }
        const newMax = compute(old.b, old.p).hpMax;
        old.p.hp = Math.max(1, Math.min(newMax, old.p.hp + (newMax - oldMax)));
        old.p.hdUsed = Math.min(old.p.hdUsed, b.level);
        await Store.put(old);
        S.cur = old.id;
        toast("Character updated");
      } else {
        const chNew = { id: b.id, b: clone(b), p: newPlay(b) };
        S.chars.push(chNew);
        await Store.put(chNew);
        S.cur = chNew.id;
        toast(b.name + " is ready for adventure");
      }
      S.view = "sheet"; S.tab = "actions"; S.draft = null; window.scrollTo(0, 0);
      break;
    }
    /* fiche */
    case "hpModal": S.modal = { k: "hp" }; render(); setTimeout(() => { const i = $("#hpAmt"); i && i.focus(); }, 30); return;
    case "hpQuick": { const s = compute(ch.b, ch.p); if (+d.v < 0) applyDamage(ch, 1); else ch.p.hp = Math.min(s.hpMax, ch.p.hp + 1); if (ch.p.hp > 0) ch.p.ds = { s: 0, f: 0 }; saveSoon(ch); break; }
    case "hpApply": {
      const n = Math.abs(parseInt($("#hpAmt").value, 10) || 0);
      if (!n) { toast("Enter a number of Hit Points."); return; }
      const s = compute(ch.b, ch.p);
      if (d.v === "dmg") applyDamage(ch, n);
      if (d.v === "heal") { ch.p.hp = Math.min(s.hpMax, Math.max(0, ch.p.hp) + n); ch.p.ds = { s: 0, f: 0 }; }
      if (d.v === "temp") ch.p.temp = Math.max(ch.p.temp, n);
      S.modal = null; saveSoon(ch); break;
    }
    case "insp": ch.p.insp = !ch.p.insp; saveSoon(ch); break;
    case "ds": { const k = d.k, i = +d.i; ch.p.ds[k] = ch.p.ds[k] === i + 1 ? i : i + 1; saveSoon(ch); break; }
    case "deathRoll": {
      const r = rollD20(0, "normal"), v = r.kept;
      let note = "";
      if (v === 20) { ch.p.hp = 1; ch.p.ds = { s: 0, f: 0 }; note = "Natural 20: you’re back at 1 HP!"; }
      else if (v === 1) { ch.p.ds.f = Math.min(3, ch.p.ds.f + 2); note = "Natural 1: two failures"; }
      else if (v >= 10) ch.p.ds.s = Math.min(3, ch.p.ds.s + 1); else ch.p.ds.f = Math.min(3, ch.p.ds.f + 1);
      if (ch.p.ds.s >= 3) note = "Three successes: you are stable.";
      if (ch.p.ds.f >= 3) note = "Three failures: your character dies.";
      pushRoll({ label: "Death saving throw", total: v, detail: v >= 10 ? "success" : "failure", cls: v >= 10 ? "healr" : "dmgr", note });
      saveSoon(ch); break;
    }
    case "cond": toggleIn(ch.p.cond, d.v); saveSoon(ch); break;
    case "resPip": { const s = compute(ch.b, ch.p), r = s.resources.find((x) => x.k === d.k), left = r.max - (ch.p.res[d.k] || 0), i = +d.i; ch.p.res[d.k] = i < left ? r.max - i : r.max - i - 1; ch.p.res[d.k] = Math.max(0, Math.min(r.max, ch.p.res[d.k])); saveSoon(ch); break; }
    case "resPool": { const s = compute(ch.b, ch.p), r = s.resources.find((x) => x.k === d.k); ch.p.res[d.k] = Math.max(0, Math.min(r.max, (ch.p.res[d.k] || 0) + +d.d)); saveSoon(ch); break; }
    case "slotPip": { const lv = d.lv, max = +d.max, i = +d.i, left = max - (ch.p.slots[lv] || 0); ch.p.slots[lv] = i < left ? max - i : max - i - 1; ch.p.slots[lv] = Math.max(0, Math.min(max, ch.p.slots[lv])); saveSoon(ch); break; }
    case "pactPip": { const max = +d.max, i = +d.i, left = max - (ch.p.pact || 0); ch.p.pact = Math.max(0, Math.min(max, i < left ? max - i : max - i - 1)); saveSoon(ch); break; }
    case "spendHD": {
      if (ch.p.hdUsed >= ch.b.level) return;
      const s = compute(ch.b, ch.p);
      const r = rollExpr("1d" + s.hd);
      const gain = Math.max(1, r.total + s.m.con);
      ch.p.hdUsed += 1; ch.p.hp = Math.min(s.hpMax, Math.max(0, ch.p.hp) + gain);
      pushRoll({ label: "Hit Die", total: gain, detail: `d${s.hd} [${r.parts[0].r[0]}] ${sg(s.m.con)}`, cls: "healr" });
      saveSoon(ch); break;
    }
    case "rest": S.modal = { k: "rest", v: d.v }; break;
    case "restDo": restDo(ch, d.v); S.modal = null; toast(d.v === "long" ? "Long Rest finished. Resources restored." : "Short Rest finished."); saveSoon(ch); break;
    case "castOpen": S.modal = { k: "cast", v: d.v }; break;
    case "castDo": {
      const sp = SPELLS[d.v];
      if (d.lv === "pact") ch.p.pact = (ch.p.pact || 0) + 1;
      else if (d.lv === "free") ch.p.res[d.k] = (ch.p.res[d.k] || 0) + 1;
      else if (d.lv !== "ritual") ch.p.slots[d.lv] = (ch.p.slots[d.lv] || 0) + 1;
      if (sp.co) ch.p.conc = d.v;
      S.modal = null;
      toast(`${sp.n} cast${d.lv === "ritual" ? " as a Ritual" : ""}${sp.co ? " · concentration" : ""}`);
      saveSoon(ch); break;
    }
    case "endConc": ch.p.conc = null; saveSoon(ch); break;
    case "equip": {
      const it = ch.p.inv.find((i) => i.uid === d.u);
      if (!it) return;
      const isBody = it.ref.startsWith("a:") && it.ref !== "a:bouclier";
      if (!it.eq && isBody) ch.p.inv.forEach((i) => { if (i.ref.startsWith("a:") && i.ref !== "a:bouclier") i.eq = false; });
      it.eq = !it.eq; saveSoon(ch); break;
    }
    case "qty": { const it = ch.p.inv.find((i) => i.uid === d.u); it.q += +d.d; if (it.q <= 0) ch.p.inv = ch.p.inv.filter((i) => i.uid !== d.u); saveSoon(ch); break; }
    case "addItem": { const v = $("#newItem").value.trim(); if (!v) { toast("Enter the item’s name."); return; } ch.p.inv.push({ uid: uid(), ref: null, n: v, q: 1, eq: false }); saveSoon(ch); break; }
    case "addRef": { const v = $("#newRef").value; const it = itemFrom([v, 1]); ch.p.inv.push(it); saveSoon(ch); toast(itemName(it) + " added"); break; }
    case "gold": { const n = Math.abs(parseInt($("#goldAmt").value, 10) || 0); if (!n) { toast("Enter an amount."); return; } ch.p.gold = Math.max(0, ch.p.gold + n * +d.d); saveSoon(ch); break; }
    case "delAsk": S.modal = { k: "del" }; break;
    case "delDo": if (ch.adv && typeof FB !== "undefined" && FB.ok) { try { await FB.members(ch.adv).doc(FB.uid + "_" + ch.id).delete(); } catch (e) { } } await Store.del(ch.id); S.chars = S.chars.filter((c) => c.id !== ch.id); S.modal = null; S.view = "home"; toast("Character deleted"); break;
    case "exportOpen": S.modal = { k: "export" }; break;
    case "copyExport": { const t = $("#exportTxt"); try { await navigator.clipboard.writeText(t.value); toast("Copied to clipboard"); } catch (e) { t.focus(); t.select(); toast("Selected: copy with Ctrl+C or a long press"); } return; }
    case "importOpen": S.modal = { k: "import" }; break;
    case "importDo": {
      try {
        const o = JSON.parse($("#importTxt").value);
        if (!o || !o.b || !o.p || !CLASSES[o.b.cls]) throw new Error();
        o.b.id = uid(); migrate(o.b); delete o.adv;
        const chNew = { id: o.b.id, b: o.b, p: o.p };
        S.chars.push(chNew); await Store.put(chNew);
        S.modal = null; S.cur = chNew.id; S.view = "sheet"; toast(o.b.name + " imported");
      } catch (e) { S.modal = { k: "import", err: "This text isn’t a valid Forge des Héros export." }; }
      break;
    }
    case "closeModal": S.modal = null; break;
    /* dés */
    case "rollMode": S.rollMode = d.v; break;
    case "r20": doD20(d.l, +d.m, d.crit ? +d.crit : 20); break;
    case "rDmg": doExpr(d.l, d.e, "dmg"); break;
    case "rHeal": doExpr(d.l, d.e, "heal"); break;
    case "openTray": S.tray = true; break;
    case "closeTray": S.tray = false; break;
    case "trayN": S.trayCount = Math.max(1, Math.min(20, S.trayCount + +d.d)); break;
    case "trayDie": {
      const f = +d.f;
      if (f === 20 && S.trayCount === 1) doD20("d20", 0);
      else doExpr(`${S.trayCount}d${f}`, `${S.trayCount}d${f}`);
      break;
    }
    case "trayExpr": { const v = $("#trayExpr").value.trim(); S.trayExpr = v; if (v) doExpr(v, v); break; }
    default: if (typeof advAct === "function" && (await advAct(a, d, el))) break; return;
  }
  render();
}

function applyDamage(ch, n) {
  let rest = n;
  if (ch.p.temp) { const t = Math.min(ch.p.temp, rest); ch.p.temp -= t; rest -= t; }
  ch.p.hp = Math.max(0, ch.p.hp - rest);
  if (ch.p.hp === 0 && ch.p.conc) ch.p.conc = null;
}
function restDo(ch, kind) {
  const s = compute(ch.b, ch.p);
  if (kind === "long") {
    ch.p.hp = s.hpMax; ch.p.temp = 0; ch.p.hdUsed = 0; ch.p.slots = {}; ch.p.pact = 0; ch.p.res = {}; ch.p.ds = { s: 0, f: 0 }; ch.p.conc = null;
    if (ch.b.species === "humain") ch.p.insp = true;
  } else {
    ch.p.pact = 0;
    s.resources.forEach((r) => {
      if (r.reset === "short") ch.p.res[r.k] = 0;
      if (r.reset === "short1") ch.p.res[r.k] = Math.max(0, (ch.p.res[r.k] || 0) - 1);
    });
  }
}

function refreshCreateMeta() {
  const b = S.draft, iss = issues(b), st = stepsFor(b)[S.step], all = Object.values(iss).flat();
  const fin = $('[data-a="finish"]');
  if (fin) { if (all.length) fin.setAttribute("aria-disabled", "true"); else fin.removeAttribute("aria-disabled"); }
  const head = $(".step-head p");
  if (head) head.outerHTML = (iss[st.k] || []).length ? `<p class="todo">To complete: ${iss[st.k].map(esc).join(" · ")}</p>` : `<p class="ok">${ICON.check} Step complete</p>`;
  const bottom = $(".step-main > .todo.center");
  if (bottom) { if (all.length) bottom.textContent = "Still missing: " + all.join(" · "); else bottom.remove(); }
}

/* ---------------- Événements ---------------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-a]");
  if (!t) return;
  if (t.matches(".modal-back") && e.target !== t) return;
  e.preventDefault();
  act(t.dataset.a, t.dataset, t);
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.f && S.draft) {
    const path = t.dataset.f.split(".");
    let o = S.draft;
    for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path[path.length - 1]] = t.value;
    if (t.dataset.f === "name") {
      const sum = $(".summary"); if (sum) sum.innerHTML = viewSummary(S.draft);
      const tb = $(".tb-title strong"); if (tb) tb.textContent = t.value || "Unnamed hero";
      refreshCreateMeta();
    }
  }
  if (t.dataset.pf) { const ch = curChar(); if (ch) { ch.p[t.dataset.pf] = t.value; saveSoon(ch); } }
  if (t.id === "trayExpr") S.trayExpr = t.value;
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.swap && S.draft) {
    const k = t.dataset.swap, v = +t.value, b = S.draft;
    const other = ABK.find((x) => x !== k && b.base[x] === v);
    if (other) b.base[other] = b.base[k];
    b.base[k] = v;
    render();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && (S.modal || S.tray)) { S.modal = null; S.tray = false; render(); }
  if (e.key === "Enter" && e.target.id === "hpAmt") act("hpApply", { v: "dmg" });
  if (e.key === "Enter" && e.target.id === "trayExpr") act("trayExpr", {});
});

/* ---------------- Démarrage ---------------- */
async function boot() {
  render();
  await Store.init();
  S.chars = (await Store.all()).map((c) => { migrate(c.b); return c; });
  S.loaded = true;
  if (!S.chars.length && !(await Store.seeded())) {
    // personnage d’exemple pour découvrir la fiche
    const ex = exampleCharacter();
    ex.example = true;
    S.chars.push(ex);
    await Store.put(ex);
    await Store.markSeeded();
  }
  render();
  if (typeof FB !== "undefined") FB.init().then(() => { if (FB.ok) { S.chars.filter((c) => c.adv).forEach((c) => pushMember(c)); render(); if (typeof accountStart === "function") accountStart(); } else if (FB.err) render(); });
}
function exampleCharacter() {
  const b = newBuild();
  Object.assign(b, { name: "Ysolde (example)", level: 3, cls: "clerc", species: "nain", bg: "acolyte", langs: [K("Nain"), K("Draconique")], align: K("Loyal bon") });
  b.bonus = { mode: "21", p2: "sag", p1: "cha" };
  assignStandard(b);
  b.skillsClass = ["mede", "hist"];
  b.opts.order = "protecteur";
  b.magic.bg = { list: "clr", cant: ["assistance", "lumiere"], spell: "benediction", ab: "sag" };
  b.cant = ["flammesacree", "thaumaturgie", "epargnermourants"];
  b.prep = ["eclairtracant", "motguerison", "bouclierfoi", "armespirituelle", "silence", "injonction"];
  b.details.apparence = "Grey braids, armor engraved with forge runes.";
  b.details.histoire = "Guardian of a mountain temple, on the trail of a stolen relic. This is an example character: edit or delete it.";
  const p = newPlay(b);
  p.inv.push({ uid: uid(), ref: "a:cottemailles", n: "Chain Mail", q: 1, eq: true });
  p.inv.forEach((i) => { if (i.ref === "a:chemise") i.eq = false; });
  return { id: b.id, b, p };
}

/* Forge des Héros — aventures partagées (Firebase) et écran du maître du jeu */

const FB = {
  ok: false, db: null, auth: null, err: null,
  get uid() { return this.auth && this.auth.currentUser ? this.auth.currentUser.uid : null; },
  async init() {
    if (typeof firebase === "undefined" || typeof FIREBASE_CONFIG === "undefined" || !FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey) return;
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      this.auth = firebase.auth();
      this.db = firebase.firestore();
      // reprend la session existante (compte ou anonyme), sinon crée une session anonyme
      const user = await new Promise((res) => { const off = this.auth.onAuthStateChanged((u) => { off(); res(u); }); });
      if (!user) await this.auth.signInAnonymously();
      this.ok = true;
    } catch (e) { this.err = e && e.message; }
  },
  adv(code) { return this.db.collection("adventures").doc(code); },
  members(code) { return this.adv(code).collection("members"); },
};

const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newCode() { let c = ""; for (let i = 0; i < 6; i++) c += CODE_CHARS[rollDie(CODE_CHARS.length) - 1]; return c.slice(0, 3) + "-" + c.slice(3); }
function normCode(v) { const c = String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); return c.length === 6 ? c.slice(0, 3) + "-" + c.slice(3) : null; }

/* Aventures dont je suis le MJ (mémorisées localement + requête Firestore) */
const GmList = {
  get() { try { return JSON.parse(localStorage.getItem("forge-gm") || "[]"); } catch (e) { return []; } },
  add(code, name) { const l = this.get().filter((x) => x.code !== code); l.unshift({ code, name }); try { localStorage.setItem("forge-gm", JSON.stringify(l)); } catch (e) { } },
  remove(code) { try { localStorage.setItem("forge-gm", JSON.stringify(this.get().filter((x) => x.code !== code))); } catch (e) { } },
};

/* Écoute en direct d’une aventure (une seule à la fois) */
const Live = {
  code: null, doc: null, members: [], unsub: [],
  watch(code) {
    if (this.code === code) return;
    this.stop();
    if (!FB.ok || !code) return;
    this.code = code;
    this.unsub.push(FB.adv(code).onSnapshot((d) => { this.doc = d.exists ? d.data() : null; liveRender(); }, () => { }));
    this.unsub.push(FB.members(code).onSnapshot((q) => { this.members = q.docs.map((d) => ({ id: d.id, ...d.data() })); liveRender(); }, () => { }));
  },
  stop() { this.unsub.forEach((u) => u()); this.unsub = []; this.code = null; this.doc = null; this.members = []; },
};
let pendingRender = false;
function liveRender() {
  const a = document.activeElement;
  if (a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "checkbox"))) { pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => { if (pendingRender) { pendingRender = false; setTimeout(render, 0); } });

/* Synchronisation du personnage d’un joueur */
const pushTimers = {};
function pushMember(ch) {
  if (!FB.ok || !ch.adv) return;
  clearTimeout(pushTimers[ch.id]);
  pushTimers[ch.id] = setTimeout(() => {
    FB.members(ch.adv).doc(FB.uid + "_" + ch.id).set({ uid: FB.uid, charId: ch.id, name: ch.b.name, b: clone(ch.b), p: clone(ch.p), updated: Date.now() })
      .catch(() => toast("Can’t sync with the adventure right now."));
  }, 700);
}

/* ---------- Onglet Aventure de la fiche joueur ---------- */
function hpBar(hp, max) {
  const pct = Math.max(0, Math.min(100, (hp / Math.max(1, max)) * 100));
  const tone = hp <= 0 ? "out" : pct <= 50 ? "low" : "ok";
  return `<div class="mhp ${tone}"><i style="width:${pct}%"></i></div>`;
}
function memberStats(m) {
  try { migrate(m.b); return compute(m.b, m.p); } catch (e) { return null; }
}
function initOrder(doc) {
  const it = (doc && doc.init) || { list: [], turn: 0, round: 1 };
  const list = (it.list || []).slice().sort((a, b) => b.v - a.v || (b.dex || 0) - (a.dex || 0));
  return { list, turn: Math.min(it.turn || 0, Math.max(0, list.length - 1)), round: it.round || 1 };
}

function tabAdventure(ch) {
  if (!FB.ok) return `<section class="panel"><p class="mute">Adventure mode isn’t available in this version of the app.</p></section>`;
  if (!ch.adv) {
    return `<section class="panel adv-join"><h3 class="ph">Join an adventure</h3>
      <p class="mute">Enter the code your Game Master gave you. Your sheet will be shared with them and update automatically during play.</p>
      <div class="add-item"><label class="field"><span>Adventure code</span><input id="joinCode" placeholder="E.g. DRG-7K2" autocomplete="off" autocapitalize="characters" maxlength="7"></label><button class="btn primary" data-a="advJoin">Join</button></div>
    </section>`;
  }
  Live.watch(ch.adv);
  const doc = Live.doc;
  const ord = initOrder(doc);
  const mem = Live.members.map((m) => ({ m, s: memberStats(m) })).filter((x) => x.s);
  return `<div class="cols">
    <section class="panel"><div class="adv-head"><div><span class="eyebrow">Adventure</span><h3 class="ph">${esc(doc ? doc.name : "Loading…")}</h3></div><span class="code-chip">${esc(ch.adv)}</span></div>
      <p class="lbl">The party</p>
      <div class="party-mini">${mem.length ? mem.map(({ m, s }) => `<div class="pm ${m.charId === ch.id ? "me" : ""}"><div class="pm-top"><b>${esc(m.name)}</b><span class="mute small">${CLASSES[m.b.cls] ? CLASSES[m.b.cls].n : ""} ${m.b.level}</span></div>${hpBar(m.p.hp, s.hpMax)}<span class="mute small">${m.p.hp}/${s.hpMax} HP${m.p.cond && m.p.cond.length ? " · " + m.p.cond.map((x) => esc(COND_L[x] || x)).join(", ") : ""}</span></div>`).join("") : "<p class=\"mute small\">Nobody yet.</p>"}</div>
      <div class="row-btns"><button class="btn small ghost danger" data-a="advLeave">Leave the adventure</button></div>
    </section>
    <section class="panel"><h3 class="ph">Initiative</h3>
      ${ord.list.length ? `<p class="mute small">Round ${ord.round}</p><ol class="init-ro">${ord.list.map((e, i) => `<li class="${i === ord.turn ? "now" : ""} ${e.kind}"><span class="iv">${e.v}</span><b>${esc(e.name)}</b>${i === ord.turn ? "<span class=\"turn-tag\">their turn</span>" : ""}</li>`).join("")}</ol>` : "<p class=\"mute small\">The GM hasn’t started a combat yet.</p>"}

/* ---------- Actions ---------- */
async function saveInit(mutator) {
  const doc = Live.doc;
  if (!doc) return;
  const it = clone(doc.init || { list: [], turn: 0, round: 1 });
  it.list = it.list || [];
  mutator(it);
  try { await FB.adv(S.gmCode).update({ init: it }); } catch (e) { toast("Couldn’t save. Check your connection."); }
}
function sortedIds(it) { return it.list.slice().sort((a, b) => b.v - a.v || (b.dex || 0) - (a.dex || 0)).map((e) => e.id); }

async function advAct(a, d, el) {
  if (typeof accAct === "function" && (await accAct(a, d, el))) return true;
  const ch = curChar();
  switch (a) {
    case "advJoin": {
      const code = normCode($("#joinCode").value);
      if (!code) { toast("The code has 6 characters, for example DRG-7K2."); return true; }
      try {
        const snap = await FB.adv(code).get();
        if (!snap.exists) { toast("No adventure with this code. Check with your GM."); return true; }
        ch.adv = code; ch.advName = snap.data().name;
        await Store.put(ch);
        pushMember(ch);
        toast("You joined « " + snap.data().name + " »");
      } catch (e) { toast("Can’t connect. Check your network."); }
      return true;
    }
    case "advLeave": {
      const code = ch.adv;
      try { await FB.members(code).doc(FB.uid + "_" + ch.id).delete(); } catch (e) { }
      ch.adv = null; ch.advName = null; await Store.put(ch); Live.stop();
      toast("You left the adventure");
      return true;
    }
    case "advCreateOpen": S.modal = { k: "advCreate" }; return true;
    case "advCreate": {
      const name = ($("#advName").value || "").trim();
      if (!name) { toast("Give the adventure a name."); return true; }
      try {
        let code, tries = 0;
        do { code = newCode(); tries++; } while ((await FB.adv(code).get()).exists && tries < 5);
        await FB.adv(code).set({ name, gm: FB.uid, created: Date.now(), notes: "", init: { list: [], turn: 0, round: 1 } });
        GmList.add(code, name);
        S.modal = null; S.gmCode = code; S.gmTab = "groupe"; S.view = "gm";
        toast("Adventure created. Code: " + code);
      } catch (e) { toast("Couldn’t create it: check the Firebase configuration."); }
      return true;
    }
    case "gmOpen": S.gmCode = d.code; S.gmTab = "groupe"; S.view = "gm"; window.scrollTo(0, 0); return true;
    case "gmTab": S.gmTab = d.v; return true;
    case "copyCode": { try { await navigator.clipboard.writeText(S.gmCode); toast("Code copied: " + S.gmCode); } catch (e) { toast("Code: " + S.gmCode); } return false; }
    case "gmDetail": S.modal = { k: "gmDetail", id: d.id }; return true;
    case "gmKick": { try { await FB.members(S.gmCode).doc(d.id).delete(); toast("Character removed from the party"); } catch (e) { toast("Couldn’t delete."); } S.modal = null; return true; }
    case "advDeleteAsk": S.modal = { k: "advDelete" }; return true;
    case "advDelete": {
      try {
        const q = await FB.members(S.gmCode).get();
        await Promise.all(q.docs.map((x) => x.ref.delete()));
        await FB.adv(S.gmCode).delete();
      } catch (e) { }
      GmList.remove(S.gmCode); Live.stop(); S.modal = null; S.view = "home"; toast("Adventure deleted");
      return true;
    }
    case "initParty": {
      const mem = Live.members.map((m) => ({ m, s: memberStats(m) })).filter((x) => x.s);
      if (!mem.length) { toast("No players in the party yet."); return true; }
      await saveInit((it) => {
        it.list = it.list.filter((e) => e.kind !== "pc");
        mem.forEach(({ m, s }) => { const r = rollD20(s.init, "normal"); it.list.push({ id: "pc_" + m.id, kind: "pc", ref: m.id, name: m.name, v: r.total, dex: s.m.dex }); });
        it.turn = 0; it.round = 1;
      });
      toast("Initiative rolled for the party");
      return true;
    }
    case "monAdd": {
      const name = ($("#monName").value || "").trim() || "Monster";
      const n = Math.max(1, Math.min(20, parseInt($("#monN").value, 10) || 1));
      const bonus = parseInt($("#monInit").value, 10) || 0, hp = Math.max(1, parseInt($("#monHp").value, 10) || 1), ac = parseInt($("#monAc").value, 10) || 10;
      await saveInit((it) => {
        for (let i = 0; i < n; i++) { const r = rollD20(bonus, "normal"); it.list.push({ id: "m_" + uid(), kind: "monstre", name: n > 1 ? `${name} ${i + 1}` : name, v: r.total, dex: bonus, hp, max: hp, ac }); }
      });
      return true;
    }
    case "monHp": {
      const amt = Math.abs(parseInt(($("#mon-" + d.id) || {}).value, 10) || 1);
      await saveInit((it) => { const e = it.list.find((x) => x.id === d.id); if (e) e.hp = Math.max(0, Math.min(e.max, e.hp + amt * +d.d)); });
      return true;
    }
    case "initAdj": await saveInit((it) => { const e = it.list.find((x) => x.id === d.id); if (e) e.v += +d.d; }); return true;
    case "initDel": await saveInit((it) => { const ids = sortedIds(it), cur = ids[it.turn]; it.list = it.list.filter((x) => x.id !== d.id); const ni = sortedIds(it).indexOf(cur); it.turn = ni >= 0 ? ni : Math.min(it.turn, Math.max(0, it.list.length - 1)); }); return true;
    case "initNext": await saveInit((it) => { if (!it.list.length) return; it.turn = (it.turn || 0) + 1; if (it.turn >= it.list.length) { it.turn = 0; it.round = (it.round || 1) + 1; } }); return true;
    case "initPrev": await saveInit((it) => { if (!it.list.length) return; it.turn = (it.turn || 0) - 1; if (it.turn < 0) { it.turn = it.list.length - 1; it.round = Math.max(1, (it.round || 1) - 1); } }); return true;
    case "initClear": await saveInit((it) => { it.list = []; it.turn = 0; it.round = 1; }); return true;
  }
  return false;
}
